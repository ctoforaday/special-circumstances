---
# INSTALLS DOWNLOADED native-build ARTIFACTS UNDER THE NAMES A CLIENT LOOKS UP. An artifact holds
# one helper under its release asset name, <helper>_<os>_<arch>[.exe], and each of its ASSETS
# exports for that arch under the export's release name, exactly as the release publishes them;
# internal/nativehelper looks for <helper>[.exe] and each ASSETS line's installed file in
# NATIVE_HELPER_DIR, as fetch-bin.sh installs them into bin/. Each file in `from` ending in
# `_<os>_<arch><ext>` is copied to `to` without that suffix and made executable; for each such
# helper, every `<installed file> <export>` pair nativedigest -assets prints for the arch is copied
# from `from`/<export> to `to`/<installed file>. Each copy is named in the log. A `from` with no
# helper, or missing an export its helper's ASSETS names for the arch, fails. Go must be set up:
# nativedigest is the one reader of ASSETS.
name: install-helpers
description: Install native helper artifacts and their ASSETS exports under their lookup names
inputs:
  from:
    description: directory the artifacts were downloaded into
    required: true
  to:
    description: directory NATIVE_HELPER_DIR names
    required: true
  os:
    description: the target's GOOS
    required: true
  arch:
    description: the target's GOARCH
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        HOS: ${{ inputs.os }}
        HARCH: ${{ inputs.arch }}
      run: |
        ext=""
        [ "$HOS" = "windows" ] && ext=".exe"
        suffix="_${HOS}_${HARCH}${ext}"
        mkdir -p "$TO"
        n=0
        for f in "$FROM"/*"$suffix"; do
          [ -f "$f" ] || continue
          helper="$(basename "$f" "$suffix")"
          cp "$f" "$TO/$helper$ext"
          chmod +x "$TO/$helper$ext"
          echo "installed $(basename "$f") as $TO/$helper$ext"
          n=$((n + 1))
          pairs="$(go -C plugins/frank-exchange-of-views/tools run ./devcmd/nativedigest -assets "$helper" -arch "$HARCH")" || {
            echo "::error::nativedigest -assets $helper -arch $HARCH failed"
            exit 1
          }
          while read -r file export; do
            [ -n "$file" ] || continue
            if [ ! -f "$FROM/$export" ]; then
              echo "::error::$FROM holds no $export, the $HARCH export $helper loads as $file"
              exit 1
            fi
            cp "$FROM/$export" "$TO/$file"
            echo "installed $export as $TO/$file"
          done <<<"$pairs"
        done
        if [ "$n" -eq 0 ]; then
          echo "::error::$FROM holds no helper for ${HOS}/${HARCH}"
          exit 1
        fi

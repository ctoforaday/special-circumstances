name: embed-bench

# CPU embedding-engine benchmark on hosted runners. Runs only on the bench branch or by hand.
# Each job builds OpenBLAS, llama.cpp and the Go probes from source on its own host and caches nothing,
# so no arm can pick up another host's build.
on:
  push:
    branches: [bench/embed-engines]
    # The ortstatic probe shares this branch; its pushes run its own workflow, not this benchmark.
    paths-ignore: ["bench/ortstatic/**", ".github/workflows/ortstatic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64-1, os: ubuntu-24.04 }
          - { name: x64-2, os: ubuntu-24.04 }
          - { name: x64-3, os: ubuntu-24.04 }
          - { name: x64-4, os: ubuntu-24.04 }
          - { name: x64-5, os: ubuntu-24.04 }
          - { name: arm64-1, os: ubuntu-24.04-arm }
          - { name: arm64-2, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: host
        run: |
          lscpu
          grep -m1 -E '^(flags|Features)' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx512|sve|asimd)' | sort -u | tr '\n' ' '; echo
          uptime
      - name: build
        run: bash bench/embed/build.sh bench/embed "$RUNNER_TEMP/w"
      - name: run
        run: bash bench/embed/run.sh bench/embed "$RUNNER_TEMP/w" "$RUNNER_TEMP/results-${{ matrix.name }}"
      - name: collect build logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results-${{ matrix.name }}/build"
          cp "$RUNNER_TEMP"/w/*.log "$RUNNER_TEMP/results-${{ matrix.name }}/build/" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: ${{ runner.temp }}/results-${{ matrix.name }}
          if-no-files-found: warn

          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.

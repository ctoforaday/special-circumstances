name: hooks

on:
  push:
    branches: ["**"]
    tags: ["*--v*"]
  pull_request:

defaults:
  run:
    working-directory: plugins/prosthetic-conscience/tools

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...

  debate-sim:
    # Zero-token regression suite for the FEOV debate engine: the simulator stubs the
    # Workflow runtime's agent() contract and drives every branch of debate.js.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test plugins/frank-exchange-of-views/tests/simulator/debate.test.mjs plugins/frank-exchange-of-views/tests/simulator/cost-audit.test.mjs plugins/frank-exchange-of-views/tests/simulator/run-scripts.test.mjs
      - name: Validate all tracked JSON (manifests break silently)
        run: node .github/validate-json.mjs

  release:
    # Cross-compile + publish binaries when a plugin version tag is pushed (e.g. prosthetic-conscience--v0.1.0).
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '--v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Cross-compile
        run: |
          mkdir -p dist
          for cmd in cmd/*/; do
            name="$(basename "$cmd")"
            for pair in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              os="${pair%/*}"; arch="${pair#*/}"; ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
                -o "dist/${name}_${os}_${arch}${ext}" "./cmd/${name}"
            done
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/prosthetic-conscience/tools/dist/*

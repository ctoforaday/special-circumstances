name: hooks

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:

defaults:
  run:
    working-directory: plugins/prosthetic-conscience/tools

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...

  feov-record:
    # The FEOV seat-side record runtime (plans/record-tool.md R2g). Its own Go
    # module, so the prosthetic-conscience job's working-directory does not reach
    # it. -race is the point of the port being Go at all: the mjs implementation
    # could only spawn processes and check that nothing was visibly lost, which
    # passes right up until an interleaving the test did not happen to hit.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/frank-exchange-of-views/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...
      # Race detection needs cgo, which needs a C toolchain; both CI images ship
      # one, so this leg runs where a developer box may not be able to.
      - run: go test -race ./internal/record/
        env:
          CGO_ENABLED: "1"

  qlty:
    # The quality gate had no CI leg at all: `qlty` is a documented recommended
    # tool, sc-quality-gate exists to run it, qlty-proficiency mandates it during
    # verification — and nothing on a pull request ever invoked it. Enforcement
    # lived entirely on whichever developer box happened to touch the code.
    #
    # NOT YET A REAL GATE. `.qlty/qlty.toml` is still the starter committed at
    # bootstrap (config_version = "0", no plugins), and its own comment says to
    # run `qlty init` once qlty is installed. Until that lands, `qlty check` has
    # little or nothing enabled to check, so this job would pass vacuously — the
    # exact "green suite over an unprotected invariant" defect tracked in #80.
    # The plugin-count step below exists to make that visible in the log instead
    # of letting a green tick imply coverage it does not have. It reports; it
    # does not fail, because failing the whole pipeline over a known-empty
    # config helps nobody.
    #
    # `qlty check` is diff-scoped by default, hence fetch-depth 0 and an explicit
    # base — same reason rule-sweep needs them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install qlty
        # The command requirements.json documents for humans, run the same way.
        run: |
          curl -fsSL https://qlty.sh | bash
          echo "${HOME}/.qlty/bin" >> "$GITHUB_PATH"
      - name: Version
        run: qlty --version
      - name: Report whether anything is actually enabled
        # Loud, non-failing vacuity check: a reader of this log can tell whether
        # a green result meant "clean" or "nothing configured".
        run: |
          echo "--- .qlty/qlty.toml ---"
          cat .qlty/qlty.toml
          if grep -qE '^\s*\[\[?plugin' .qlty/qlty.toml; then
            echo "PLUGINS: at least one declared — a green check below is meaningful."
          else
            echo "PLUGINS: NONE DECLARED — a green check below proves nothing."
            echo "Run 'qlty init' on a machine with qlty and commit .qlty/qlty.toml (#80)."
          fi
      - name: Check
        # Exactly the command the in-repo cheatsheet documents. No invented
        # flags: qlty is not installable in the authoring container (egress
        # policy blocks qlty.sh, github.com and the GHCR blob CDN), so anything
        # beyond the documented invocation could not be verified before merge.
        run: qlty check

  rule-sweep:
    # A rule patch must name its class and sweep its siblings
    # (feov-memory/protocol-class-registry.md). Every protocol patch that shipped
    # before this check recurred in adjacent form — four for four — because each
    # fix was an INSTANCE fix and the class survived at the next seat.
    #
    # fetch-depth 0 and an explicit base: the check reads the branch's COMMIT
    # MESSAGES, which a shallow clone does not have.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/rule-sweep.mjs --selftest
      - run: node scripts/rule-sweep.mjs --base origin/${{ github.base_ref }}

  goldens:
    # Goldens are a contract, so STALENESS IS A FAILURE: a behaviour change that
    # was never re-recorded must not merge quietly. This runs the same command a
    # developer runs, without --update, across both languages.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: node scripts/golden.mjs

  debate-sim:
    # Zero-token regression suite for the FEOV debate engine: the simulator stubs the
    # Workflow runtime's agent() contract and drives every branch of debate.js.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Files are enumerated, never globbed: `node --test <dir>` fails on Windows,
      # and an explicit list is the only thing that keeps a new suite from being
      # silently uncovered. record.test.mjs went unlisted for its whole life and
      # never ran in CI once — the reader suite that replaced it is listed here.
      - run: node --test plugins/frank-exchange-of-views/tests/simulator/debate.test.mjs plugins/frank-exchange-of-views/tests/simulator/cost-audit.test.mjs plugins/frank-exchange-of-views/tests/simulator/run-scripts.test.mjs plugins/frank-exchange-of-views/tests/simulator/run-dashboard.test.mjs plugins/frank-exchange-of-views/tests/simulator/record-readers.test.mjs plugins/frank-exchange-of-views/tests/simulator/prompts.test.mjs plugins/frank-exchange-of-views/tests/simulator/scorecards.test.mjs plugins/frank-exchange-of-views/tests/simulator/read-batching.test.mjs
      - name: Validate all tracked JSON (manifests break silently)
        run: node .github/validate-json.mjs
      - name: Hook bootstrap guards degrade gracefully (empty-bin window must never crash-storm)
        run: |
          EMPTY="$(mktemp -d)"
          node -e "
            const h = require('./plugins/prosthetic-conscience/hooks/hooks.json');
            const cmds = [];
            for (const evs of Object.values(h.hooks)) for (const e of evs) for (const k of e.hooks) cmds.push(k.command);
            require('fs').writeFileSync('/tmp/hook-cmds.txt', cmds.join('\n') + '\n');
            console.log(cmds.length + ' hook command(s) extracted');
          "
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            if ! CLAUDE_PLUGIN_ROOT="$EMPTY" bash -c "$cmd" </dev/null >/dev/null 2>/tmp/hook-stderr.txt; then
              echo "GUARD FAILED (non-zero exit) for: $cmd"; exit 1
            fi
            grep -q "doctor --fix" /tmp/hook-stderr.txt || { echo "guard warning missing for: $cmd"; exit 1; }
          done < /tmp/hook-cmds.txt
          echo "all hook commands exit 0 with the guard warning on an empty plugin root"

  release:
    # Cross-compile + publish binaries when a plugin version tag is pushed.
    #
    # The tag NAMES THE PLUGIN: <plugin>--v<version>, e.g.
    # prosthetic-conscience--v0.9.0 or frank-exchange-of-views--v0.9.10. This job
    # used to be hardcoded to prosthetic-conscience through the workflow-level
    # working-directory, which meant a FEOV tag would have built PC's binaries
    # and published them under FEOV's release — silently, since the build would
    # succeed. Deriving the plugin from the tag is what makes a second plugin
    # with a binary possible at all.
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '--v')
    needs: [test, feov-record]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Resolve the plugin from the tag
        id: plugin
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%%--v*}"
          dir="plugins/${plugin}/tools"
          if [ ! -f "${dir}/go.mod" ]; then
            echo "tag ${tag} names plugin '${plugin}', which has no Go module at ${dir}"
            echo "(a plugin with no binaries should not carry a version tag that triggers a release)"
            exit 1
          fi
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile
        working-directory: ${{ steps.plugin.outputs.dir }}
        run: |
          mkdir -p dist
          for cmd in cmd/*/; do
            name="$(basename "$cmd")"
            for pair in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              os="${pair%/*}"; arch="${pair#*/}"; ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w"                 -o "dist/${name}_${os}_${arch}${ext}" "./cmd/${name}"
            done
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.plugin.outputs.dir }}/dist/*

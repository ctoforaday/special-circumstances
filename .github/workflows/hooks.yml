          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...
        env:
          # THE FUZZ WORKERS WAIT MORE ON WINDOWS, so the sweep runs more of them. The
          # default is NumCPU*3 (see integration/fuzz: runs are subprocess-bound and the
          # goroutines mostly wait), and the Windows waits are longer per invocation —
          # CreateProcess and NTFS fsync both cost more — so the same multiplier leaves
          # cores idler here. Each run owns its own database, so cross-run contention is
          # zero and oversubscription is safe; the bound is the disk queue, which the dev
          # drive step above just widened. Linux passes empty, keeping the in-code
          # default: its waits are short enough that NumCPU*3 already saturates.

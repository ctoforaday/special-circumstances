          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          # SCRIPTS, NOT FEOV, because that is what this job actually builds. Its Go work is
          # `go run ./mjsparity`, `./mutate`, `./validatejson`, `./frontmatter`, `./decisions`
          # and `./pluginparity` — every one of them a scripts-module tool. It declared the
          # feov module, which it never builds, and the key did exactly as it was told: this
          # job saved an 18 MB cache under the feov key at 08:00:28 and feov-record (ubuntu),
          # which builds ~280 MB, was refused at 08:05:54 with "Unable to reserve cache with
          # key ... another job may be creating this cache". A primary-key hit skips the save,
          # so the big job would have restored the small one's cache until feov's go.sum moved.
          #
          # The bug was the DECLARATION, not the keying. Sharing a key with rule-sweep and
          # scripts is now correct rather than accidental: all three build the same module on
          # the same platform, so they are one cache domain and should have one cache. The
          # invariant is not "a key per job" — it is a key per (module, platform), and jobs
          # that build the same thing SHOULD share one.
          cache-dependency-path: |
            scripts/go.sum
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      # Files are enumerated, never globbed: `node --test <dir>` fails on Windows,
      # and an explicit list is the only thing that keeps a new suite from being
      # silently uncovered. record.test.mjs went unlisted for its whole life and
      # never ran in CI once — the reader suite that replaced it is listed here.
      - run: >-
          node --test
          plugins/frank-exchange-of-views/tests/simulator/debate.test.mjs
          plugins/frank-exchange-of-views/tests/simulator/prompts.test.mjs
      # The list above is enumerated, not globbed (`node --test <dir>` fails on Windows),
      # and `node --test` exits 0 on a path that does not exist. So the enumeration needs
      # its own guard, or it drifts silently in both directions — measured 2026-07-30:
      # two of the four suites named here had been deleted and CI was green.
      - name: The enumerated mjs suites match the tree (node --test exits 0 on a missing path)
        run: go run ./mjsparity
        working-directory: scripts
      # The SWEEP is not run in CI — it is minutes long and its residue is judgement.
      # Its self-test is, for the reason rule-sweep carries one: a mutation tool that
      # stops generating mutants reports `0 survived` and reads as a clean bill of health.
      # Seconds here; the alternative is trusting a number nothing checks.
      - name: The mutation sweep can still mutate and observe (a silent one flatters)
        run: go run ./mutate -selftest
        working-directory: scripts
      - name: Validate all tracked JSON (manifests break silently)
        run: go run ./validatejson
        working-directory: scripts
      - name: Every frontmatter block parses (a broken one drops ALL its fields, silently)
        # Claude Code answers a frontmatter parse failure by loading the file with
        # empty metadata rather than by raising, so an agent that declared tools and
        # skills runs with neither and looks exactly like one that never declared
        # them. probe.md sat broken this way; `claude plugin validate` catches it and
        # nothing here ran `claude plugin validate`.
        run: go run ./frontmatter
        working-directory: scripts
      - name: Every recorded decision names the issue that tracks it
        # A decision with no issue is not resolved — it is recorded, which is a different
        # thing. The seat-command trigger map held four decisions under a heading reading
        # "Resolved decisions", TWO of which had never been executed, plus a set of
        # collapses in the same state. Nothing reported it: a decision never carried out
        # is byte-identical to one that was, because the only artifact either produces is
        # a paragraph saying it was decided. An independent trace rediscovered two of them
        # from scratch. This is facts-are-fields applied to our own process — the decision
        # now carries a field a writer can be refused on.
        run: go run ./decisions
        working-directory: scripts
      - name: Every marketplace plugin is installed by both bootstrap paths
        # The plugin list is written down THREE times — the marketplace manifest,
        # the bootstrap script, and the pasteable snippet in docs/setup-script.md.
        # gray-area shipped and reached none of the other two: a fresh environment
        # installed three of four plugins and said nothing, because a plugin that
        # is never named is indistinguishable from a plugin that does not exist.
        run: go run ./pluginparity
        working-directory: scripts
      - name: Cross-module fixtures agree (a shape both modules restate drifted once, silently)
        run: go run ./fixtureparity
        working-directory: scripts
      - name: Fixtures stage the vocabulary the plugin ships (a renamed class would pass either way)
        run: go run ./classgen -check
        working-directory: scripts
      - name: Every module's buildid matches the one authored copy
        run: go run ./buildidgen -check
        working-directory: scripts
      - name: The record binary and the plugin read the same event schema
        run: go run ./schemagen -check
        working-directory: scripts
      - name: Hook bootstrap guards degrade gracefully (empty-bin window must never crash-storm)
        # Enumerates EVERY plugin's hooks.json, not just prosthetic-conscience's.
        # Naming one plugin was correct while it shipped the only hooks; a second
        # plugin with hooks would have been silently uncovered by a check that
        # still passed — the same shape as the unlisted test suite two steps up.
        run: |
          EMPTY="$(mktemp -d)"
          node -e "
            const { globSync } = require('fs');
            const files = globSync('plugins/*/hooks/hooks.json');
            if (!files.length) { console.error('no hooks.json found — the glob is wrong'); process.exit(1); }
            const cmds = [];
            for (const f of files) {
              const h = JSON.parse(require('fs').readFileSync(f, 'utf8'));
              for (const evs of Object.values(h.hooks)) for (const e of evs) for (const k of e.hooks) cmds.push(k.command);
            }
            require('fs').writeFileSync('/tmp/hook-cmds.txt', cmds.join('\n') + '\n');
            console.log(files.length + ' hooks.json, ' + cmds.length + ' hook command(s) extracted');
          "
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            if ! CLAUDE_PLUGIN_ROOT="$EMPTY" bash -c "$cmd" </dev/null >/dev/null 2>/tmp/hook-stderr.txt; then
              echo "GUARD FAILED (non-zero exit) for: $cmd"; exit 1
            fi
            grep -q "doctor --fix" /tmp/hook-stderr.txt || { echo "guard warning missing for: $cmd"; exit 1; }
          done < /tmp/hook-cmds.txt
          echo "all hook commands exit 0 with the guard warning on an empty plugin root"


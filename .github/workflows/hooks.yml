          # held ZERO, which is why a first run rebuilt the standard library every time.
          # A scheduled run executes on main's ref at full depth, so it writes exactly the
          # caches a later pull request wants.
          #
          # THE CONDITION IS THE INVARIANT, STATED: `!= push`. Both dangerous cases are the
          # same event — a main push and a tag build are both event_name == push — so the
          # rule the comment above spent a paragraph describing is now the expression
          # itself, and it cannot drift out of step with a list of events somebody has to
          # remember to extend. A release run still neither writes a cache nor restores
          # one. Everything that is NOT a push — pull requests, the nightly, a manual
          # dispatch — may cache, and the last two are the ones that put a cache on MAIN
          # for a new branch to restore.
          # zizmor cannot evaluate the expression below, so its cache-poisoning rule fires
          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # The modules are not at the repo root, and setup-go's default lookup is — with
          # nothing here, cache:true fails on a missing go.sum. Keyed on every module's
          # sum: a dependency bump anywhere invalidates all jobs' caches, which is rare
          # enough to be the right trade against four hand-kept per-job paths.
          # NOTHING BUT THE DEPENDENCY FILES IS IN THE KEY, and hooks.yml used to be. That
          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            plugins/frank-exchange-of-views/tools/go.sum
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      # FUZZ_C stays at the in-code default. Raising it to 24 on Windows was tried and
      # MEASURED WRONG: the fuzz itself improved (403s -> 368s) but `go test ./...` runs
      # sibling package binaries in parallel, so the "idle" cores the oversubscription
      # was meant to fill were already running cli, recordsql and capture — which starved
      # (cli 180s -> 411s). Net negative at machine level; the premise ignored
      # inter-package parallelism.
      #
      # SHALLOW ON WINDOWS PULL REQUESTS, FULL EVERYWHERE ELSE. Once the RAM disk owns the
      # I/O bill, the Windows leg's remaining cost is integration/fuzz, which shells the
      # real binary ~50-70 times per run and pays Windows process-spawn cost on every one:
      # 573s of the leg's 12-minute `go test ./...` (run 32813820292), against 106s for
      # recordsql. -short takes the fuzz from 60 runs to 15. What a run proves about the
      # PLATFORM — the .exe build, the spawns, the temp plumbing — run 15 proves as well as
      # run 60; the depth beyond that is statistics on debate semantics, platform-
      # independent and still at full depth on the Linux twin of this job, on every main
      # push and tag build (a pull request is the only event that shallows), and on the
      # nightly schedule.
      #
      # The packages where Windows has actually caught defects (record, recordsql: the DSN
      # truncation, the unclosed handle — plans commit f772105) carry NO testing.Short()
      # guard, so -short leaves them at FULL depth. The invariant to keep: a Short gear
      # added to those packages reopens exactly the hole this arrangement routes around.
      # seatprobe's separated-build test inverts its guard on Windows for the same reason,
      # stated there.
      #
      # Both ternary arms are workflow literals, so this ${{ }} expands no external input —
      # which is why it may sit in the run line where rule-sweep's base ref may not.
      - run: go test ${{ (github.event_name == 'pull_request' && runner.os == 'Windows') && '-short' || '' }} ./...
      # Race detection needs cgo, which needs a C toolchain; both CI images ship
      # one, so this leg runs where a developer box may not be able to.
      - run: go test -race ./internal/record/
        env:
          CGO_ENABLED: "1"
      # And ONE test out of integration/fuzz, not the package. The fuzz runner's seats are
      # concurrent as of #630 phase 3, and its run handle was briefly resolved lazily — a real
      # race that two full debate runs under -race did not report, because the window closes
      # before a sibling seat arrives. TestTheRunHandleIsImmutableAfterConstruction forces it
      # in ~1s. Racing the whole package would cost minutes to re-check what -race already
      # covers elsewhere; racing nothing leaves that test unable to fail.
      #
      # THE PASS IS ASSERTED, NOT INFERRED FROM THE EXIT CODE. `go test -run <name>` exits 0
      # when the pattern matches NOTHING — it prints "ok ... [no tests to run]" — so a renamed
      # or deleted test would leave this step green forever while guarding nothing. That is the
      # plausible zero this leg exists to refuse, so the step greps for the test's own PASS line
      # and fails loudly when it is absent.
      - run: |
          out=$(go test -race -v -run '^TestTheRunHandleIsImmutableAfterConstruction$' ./integration/fuzz/ 2>&1)
          echo "$out"
          grep -q '^--- PASS: TestTheRunHandleIsImmutableAfterConstruction' <<<"$out" || {
            echo "::error::the run-handle race guard did not run; -run matched no test (renamed or deleted?)"
            exit 1
          }
        # EXPLICIT, because this job sets no default shell and the Windows leg therefore runs
        # pwsh — where `$(...)`, `<<<` and `grep` are not syntax. The single-line form this
        # replaced ran on Windows by accident: pwsh could execute a bare `go test` line, so the
        # shell question never came up until the assertion made the step a script.
        shell: bash
        env:
          CGO_ENABLED: "1"

  gray-area:
    # The trajectory-capture runtime. Its own Go module, so neither the
    # prosthetic-conscience job's working-directory nor the feov-record job's
    # reaches it — a third module is invisible to CI until it has a leg of its
    # own, which is how record.test.mjs went its whole life without running.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/gray-area/tools
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      # THE TEST TEMP DIR IS THE SUITE'S REAL SUBSTRATE, and on windows-2025 it is the slow
      # one. These runner images removed the D: drive (actions/runner-images#12647), so TEMP
      # lives on C: - network-attached storage benchmarked at ~33 MB/s in that issue - and
      # every t.TempDir SQLite database pays it: on the dev drive alone, recordsql tests ran
      # 73s, the fsync tax a ReFS VHDX backed by C: still honors. Defender is NOT the cause,
      # and an earlier note here that called it "passive" was wrong: measured at job runtime
      # (PR #562), AMRunningMode is Normal but RealTimeProtection and OnAccessProtection are
      # already False, so file scanning is off and disabling it changes nothing.
      #
      # TWO DEVICES, because the two costs differ and no single substrate wins both
      # (measured across PRs #559/#561/#563/#565):
      #   - BUILD CACHES on a DEV DRIVE (V:): a ReFS VHDX with antivirus in async mode,
      #     created inline rather than via a third-party action (ten lines of PowerShell is
      #     cheaper to trust than a tag). The compile win - vet 2m -> 15s on a warm cache.
      #   - TEMP on a KERNEL-MODE RAM DISK (X:, ImDisk): the fsync every test database pays
      #     lands in RAM with no backing store, which the dev drive's VHDX-on-C: could not -
      #     recordsql 73s -> 5s, cli 195s -> 61s. It MUST be kernel-mode: a user-mode
      #     filesystem (WinFsp memfs) routes every process spawn's exe-image load through a
      #     user-mode round-trip (cli 149-334s across the two memfs builds, PR #563), where
      #     the kernel storage stack has no such hop. TEMP only, not the caches: keeps the
      #     RAM footprint small so fuzz's spawn storm - spawn/compute-bound and
      #     storage-independent, no RAM disk moved it - is not squeezed for memory.
      # THE LINUX MIRROR is tmpfs, two lines because tmpfs already exists. Same posture:
      # synchronous stays FULL (operator ruling); the fsyncs land in RAM. Measured on a GCP
      # dev box: recordsql -84%, record -64%, cli -43%. It does not move the PR gate today -
      # Windows is the slowest check - but it is nearly free and cuts real compute.
      - name: tmpfs for TEMP
        if: runner.os == 'Linux'
        run: |
          mkdir -p /dev/shm/tmp
          echo "TMPDIR=/dev/shm/tmp" >> "$GITHUB_ENV"
      - name: dev drive for build caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = "C:\dev.vhdx"
          New-VHD -Path $vhd -SizeBytes 20GB -Dynamic | Out-Null
          $disk = Mount-VHD -Path $vhd -PassThru | Initialize-Disk -PassThru
          $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter V
          Format-Volume -DriveLetter V -DevDrive | Out-Null
          # setup-go resolves GOCACHE/GOMODCACHE through `go env` when ITS step runs, and
          # this step runs first, so exporting the paths here lands the pull-request cache
          # restore on the dev drive. TEMP is deliberately NOT here - it is the RAM disk's.
          "GOCACHE=V:\gocache"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "GOMODCACHE=V:\gomod"  | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: RAM disk for TEMP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Kernel-mode RAM disk (ImDisk, from the choco package already on the runner).
          # Kernel-mode, not user-mode, on purpose: a spawn's exe-image load goes through the
          # normal kernel storage stack with no user-mode round-trip, the tax that made
          # WinFsp memfs regress the spawn-heavy packages (PR #563/#565). 4 GiB is ample for
          # TEMP alone (test databases + fuzz run dirs + one built binary) and small enough
          # to leave the runner's RAM for the test processes.
          #
          # BEST EFFORT, AND LOUD ABOUT IT. The RAM disk is an optimisation whose own
          # measurement put it near break-even, so a flaky package install must not fail the
          # build — TMP already points at the dev drive, and leaving it there costs seconds
          # rather than correctness. What it must never do is degrade SILENTLY: a run that
          # quietly stopped using the RAM disk looks exactly like one that used it.
          #
          # MEASURED, the first time this bit: `choco install ... | Out-Null` threw the
          # install's own log away, so a failed install surfaced two lines later as
          # "The term 'imdisk' is not recognized" and took the whole Windows leg with it.
          # The install's output is now kept and printed WHEN IT MATTERS, which is the
          # only time anyone wants to read it.
          $log = (choco install imdisk-toolkit -y --no-progress 2>&1 | Out-String)
          $imdisk = (Get-Command imdisk.exe -ErrorAction SilentlyContinue).Source
          if (-not $imdisk) {
            foreach ($p in @("$env:SystemRoot\System32\imdisk.exe",
                             "$env:ProgramFiles\ImDisk\imdisk.exe",
                             "${env:ProgramFiles(x86)}\ImDisk\imdisk.exe")) {
              if (Test-Path $p) { $imdisk = $p; break }
            }
          }
          if (-not $imdisk) {
            Write-Host "::warning::ImDisk did not install, so TEMP stays on the dev drive (V:). The run is slower, not wrong. choco said:"
            Write-Host $log
            exit 0
          }
          & $imdisk -a -s 4G -m X: -p "/fs:ntfs /q /y"
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path "X:\")) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "::warning::ImDisk installed but never mounted X:, so TEMP stays on the dev drive (V:)."
              exit 0
            }
            Start-Sleep -Milliseconds 500
          }
          New-Item -ItemType Directory -Path "X:\tmp" | Out-Null
          "TMP=X:\tmp"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=X:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TEMP is on the kernel-mode RAM disk (X:)."
      - uses: actions/setup-go@v7
        with:
          # CACHED ON PULL REQUESTS ONLY, and the release path stays cache-free — which is
          # a sharper version of the blanket `cache: false` that stood here, not a retreat
          # from it. The poisoning path (zizmor/cache-poisoning) needs a cache the TAG run
          # can restore, and a run can only restore caches from its own ref or the default
          # branch. A pull request's cache lives on its merge ref, invisible to a tag; the
          # dangerous caches are MAIN's, which only `push` events would write — and this
          # workflow pushes only on main and tags, so with the condition below neither ever
          # writes one (a tag build is event_name == push, so this is false there too).
          # The invariant to keep: if caching is ever enabled for `push`, the release build
          # starts restoring main's caches and the original finding reopens.
          #
          # THE NIGHTLY SEEDS THE CACHE MAIN OTHERWISE NEVER HAD, and that is what makes a
          # pull request's FIRST run warm rather than only its later ones. A run restores
          # caches from its own ref or the default branch; saving on pull_request alone put
          # every cache on a merge ref, so a new branch could see none of them. Measured
          # before this line changed: 100 of 100 caches sat on refs/pull/N/merge and main
          # held ZERO, which is why a first run rebuilt the standard library every time.
          # A scheduled run executes on main's ref at full depth, so it writes exactly the
          # caches a later pull request wants.
          #
          # THE CONDITION IS THE INVARIANT, STATED: `!= push`. Both dangerous cases are the
          # same event — a main push and a tag build are both event_name == push — so the
          # rule the comment above spent a paragraph describing is now the expression
          # itself, and it cannot drift out of step with a list of events somebody has to
          # remember to extend. A release run still neither writes a cache nor restores
          # one. Everything that is NOT a push — pull requests, the nightly, a manual
          # dispatch — may cache, and the last two are the ones that put a cache on MAIN
          # for a new branch to restore.
          # zizmor cannot evaluate the expression below, so its cache-poisoning rule fires
          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # The modules are not at the repo root, and setup-go's default lookup is — with
          # nothing here, cache:true fails on a missing go.sum. Keyed on every module's
          # sum: a dependency bump anywhere invalidates all jobs' caches, which is rare
          # enough to be the right trade against four hand-kept per-job paths.
          # NOTHING BUT THE DEPENDENCY FILES IS IN THE KEY, and hooks.yml used to be. That
          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            plugins/gray-area/tools/go.mod
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - run: go test ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  stackguard:
    # A stacked pull request must not merge into a base that is already in main.
    #
    # #633 did exactly that on 2026-08-28: #631 merged its base `record-run-read-leaves` into
    # main at 17:00 without deleting the branch, and #633 merged INTO that branch at 19:47.
    # GitHub marked #633 MERGED; main never received a line of its 131 files. Every check on
    # it passed, because every check asked whether the content was good and none asked where
    # it was going.
    #
    # TWO TRIGGERS, BECAUSE ONE CANNOT COVER IT. The pull-request leg refuses a stack opened
    # onto an already-merged base — and would NOT have caught #633, whose base was still live
    # when its checks ran. The push-to-main leg is the one that would: every time main moves it
    # asks whether that push just absorbed the base of an open pull request. On the real
    # timeline it fires at 17:00, three hours before the mis-merge.
    #
    # fetch-depth 0, because the check resolves origin/<base> and asks whether it is an
    # ancestor of origin/main. A shallow clone answers that question wrong rather than not at
    # all, which is why stackguard resolves the ref explicitly and exits 2 when it cannot.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      # The sweep leg reads open pull requests. The pull-request leg needs none of this — it is
      # pure git — but a job-level block is per-job, not per-step.
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/go.mod
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: scripts/go.sum
      # The guard's own suite runs first and unconditionally. It reconstructs #633's branch
      # shape in a scratch repository and asserts the answer flips when the base merges — a
      # containment check that stopped answering would otherwise report every stack as live,
      # which is byte-identical to a clean board.
      - run: go test ./stackguard/
        working-directory: scripts
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./stackguard -base "$BASE_REF"
        working-directory: scripts
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./stackguard -sweep
        working-directory: scripts

  rule-sweep:
    # A rule patch must name its class and sweep its siblings
    # (feov-memory/protocol-class-registry.md). Every protocol patch that shipped
    # before this check recurred in adjacent form — four for four — because each
    # fix was an INSTANCE fix and the class survived at the next seat.
    #
    # fetch-depth 0 and an explicit base: the check reads the branch's COMMIT
    # MESSAGES, which a shallow clone does not have.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Pull requests and the nightly, for the reason the first setup-go states in full:
          # a tag run restores nothing because `push` stays cache-free, while the schedule
          # writes the main-scoped cache a new pull-request branch can actually restore.
          # zizmor cannot evaluate the expression below, so its cache-poisoning rule fires
          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # NOTHING BUT THE DEPENDENCY FILES IS IN THE KEY, and hooks.yml used to be. That
          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            scripts/go.sum
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      # The base ref goes through the environment, never through a `${{ }}` expansion
      # inside the shell line: template expansion happens BEFORE the shell sees the
      # command, so an expanded value is code rather than an argument.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./rulesweep -base "origin/$BASE_REF"
        working-directory: scripts
      # A version that goes BACKWARDS ships nothing. Measured 2026-07-31: #198 set
      # prosthetic-conscience to 0.22.0, #195 branched earlier and carried 0.21.0, and the
      # later merge won the line — main kept both features' content at a version already
      # shipped, so `/plugin update` would deliver neither. No test failed and no guard
      # fired, because CLAUDE.md's first bullet had no mechanism behind it.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./versionguard -base "origin/$BASE_REF"
        working-directory: scripts
      # Archaeology added to a surface an agent READS — a retirement notice, an "it used
      # to", a mode that is gone. Every seat then spends context on something it cannot
      # act on. Swept by hand once; the count went UP during the same session, because an
      # unrelated branch landed fresh sites while the sweep was in flight. A sweep with
      # nothing checking it is policy-without-mechanism, a class in the same registry.
      #
      # The selftest runs FIRST and unconditionally: a matcher whose patterns went stale
      # reports zero findings, which is byte-identical to a clean diff.
      - run: go run ./archaeology -selftest
        working-directory: scripts
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./archaeology -base "origin/$BASE_REF"
        working-directory: scripts

  scripts:
    # The repo's dev tooling, now Go: rule-sweep, golden, the four CI guards and the
    # mutation sweep. Its own module at scripts/, deliberately NOT under a plugin's
    # tools/cmd — sc-doctor discovers hook binaries with ReadDir(<plugin>/tools/cmd) and
    # would report every dev tool as an unbuilt binary that `--fix` then tries to fetch
    # from a release.
    #
    # This leg is where the guards' own tests live. Before the port they had none: five of
    # the six were unverified prose, and rule-sweep's `--selftest` was the lone exception
    # (#157 §3). A guard nothing tests is indistinguishable from a clean repo.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Pull requests and the nightly, for the reason the first setup-go states in full:
          # a tag run restores nothing because `push` stays cache-free, while the schedule
          # writes the main-scoped cache a new pull-request branch can actually restore.
          # zizmor cannot evaluate the expression below, so its cache-poisoning rule fires
          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # NOTHING BUT THE DEPENDENCY FILES IS IN THE KEY, and hooks.yml used to be. That
          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            scripts/go.sum
          go-version: "1.25"
      - run: go test ./...
      # THE MODULE'S CONCURRENCY IS REAL NOW, so the detector gets a look. golden/interrupt.go
      # guards signal state with a mutex, and mutate arms a file for its interrupt handler to
      # restore — where an unsynchronised path/bytes pair could hand one file another file's
      # contents. That shipped, and was found by reading rather than by CI, because scripts was
      # the one module with no -race leg. The suite is seconds; the detector is cheap here.
      - run: go test -race ./...

  qlty:
    # The quality gate had no CI leg at all. `qlty check` is mandatory during
    # verification per the qlty-proficiency skill, and sc-quality-gate runs it on every
    # write — but only on a machine that HAS qlty, so a pull request authored anywhere
    # else was checked by nothing. This is that leg.
    #
    # Diff-scoped (`--upstream`), deliberately: it fails on findings in the files a pull
    # request actually changed, and stays silent about the pre-existing ones elsewhere.
    # `--all` would be red on arrival and teach everyone to ignore it.
    #
    # Scoping is per changed LINE, not per changed file — measured, not assumed: this job
    # was added in a commit that rewrote much of this workflow while the file still carried
    # 18 accepted zizmor findings, and the run reported clean while flagging the one finding
    # on a line the commit actually introduced. So the findings still accepted — 4 here and
    # 39 osv-scanner stdlib in plugins/frank-exchange-of-views/tools/go.mod, both with
    # reasons in .qlty/qlty.toml — do NOT block a pull request that touches those files.
    # You are answerable for the lines you write, which is the only version of this gate
    # that anyone would keep.
    #
    # fetch-depth 0 and the same base-ref handling as rule-sweep above: the check needs
    # the merge base, which a shallow clone does not have.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here talks to the remote after checkout — the check reads the merge
          # base from local refs — so the token has no reason to persist into .git/config.
          persist-credentials: false
          fetch-depth: 0
      # Pinned to a commit, not a tag: a tag is mutable, and this action runs with the
      # workflow's token. v2.3.0.
      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: qlty check --no-progress --no-fix --upstream "origin/$BASE_REF"

  goldens:
    # Goldens are a contract, so STALENESS IS A FAILURE: a behaviour change that
    # was never re-recorded must not merge quietly. This runs the same command a
    # developer runs, without --update, across both languages.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.

---
name: hooks

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:

# Least privilege by default: every job here only reads code and runs tests. The
# release job declares the wider scope it needs, and a job-level block overrides
# this one — so adding a job that needs more is a deliberate, visible act.
permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/prosthetic-conscience/tools

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Caching is off by design, not oversight: this workflow also PUBLISHES on a
          # tag, and a cache a pull request can write is a cache a release build would
          # read (zizmor/cache-poisoning). Restoring the cache is worth seconds; the
          # publish path is worth more.
          cache: false
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...
      # This module had no race leg at all, while gray-area ran `-race ./...` and
      # feov-record ran it over internal/record. It passes clean today (measured, exit 0,
      # zero DATA RACE), so the leg costs nothing now and only gets more expensive later.
      #
      # What it does NOT buy, stated so nobody reads a green leg as more than it is:
      # -race sees one process. The concurrency these hooks actually meet is BETWEEN
      # processes — parallel Edits in one turn fire parallel PostToolUse invocations, each
      # its own binary, sharing state under .claude/. No race detector observes that: any
      # cross-process ordering a hook depends on has to be enforced by the hook itself.
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  feov-record:
    # The FEOV seat-side record runtime (plans/record-tool.md R2g). Its own Go
    # module, so the prosthetic-conscience job's working-directory does not reach
    # it. -race is the point of the port being Go at all: the mjs implementation
    # could only spawn processes and check that nothing was visibly lost, which
    # passes right up until an interleaving the test did not happen to hit.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/frank-exchange-of-views/tools
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Caching is off by design, not oversight: this workflow also PUBLISHES on a
          # tag, and a cache a pull request can write is a cache a release build would
          # read (zizmor/cache-poisoning). Restoring the cache is worth seconds; the
          # publish path is worth more.
          cache: false
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...
      # Race detection needs cgo, which needs a C toolchain; both CI images ship
      # one, so this leg runs where a developer box may not be able to.
      - run: go test -race ./internal/record/
        env:
          CGO_ENABLED: "1"

  gray-area:
    # The trajectory-capture runtime. Its own Go module, so neither the
    # prosthetic-conscience job's working-directory nor the feov-record job's
    # reaches it — a third module is invisible to CI until it has a leg of its
    # own, which is how record.test.mjs went its whole life without running.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/gray-area/tools
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Caching is off by design, not oversight: this workflow also PUBLISHES on a
          # tag, and a cache a pull request can write is a cache a release build would
          # read (zizmor/cache-poisoning). Restoring the cache is worth seconds; the
          # publish path is worth more.
          cache: false
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  rule-sweep:
    # A rule patch must name its class and sweep its siblings
    # (feov-memory/protocol-class-registry.md). Every protocol patch that shipped
    # before this check recurred in adjacent form — four for four — because each
    # fix was an INSTANCE fix and the class survived at the next seat.
    #
    # fetch-depth 0 and an explicit base: the check reads the branch's COMMIT
    # MESSAGES, which a shallow clone does not have.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Same reasoning as every other leg: this workflow PUBLISHES on a tag, so a
          # cache a pull request can write is a cache a release build would read.
          cache: false
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      # The base ref goes through the environment, never through a `${{ }}` expansion
      # inside the shell line: template expansion happens BEFORE the shell sees the
      # command, so an expanded value is code rather than an argument.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./rulesweep -base "origin/$BASE_REF"
        working-directory: scripts
      # A version that goes BACKWARDS ships nothing. Measured 2026-07-31: #198 set
      # prosthetic-conscience to 0.22.0, #195 branched earlier and carried 0.21.0, and the
      # later merge won the line — main kept both features' content at a version already
      # shipped, so `/plugin update` would deliver neither. No test failed and no guard
      # fired, because CLAUDE.md's first bullet had no mechanism behind it.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: go run ./versionguard -base "origin/$BASE_REF"
        working-directory: scripts

  scripts:
    # The repo's dev tooling, now Go: rule-sweep, golden, the four CI guards and the
    # mutation sweep. Its own module at scripts/, deliberately NOT under a plugin's
    # tools/cmd — sc-doctor discovers hook binaries with ReadDir(<plugin>/tools/cmd) and
    # would report every dev tool as an unbuilt binary that `--fix` then tries to fetch
    # from a release.
    #
    # This leg is where the guards' own tests live. Before the port they had none: five of
    # the six were unverified prose, and rule-sweep's `--selftest` was the lone exception
    # (#157 §3). A guard nothing tests is indistinguishable from a clean repo.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Same reasoning as every other leg: this workflow PUBLISHES on a tag, so a
          # cache a pull request can write is a cache a release build would read.
          cache: false
          go-version: "1.25"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        shell: bash
      - run: go test ./...

  qlty:
    # The quality gate had no CI leg at all. `qlty check` is mandatory during
    # verification per the qlty-proficiency skill, and sc-quality-gate runs it on every
    # write — but only on a machine that HAS qlty, so a pull request authored anywhere
    # else was checked by nothing. This is that leg.
    #
    # Diff-scoped (`--upstream`), deliberately: it fails on findings in the files a pull
    # request actually changed, and stays silent about the pre-existing ones elsewhere.
    # `--all` would be red on arrival and teach everyone to ignore it.
    #
    # Scoping is per changed LINE, not per changed file — measured, not assumed: this job
    # was added in a commit that rewrote much of this workflow while the file still carried
    # 18 accepted zizmor findings, and the run reported clean while flagging the one finding
    # on a line the commit actually introduced. So the findings still accepted — 4 here and
    # 39 osv-scanner stdlib in plugins/frank-exchange-of-views/tools/go.mod, both with
    # reasons in .qlty/qlty.toml — do NOT block a pull request that touches those files.
    # You are answerable for the lines you write, which is the only version of this gate
    # that anyone would keep.
    #
    # fetch-depth 0 and the same base-ref handling as rule-sweep above: the check needs
    # the merge base, which a shallow clone does not have.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here talks to the remote after checkout — the check reads the merge
          # base from local refs — so the token has no reason to persist into .git/config.
          persist-credentials: false
          fetch-depth: 0
      # Pinned to a commit, not a tag: a tag is mutable, and this action runs with the
      # workflow's token. v2.3.0.
      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: qlty check --no-progress --no-fix --upstream "origin/$BASE_REF"

  goldens:
    # Goldens are a contract, so STALENESS IS A FAILURE: a behaviour change that
    # was never re-recorded must not merge quietly. This runs the same command a
    # developer runs, without --update, across both languages.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      - uses: actions/setup-go@v7
        with:
          # Caching is off by design, not oversight: this workflow also PUBLISHES on a
          # tag, and a cache a pull request can write is a cache a release build would
          # read (zizmor/cache-poisoning). Restoring the cache is worth seconds; the
          # publish path is worth more.
          cache: false
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - run: go run ./golden
        working-directory: scripts

  debate-sim:
    # Zero-token regression suite for the FEOV debate engine: the simulator stubs the
    # Workflow runtime's agent() contract and drives every branch of debate.js.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Same reasoning as every other leg: this workflow PUBLISHES on a tag, so a
          # cache a pull request can write is a cache a release build would read.
          cache: false
          go-version: "1.25"
      - uses: actions/setup-node@v7
        with:
          # The bump the previous comment here was waiting for. `cache: false` was never
          # available: setup-node's `cache` input takes a package-manager name
          # (npm|yarn|pnpm), and inputs arrive as strings, so `false` would be read as the
          # truthy string "false" and treated as a package manager. v7 ships the input that
          # actually says no — `package-manager-cache: false` — which closes zizmor's four
          # cache-poisoning findings on these steps for the same reason `cache: false`
          # closes them on setup-go: this workflow PUBLISHES on a tag, and a cache a pull
          # request can write is a cache a release build would read.
          package-manager-cache: false
          node-version: "24"
      # Files are enumerated, never globbed: `node --test <dir>` fails on Windows,
      # and an explicit list is the only thing that keeps a new suite from being
      # silently uncovered. record.test.mjs went unlisted for its whole life and
      # never ran in CI once — the reader suite that replaced it is listed here.
      - run: >-
          node --test
          plugins/frank-exchange-of-views/tests/simulator/debate.test.mjs
          plugins/frank-exchange-of-views/tests/simulator/prompts.test.mjs
      # The list above is enumerated, not globbed (`node --test <dir>` fails on Windows),
      # and `node --test` exits 0 on a path that does not exist. So the enumeration needs
      # its own guard, or it drifts silently in both directions — measured 2026-07-30:
      # two of the four suites named here had been deleted and CI was green.
      - name: The enumerated mjs suites match the tree (node --test exits 0 on a missing path)
        run: go run ./mjsparity
        working-directory: scripts
      # The SWEEP is not run in CI — it is minutes long and its residue is judgement.
      # Its self-test is, for the reason rule-sweep carries one: a mutation tool that
      # stops generating mutants reports `0 survived` and reads as a clean bill of health.
      # Seconds here; the alternative is trusting a number nothing checks.
      - name: The mutation sweep can still mutate and observe (a silent one flatters)
        run: go run ./mutate -selftest
        working-directory: scripts
      - name: Validate all tracked JSON (manifests break silently)
        run: go run ./validatejson
        working-directory: scripts
      - name: Every frontmatter block parses (a broken one drops ALL its fields, silently)
        # Claude Code answers a frontmatter parse failure by loading the file with
        # empty metadata rather than by raising, so an agent that declared tools and
        # skills runs with neither and looks exactly like one that never declared
        # them. probe.md sat broken this way; `claude plugin validate` catches it and
        # nothing here ran `claude plugin validate`.
        run: go run ./frontmatter
        working-directory: scripts
      - name: Every recorded decision names the issue that tracks it
        # A decision with no issue is not resolved — it is recorded, which is a different
        # thing. The seat-command trigger map held four decisions under a heading reading
        # "Resolved decisions", TWO of which had never been executed, plus a set of
        # collapses in the same state. Nothing reported it: a decision never carried out
        # is byte-identical to one that was, because the only artifact either produces is
        # a paragraph saying it was decided. An independent trace rediscovered two of them
        # from scratch. This is facts-are-fields applied to our own process — the decision
        # now carries a field a writer can be refused on.
        run: go run ./decisions
        working-directory: scripts
      - name: Every marketplace plugin is installed by both bootstrap paths
        # The plugin list is written down THREE times — the marketplace manifest,
        # the bootstrap script, and the pasteable snippet in docs/setup-script.md.
        # gray-area shipped and reached none of the other two: a fresh environment
        # installed three of four plugins and said nothing, because a plugin that
        # is never named is indistinguishable from a plugin that does not exist.
        run: go run ./pluginparity
        working-directory: scripts
      - name: Hook bootstrap guards degrade gracefully (empty-bin window must never crash-storm)
        # Enumerates EVERY plugin's hooks.json, not just prosthetic-conscience's.
        # Naming one plugin was correct while it shipped the only hooks; a second
        # plugin with hooks would have been silently uncovered by a check that
        # still passed — the same shape as the unlisted test suite two steps up.
        run: |
          EMPTY="$(mktemp -d)"
          node -e "
            const { globSync } = require('fs');
            const files = globSync('plugins/*/hooks/hooks.json');
            if (!files.length) { console.error('no hooks.json found — the glob is wrong'); process.exit(1); }
            const cmds = [];
            for (const f of files) {
              const h = JSON.parse(require('fs').readFileSync(f, 'utf8'));
              for (const evs of Object.values(h.hooks)) for (const e of evs) for (const k of e.hooks) cmds.push(k.command);
            }
            require('fs').writeFileSync('/tmp/hook-cmds.txt', cmds.join('\n') + '\n');
            console.log(files.length + ' hooks.json, ' + cmds.length + ' hook command(s) extracted');
          "
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            if ! CLAUDE_PLUGIN_ROOT="$EMPTY" bash -c "$cmd" </dev/null >/dev/null 2>/tmp/hook-stderr.txt; then
              echo "GUARD FAILED (non-zero exit) for: $cmd"; exit 1
            fi
            grep -q "doctor --fix" /tmp/hook-stderr.txt || { echo "guard warning missing for: $cmd"; exit 1; }
          done < /tmp/hook-cmds.txt
          echo "all hook commands exit 0 with the guard warning on an empty plugin root"

  release:
    # Cross-compile + publish binaries when a plugin version tag is pushed.
    #
    # The tag NAMES THE PLUGIN: <plugin>--v<version>, e.g.
    # prosthetic-conscience--v0.9.0 or frank-exchange-of-views--v0.9.10. This job
    # used to be hardcoded to prosthetic-conscience through the workflow-level
    # working-directory, which meant a FEOV tag would have built PC's binaries
    # and published them under FEOV's release — silently, since the build would
    # succeed. Deriving the plugin from the tag is what makes a second plugin
    # with a binary possible at all.
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '--v')
    needs: [test, feov-record, gray-area]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Caching is off by design, not oversight: this workflow also PUBLISHES on a
          # tag, and a cache a pull request can write is a cache a release build would
          # read (zizmor/cache-poisoning). Restoring the cache is worth seconds; the
          # publish path is worth more.
          cache: false
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - name: Resolve the plugin from the tag
        id: plugin
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%%--v*}"
          dir="plugins/${plugin}/tools"
          if [ ! -f "${dir}/go.mod" ]; then
            echo "tag ${tag} names plugin '${plugin}', which has no Go module at ${dir}"
            echo "(a plugin with no binaries should not carry a version tag that triggers a release)"
            exit 1
          fi
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile
        working-directory: ${{ steps.plugin.outputs.dir }}
        run: |
          mkdir -p dist
          for cmd in cmd/*/; do
            name="$(basename "$cmd")"
            for pair in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              os="${pair%/*}"; arch="${pair#*/}"; ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w"                 -o "dist/${name}_${os}_${arch}${ext}" "./cmd/${name}"
            done
          done
          cd dist && sha256sum * > SHA256SUMS
      # `gh` ships on every GitHub runner, so publishing needs no third-party action at
      # all — which retires the last one here, and with it zizmor/unpinned-uses. The
      # tag name and the artifact directory go through the environment rather than a
      # `${{ }}` expansion inside the shell line, for the same reason as rule-sweep's
      # base ref: an expanded value would be code, not an argument.
      #
      # `create` rather than `upload`: a version tag publishes exactly once, so a
      # release that already exists means something is wrong and the job SHOULD fail
      # rather than quietly overwrite a published artifact.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIST: ${{ steps.plugin.outputs.dir }}/dist
        run: gh release create "$TAG" --title "$TAG" --generate-notes "$DIST"/*

---
name: hooks

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:
  # THE NIGHTLY IS WHERE THE SKIPPED DEPTH STILL HAPPENS. The Windows pull-request leg of
  # feov-record runs `go test -short` (the step says why); a scheduled run is not a pull
  # request, so this fires every job at FULL depth once a day — and doubles as the
  # environment canary: a runner-image change of the D:-drive-removal kind surfaces here
  # on a quiet week instead of inside someone's unrelated pull request. Cron is UTC, and
  # the minute is off :00 because GitHub sheds scheduled load at the top of the hour.
  schedule:
    - cron: "23 9 * * *"
  # RUN IT ON MAIN BY HAND, which is how a cache gets seeded without waiting for 09:23 —
  # and how you rebuild one deliberately after `gh cache delete`. A dispatch on main
  # writes main-scoped caches exactly as the nightly does, at full depth, because -short
  # is pull-request-only. It needs write access to invoke, which is the same trust level
  # as merging to main in the first place.
  workflow_dispatch:

# Least privilege by default: every job here only reads code and runs tests. The
# release job declares the wider scope it needs, and a job-level block overrides
# this one — so adding a job that needs more is a deliberate, visible act.
permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/prosthetic-conscience/tools

jobs:
  # STATIC ANALYSIS DOES NOT NEED THE PLATFORM IT ANALYSES, and running it per-runner was
  # buying one target per runner while paying Windows rates for it.
  #
  # `go vet` executes nothing. Its inputs are the files a build constraint selects plus the
  # types they resolve to, and BOTH are decided by GOOS/GOARCH — not by the host kernel. So
  # `GOOS=windows go vet` on Linux is not an approximation of the Windows answer, it is the
  # same answer: verified by appending unreachable code to seat_windows.go, where the
  # native-Linux vet exited 0 completely blind and the cross-vet named the line.
  #
  # THE COVERAGE ARGUMENT IS THE BIGGER ONE. release builds for three operating systems and
  # CI vetted exactly TWO, the two it happened to own runners for. internal/dashboard is the
  # one package here whose source is platform-split (seat_windows.go, seat_linux.go,
  # seat_fallback.go), and seat_fallback.go — the arm darwin actually compiles — had never
  # been vetted by anything.
  #
  # GOOS ONLY, DELIBERATELY. release ships six GOOS/GOARCH pairs, and vetting all six was
  # measured to be twice the work for exactly the same answer: with no _amd64.go/_arm64.go
  # files anywhere, `go list` returns byte-identical source for amd64 and arm64 under every
  # GOOS, while each extra target costs another full standard-library build. GOOS is the
  # axis that selects files; GOARCH here selects nothing. That holds while every shipped
  # target is 64-bit — a 32-bit one would change int width, and with it the constant-overflow
  # and printf checks, so it would have to come back as its own entry.
  #
  # EVERY MODULE AGAINST EVERY OS, including the modules whose source is byte-identical
  # across platforms — because the bug this catches does not show up as a different file
  # set. Reach for a platform-only API (syscall.Kill, a windows-only call) WITHOUT a build
  # tag and `go list` still reports the same GoFiles everywhere; what differs is whether it
  # type-checks. Skipping a target because the module "looks the same" would skip exactly
  # the case worth catching.
  #
  # COST, measured, so nobody reads the first cold run as a fault: the price is one standard
  # -library build per GOOS, ~100-150s each, and then ~3s forever. A fresh cache went
  # windows 147s, darwin 126s, linux 97s; revisiting windows and darwin after all three
  # were built cost 3s apiece. The cache is content-addressed with GOOS in the key, so the
  # targets COEXIST — it grew 61M -> 127M -> 183M and never evicted — which is also why the
  # loop order below does not matter: each platform is built once whatever order it is
  # reached in. Cold is therefore ~6-7 min on this job and ~30s warm, off the critical path
  # either way, and a cold run only happens when the cache key moves (this file, or a
  # dependency bump), which is the same moment every other job goes cold too.
  #
  # gofmt comes along because it is host-independent outright: it formats text and reads no
  # build constraints, so seven runs of it across the matrix were seven identical answers.
  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          # Pull requests and the nightly, for the reason the first setup-go states in full:
          # the schedule is what puts a cache on main for a new branch to restore.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # Every module, because this job is the only one that vets any of them now.
          cache-dependency-path: |
            plugins/prosthetic-conscience/tools/go.mod
            plugins/frank-exchange-of-views/tools/go.sum
            plugins/gray-area/tools/go.mod
            scripts/go.sum
          go-version: "1.25"
      - name: gofmt, once, for the whole repository
        run: |
          set -euo pipefail
          for mod in plugins/prosthetic-conscience/tools plugins/frank-exchange-of-views/tools plugins/gray-area/tools scripts; do
            # An explicit `if`, not `cd && test || {...}`: that reads as if-then-else and is
            # not one (shellcheck SC2015) — a failed `cd` would take the else branch and
            # report the module unformatted when the truth is that it was never looked at.
            unformatted="$( cd "$mod" && gofmt -l . )"
            if [ -n "$unformatted" ]; then
              echo "unformatted in $mod:"
              echo "$unformatted"
              exit 1
            fi
          done
      - name: vet every module against every operating system we ship
        run: |
          set -euo pipefail
          for mod in plugins/prosthetic-conscience/tools plugins/frank-exchange-of-views/tools plugins/gray-area/tools scripts; do
            for os in windows darwin linux; do
              echo "== $mod :: $os =="
              ( cd "$mod" && GOOS="$os" GOARCH=amd64 go vet ./... )
            done
          done

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false
      # THE TEST TEMP DIR IS THE SUITE'S REAL SUBSTRATE, and on windows-2025 it is the slow
      # one. These runner images removed the D: drive (actions/runner-images#12647), so TEMP
      # lives on C: - network-attached storage benchmarked at ~33 MB/s in that issue - and
      # every t.TempDir SQLite database pays it: on the dev drive alone, recordsql tests ran
      # 73s, the fsync tax a ReFS VHDX backed by C: still honors. Defender is NOT the cause,
      # and an earlier note here that called it "passive" was wrong: measured at job runtime
      # (PR #562), AMRunningMode is Normal but RealTimeProtection and OnAccessProtection are
      # already False, so file scanning is off and disabling it changes nothing.
      #
      # TWO DEVICES, because the two costs differ and no single substrate wins both
      # (measured across PRs #559/#561/#563/#565):
      #   - BUILD CACHES on a DEV DRIVE (V:): a ReFS VHDX with antivirus in async mode,
      #     created inline rather than via a third-party action (ten lines of PowerShell is
      #     cheaper to trust than a tag). The compile win - vet 2m -> 15s on a warm cache.
      #   - TEMP on a KERNEL-MODE RAM DISK (X:, ImDisk): the fsync every test database pays
      #     lands in RAM with no backing store, which the dev drive's VHDX-on-C: could not -
      #     recordsql 73s -> 5s, cli 195s -> 61s. It MUST be kernel-mode: a user-mode
      #     filesystem (WinFsp memfs) routes every process spawn's exe-image load through a
      #     user-mode round-trip (cli 149-334s across the two memfs builds, PR #563), where
      #     the kernel storage stack has no such hop. TEMP only, not the caches: keeps the
      #     RAM footprint small so fuzz's spawn storm - spawn/compute-bound and
      #     storage-independent, no RAM disk moved it - is not squeezed for memory.
      # THE LINUX MIRROR is tmpfs, two lines because tmpfs already exists. Same posture:
      # synchronous stays FULL (operator ruling); the fsyncs land in RAM. Measured on a GCP
      # dev box: recordsql -84%, record -64%, cli -43%. It does not move the PR gate today -
      # Windows is the slowest check - but it is nearly free and cuts real compute.
      - name: tmpfs for TEMP
        if: runner.os == 'Linux'
        run: |
          mkdir -p /dev/shm/tmp
          echo "TMPDIR=/dev/shm/tmp" >> "$GITHUB_ENV"
      - name: dev drive for build caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = "C:\dev.vhdx"
          New-VHD -Path $vhd -SizeBytes 20GB -Dynamic | Out-Null
          $disk = Mount-VHD -Path $vhd -PassThru | Initialize-Disk -PassThru
          $part = New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter V
          Format-Volume -DriveLetter V -DevDrive | Out-Null
          # setup-go resolves GOCACHE/GOMODCACHE through `go env` when ITS step runs, and
          # this step runs first, so exporting the paths here lands the pull-request cache
          # restore on the dev drive. TEMP is deliberately NOT here - it is the RAM disk's.
          "GOCACHE=V:\gocache"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "GOMODCACHE=V:\gomod"  | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: RAM disk for TEMP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Kernel-mode RAM disk (ImDisk, from the choco package already on the runner).
          # Kernel-mode, not user-mode, on purpose: a spawn's exe-image load goes through the
          # normal kernel storage stack with no user-mode round-trip, the tax that made
          # WinFsp memfs regress the spawn-heavy packages (PR #563/#565). 4 GiB is ample for
          # TEMP alone (test databases + fuzz run dirs + one built binary) and small enough
          # to leave the runner's RAM for the test processes.
          #
          # BEST EFFORT, AND LOUD ABOUT IT. The RAM disk is an optimisation whose own
          # measurement put it near break-even, so a flaky package install must not fail the
          # build — TMP already points at the dev drive, and leaving it there costs seconds
          # rather than correctness. What it must never do is degrade SILENTLY: a run that
          # quietly stopped using the RAM disk looks exactly like one that used it.
          #
          # MEASURED, the first time this bit: `choco install ... | Out-Null` threw the
          # install's own log away, so a failed install surfaced two lines later as
          # "The term 'imdisk' is not recognized" and took the whole Windows leg with it.
          # The install's output is now kept and printed WHEN IT MATTERS, which is the
          # only time anyone wants to read it.
          $log = (choco install imdisk-toolkit -y --no-progress 2>&1 | Out-String)
          $imdisk = (Get-Command imdisk.exe -ErrorAction SilentlyContinue).Source
          if (-not $imdisk) {
            foreach ($p in @("$env:SystemRoot\System32\imdisk.exe",
                             "$env:ProgramFiles\ImDisk\imdisk.exe",
                             "${env:ProgramFiles(x86)}\ImDisk\imdisk.exe")) {
              if (Test-Path $p) { $imdisk = $p; break }
            }
          }
          if (-not $imdisk) {
            Write-Host "::warning::ImDisk did not install, so TEMP stays on the dev drive (V:). The run is slower, not wrong. choco said:"
            Write-Host $log
            exit 0
          }
          & $imdisk -a -s 4G -m X: -p "/fs:ntfs /q /y"
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path "X:\")) {
            if ((Get-Date) -gt $deadline) {
              Write-Host "::warning::ImDisk installed but never mounted X:, so TEMP stays on the dev drive (V:)."
              exit 0
            }
            Start-Sleep -Milliseconds 500
          }
          New-Item -ItemType Directory -Path "X:\tmp" | Out-Null
          "TMP=X:\tmp"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=X:\tmp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TEMP is on the kernel-mode RAM disk (X:)."
      - uses: actions/setup-go@v7
        with:
          # CACHED ON PULL REQUESTS ONLY, and the release path stays cache-free — which is
          # a sharper version of the blanket `cache: false` that stood here, not a retreat
          # from it. The poisoning path (zizmor/cache-poisoning) needs a cache the TAG run
          # can restore, and a run can only restore caches from its own ref or the default
          # branch. A pull request's cache lives on its merge ref, invisible to a tag; the
          # dangerous caches are MAIN's, which only `push` events would write — and this
          # workflow pushes only on main and tags, so with the condition below neither ever
          # writes one (a tag build is event_name == push, so this is false there too).
          # The invariant to keep: if caching is ever enabled for `push`, the release build
          # starts restoring main's caches and the original finding reopens.
          #
          # THE NIGHTLY SEEDS THE CACHE MAIN OTHERWISE NEVER HAD, and that is what makes a
          # pull request's FIRST run warm rather than only its later ones. A run restores
          # caches from its own ref or the default branch; saving on pull_request alone put
          # every cache on a merge ref, so a new branch could see none of them. Measured
          # before this line changed: 100 of 100 caches sat on refs/pull/N/merge and main
          # held ZERO, which is why a first run rebuilt the standard library every time.
          # A scheduled run executes on main's ref at full depth, so it writes exactly the
          # caches a later pull request wants.
          #
          # THE CONDITION IS THE INVARIANT, STATED: `!= push`. Both dangerous cases are the
          # same event — a main push and a tag build are both event_name == push — so the
          # rule the comment above spent a paragraph describing is now the expression
          # itself, and it cannot drift out of step with a list of events somebody has to
          # remember to extend. A release run still neither writes a cache nor restores
          # one. Everything that is NOT a push — pull requests, the nightly, a manual
          # dispatch — may cache, and the last two are the ones that put a cache on MAIN
          # for a new branch to restore.
          # zizmor cannot evaluate the expression below, so its cache-poisoning rule fires
          # statically. The finding is answered, not suppressed-and-forgotten: the release
          # job REBUILDS FROM SOURCE with caching disabled (the same expression is false on
          # a tag), so published bytes never touch any cache — and `push` writes none, so a
          # tag run has nothing to restore even if it looked.
          cache: ${{ github.event_name != 'push' }}  # zizmor: ignore[cache-poisoning]
          # The modules are not at the repo root, and setup-go's default lookup is — with
          # nothing here, cache:true fails on a missing go.sum. Keyed on every module's
          # sum: a dependency bump anywhere invalidates all jobs' caches, which is rare
          # enough to be the right trade against four hand-kept per-job paths.
          # NOTHING BUT THE DEPENDENCY FILES IS IN THE KEY, and hooks.yml used to be. That
          # cost what it sounds like: every edit to this workflow invalidated all nine jobs
          # at once, and setup-go passes only a primary key to restoreCache with no
          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            plugins/prosthetic-conscience/tools/go.mod
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - run: go test ./...
      # This module had no race leg at all, while gray-area ran `-race ./...` and
      # feov-record ran it over internal/record. It passes clean today (measured, exit 0,
      # zero DATA RACE), so the leg costs nothing now and only gets more expensive later.
      #
      # What it does NOT buy, stated so nobody reads a green leg as more than it is:
      # -race sees one process. The concurrency these hooks actually meet is BETWEEN
      # processes — parallel Edits in one turn fire parallel PostToolUse invocations, each
      # its own binary, sharing state under .claude/. No race detector observes that: any
      # cross-process ordering a hook depends on has to be enforced by the hook itself.
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  feov-record:
    # The FEOV seat-side record runtime (plans/record-tool.md R2g). Its own Go
    # module, so the prosthetic-conscience job's working-directory does not reach
    # it. -race is the point of the port being Go at all: the mjs implementation
    # could only spawn processes and check that nothing was visibly lost, which
    # passes right up until an interleaving the test did not happen to hit.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/frank-exchange-of-views/tools
    steps:
      - uses: actions/checkout@v7
        with:
          # No remote access after checkout, so the token has no reason to persist
          # into .git/config where any later step could read it.
          persist-credentials: false

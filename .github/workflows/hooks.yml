          # restore-keys array (verified in its cache-restore source), so the miss is TOTAL
          # rather than partial — each job rebuilt the standard library from scratch, ~150s
          # per platform, measured 2026-08-25 while tuning this very file. The tax fell on
          # whoever was editing CI, which is the work most in need of a fast loop.
          #
          # It was there to keep a bad save from persisting: the key is otherwise
          # go.sum-only and setup-go skips the save on a primary-key hit. Two facts retire
          # that worry without a key component. A FAILED job never saves at all (its post
          # step is skipped — observed), so a broken run cannot poison anything. And a
          # deliberate purge already has a tool: `gh cache delete`. Inventing a file to bump
          # by hand would have rebuilt, worse, something GitHub ships.
          #
          # The go TOOLCHAIN is already in setup-go's own key
          # (setup-go-Windows-x64-go-1.25.13-<hash>), so a version bump invalidates on its
          # own and needs nothing here.
          # PER JOB, because a shared key is a RACE. All same-OS jobs hashed the same
          # inputs, so they raced to save one key and the smallest job always won —
          # that is the whole story of the frozen 27 MB cache: the pc-tools job
          # finished first and its little build cache became everyone's. Each job now
          # keys on what IT builds, so each save is the cache its restore expects.
          cache-dependency-path: |
            plugins/prosthetic-conscience/tools/go.mod
            plugins/frank-exchange-of-views/tools/go.sum
            plugins/gray-area/tools/go.mod
          # MUST satisfy every go.mod in the repo — all FOUR are on 1.25: the three
          # plugin modules plus scripts/, the dev tooling. Under v5 this
          # pin was a fiction: GOTOOLCHAIN defaulted to `auto`, so a 1.24 runner silently
          # DOWNLOADED 1.25 to build a 1.25 module and CI went green while testing a
          # toolchain nobody had pinned. v7 defaults GOTOOLCHAIN=local, which turns that
          # into the honest error it always was — `go.mod requires go >= 1.25`. Raising the
          # pin is the fix; lowering go.mod or restoring `auto` would only re-hide it.
          go-version: "1.25"
      - name: Resolve the plugin from the tag
        id: plugin
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%%--v*}"
          dir="plugins/${plugin}/tools"
          if [ ! -f "${dir}/go.mod" ]; then
            echo "tag ${tag} names plugin '${plugin}', which has no Go module at ${dir}"
            echo "(a plugin with no binaries should not carry a version tag that triggers a release)"
            exit 1
          fi
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
      # THE RELEASE BOUNDARY, CHECKED BEFORE ANYTHING IS PUBLISHED (#405).
      #
      # A release is one act: bump plugin.json and tag that commit. Nothing can derive one from
      # the other — the plugin system reads the manifest out of the checkout, so the version has
      # to be IN the tagged commit — so this refuses the pair when they disagree. Without it a
      # tag can publish assets that no consumer's `/plugin update` will ever ask for, which is
      # exactly the state measured across all four plugins on 2026-08-15.
      - name: The tag and the manifest agree
        run: go run ./versionguard -tag "${GITHUB_REF_NAME}"
        working-directory: scripts
      # THE MUTATION GATE, AT THE ONE BOUNDARY WHERE THE SWEEP IS A GATE (ruled 2026-09-03).
      # Day to day it stays an on-demand audit with no threshold — a gated score invites
      # killing equivalent mutants with contorted tests. What a RELEASE must prove is that
      # the EXPLAINING happened: every survivor in the tagged plugin's module is either
      # killed by a test or judged in writing in its mutation-survivors.json, and no
      # judgement outlives the survivor it explained. Records are born at each plugin's
      # first gated release, not grandfathered: a record whose entries nobody judged is an
      # allowlist wearing a schema. Expect that first release to fail here, once, with the
      # full backlog printed — that is the decision working, not the gate broken.
      - name: Every mutation survivor in the released module is explained
        run: go run ./mutate -gate -module "$PLUGIN_DIR"
        working-directory: scripts
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
      # BUILD OUTPUT LEAVES THE SOURCE TREE, and that is a correctness fix rather than tidiness.
      #
      # This wrote into `dist/` inside the plugin's tools directory. `dist/` is not ignored, so
      # the tree was untracked-dirty before the first compile — and the Go toolchain stamps
      # `vcs.modified` from the tree it builds in. EVERY published binary of EVERY plugin has
      # therefore carried `+dirty` for as long as this job has existed.
      #
      # That is not cosmetic. sc-doctor reports Dirty as "what it contains is not recoverable
      # from that commit alone", and stamping it on every official artifact drains the word
      # exactly where it should carry the most weight: a genuinely dirty release build is now
      # indistinguishable from a clean one.
      #
      # Building into RUNNER_TEMP fixes the stamp by making the claim TRUE — the source tree is
      # untouched — rather than by adding `dist/` to .gitignore, which would make the tree merely
      # COUNT as clean while build artifacts sat in it. Measured in a clean clone at
      # prosthetic-conscience--v0.42.0: vcs.modified=false, and true again after `mkdir -p dist`.
      - name: Cross-compile
        working-directory: ${{ steps.plugin.outputs.dir }}
        env:
          DIST: ${{ runner.temp }}/dist
        run: |
          mkdir -p "$DIST"
          for cmd in cmd/*/; do
            name="$(basename "$cmd")"
            for pair in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
              os="${pair%/*}"; arch="${pair#*/}"; ext=""
              [ "$os" = "windows" ] && ext=".exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w"                 -o "${DIST}/${name}_${os}_${arch}${ext}" "./cmd/${name}"
            done
          done
          # sha256sum runs IN the directory so the sums name bare files, which is what the
          # verifier on the other end matches against.
          cd "$DIST" && sha256sum * > SHA256SUMS
      # `gh` ships on every GitHub runner, so publishing needs no third-party action at
      # all — which retires the last one here, and with it zizmor/unpinned-uses. The
      # tag name and the artifact directory go through the environment rather than a
      # `${{ }}` expansion inside the shell line, for the same reason as rule-sweep's
      # base ref: an expanded value would be code, not an argument.
      #
      # A PUBLISHED TAG IS NEVER SILENTLY OVERWRITTEN — but a RE-RUN is not an overwrite.
      #
      # This step used to be a bare `gh release create`, with the stated reasoning that "a
      # release that already exists means something is wrong and the job SHOULD fail rather
      # than quietly overwrite a published artifact". The protection is right and is kept. What
      # it got wrong is that it treated two different situations as one:
      #
      #   a RE-RUN of a completed release        — benign, and the normal recovery after an
      #                                            Actions outage
      #   a DIFFERENT commit claiming the tag    — the dangerous case, worth failing for
      #
      # MEASURED 2026-08-17, during this repository's first release under the release-boundary
      # model: an Actions outage failed all three tag runs before they published. When Actions
      # recovered the releases went out, and a re-run of one of those runs then failed with `a
      # release with the same tag name already exists`. The release had SUCCEEDED; the run said
      # otherwise. A red run on a published release is a false negative on the most consequential
      # job in the repository, and it invites exactly the wrong response — re-tagging.
      #
      # The discriminator is the CHECKSUMS, which this job has already built. Identical sums mean
      # the same artifacts, so there is nothing to publish and nothing wrong. Different sums mean
      # the tag's content moved, which is the case the original refusal exists for — and it still
      # fails, loudly, rather than clobbering.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIST: ${{ runner.temp }}/dist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            if gh release download "$TAG" --pattern SHA256SUMS --dir "$tmp" 2>/dev/null \
               && cmp -s "$tmp/SHA256SUMS" "$DIST/SHA256SUMS"; then
              echo "release ${TAG} is already published, and its SHA256SUMS match what this run just built."
              echo "This is a RE-RUN of a completed release, not a second attempt to claim the tag. Nothing to do."
              exit 0
            fi
            echo "::error::release ${TAG} already exists and its artifacts DIFFER from what this commit builds."
            echo "A published tag must not be silently overwritten. Investigate before re-tagging."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes "$DIST"/*

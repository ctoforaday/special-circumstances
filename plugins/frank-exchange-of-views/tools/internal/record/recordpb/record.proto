// The written record: an append-only per-process-shard event log, one event per line.
//
// THIS FILE IS THE SCHEMA. Before it, an event's payload was a map[string]any read back with
// p.Str("gap_id") at 653 call sites, and nothing between the writer and the reader could say no:
// a misspelled key returned "", which is indistinguishable from a field the seat legitimately
// omitted. Every field below is a field a writer can be refused at.
//
// GENERATED CODE IS COMMITTED. Regenerate with `go run ./protogen` from scripts/; the schema's
// content hash is stamped beside the bindings and gated in CI.
//
// FIELD NUMBERS ARE INERT HERE, AND NAMES ARE WHAT BREAK. This file is a SCHEMA DEFINITION
// LANGUAGE, not a wire format: nothing in this tree marshals or unmarshals binary protobuf.
// `proto.Marshal` appears exactly once, at `recordsql/store.go` as `var _ = proto.Marshal` — an
// import-keeper, not a call. Records live in SQLite and leave through protojson, and BOTH are
// keyed on NAMES: `recordsql.TableName` is `snake(message.Name())`, every column is
// `field.Name()`, every enum table is `"enum_" + snake(enum.Name())`, and foreign keys reference
// `field.Name()`. Search this file for a field number's effect on storage and there is none.
//
// So the rule that used to stand here — "field numbers are permanent, a renumber silently
// reinterprets every record already written" — described the textproto/binary era the SQLite
// store retired. Renumbering costs nothing. RENAMING is the breaking change: rename a message
// and the table moves; rename a field and the column moves; and a reader pointed at a record
// written before the rename finds the old name absent and returns ZERO ROWS, which is
// byte-identical to a clean board. That is the failure to design against, not renumbering.
//
// THIS HOLDS ONLY WHILE NOTHING WRITES THE WIRE FORMAT. If binary marshalling is ever
// introduced, field numbers become load-bearing again and the permanence rule comes back with
// them. Say so here if that day comes.

syntax = "proto3";

package feov.record.v1;

option go_package = "github.com/ctoforaday/special-circumstances/plugins/frank-exchange-of-views/tools/internal/record/recordpb";

import "google/protobuf/descriptor.proto";

// THE RELATIONAL FACTS LIVE ON THE FIELD THEY CONSTRAIN.
//
// The record's storage is SQLite and its schema is DERIVED from these descriptors, so anything the
// database must enforce has to be expressible here. Without that, the constraints that are the
// whole reason for a database — the foreign key that makes a ruling-before-its-filing unwritable —
// would be hand-written in the deriver, and a hand-written half is the second copy this schema
// exists to remove.
//
// `required` also lands here, and it REPLACES a Go map keyed by field name. That map was the
// canonical instance of the defect: the requirement lived one file away from the field, and it had
// already omitted Outcome.verdict, which is how a run could record that it ENDED and not how.
extend google.protobuf.FieldOptions {
  optional Sql sql = 50000;

  // prose IS WHETHER THIS FIELD IS THE SEAT'S OWN WORDING. It is DECLARED, true or false, on the
  // string fields a free-text flag fills, so "nobody asked" cannot pass for either answer: `true` is
  // the seat's argument, where an archived id is a reference to the record that migrate respells;
  // `false` marks free text that is data rather than argument (a closure's verification tool is
  // part of the anchor triple). migrate's field lists are held to it (TestEveryStringFieldIsInOneList).
  optional bool prose = 50008;
}

// A VALUE'S MEANING BELONGS ON THE VALUE.
//
// The seat-facing sets are closed, and a closed set delivered as bare words leaves a seat to guess
// which situation warrants which — `--as repaired | not_a_defect | defect_accepted` is six words
// and one shared sentence. The meanings existed all along as SOURCE COMMENTS, written for a Go
// reader and delivered to no seat, which is the shape enumvalue.go was created to end.
//
// They then lived in a Go map keyed by full name: one statement, two files, and a name to keep in
// step. Here the meaning sits ON the value, so `--help`, the refusal a seat reads, and the record's
// own vocabulary tables are three readers of one declaration.
extend google.protobuf.EnumValueOptions {
  optional string means = 50001;

  // defined_term IS `means` FOR A VALUE WHOSE MEANING IS A CONCEPT THE TERMS REGISTRY DEFINES. The
  // value names the registry entry (its `term` key in internal/terms/terms.json) and carries no
  // prose of its own: `--help`, the refusal a seat reads and the vocabulary table render the
  // registry's definition, so the glossary a seat is handed and the menu beside it are one
  // sentence with one author. A value declares exactly one of `means` and `defined_term`.
  //
  // The name says "defined term" because a bare "term" is already what a run is held to — its
  // epoch limit, its per-sitting tool-call limit.
  optional string defined_term = 50009;

  // closes is WHETHER THIS WORD ENDS THE GAP, and it is on the value because that is the only
  // place a new value cannot be added without answering the question.
  //
  // It replaces `benchClosesGap`, which was the negative rule "everything except carried closes".
  // A negative rule has no gap to notice: every disposition added after it was classified as
  // closing BY DEFAULT, silently, and no test of the predicate's stated behaviour would fail.
  // Measured — `grade_adjusted` was added to the bench's vocabulary and read as closing a gap the
  // bench had explicitly deferred, because nobody was asked.
  //
  // As an annotation the miss is LOUD at two layers: the schema refuses to build a vocabulary
  // table that is partly annotated, and the column is NOT NULL.
  optional bool closes = 50003;

  // ruled_by IS WHICH SEAT HOLDS THE GAVEL, and it is on the value for the same reason `closes`
  // is: a new motion subject cannot be added without answering it.
  //
  // It names the role. The CLI adds `motion <subject> rule` only to that role's command tree, and
  // the PASS gate's refusal — in internal/record, which cannot import the CLI — names the role
  // through RulerOf, so a seat blocked behind an unruled motion is told whose ruling it waits on
  // and is never told to rule a motion whose gavel another seat holds.
  optional string ruled_by = 50004;

  // seat_may_file IS WHETHER A SEAT MAY PUT THIS WORD ON THE RECORD, and it is on the value for
  // the same reason `closes` and `ruled_by` are: a word cannot be added to the vocabulary without
  // answering it, and the schema refuses a facet declared on some values and not others.
  //
  // The case that forced it: `log --type estoppel` MEANS "the tool refused a mint against text
  // the other side prescribed", and its own `means` says "Recorded by the tool, not filed by the
  // seat". The seat verb accepted it anyway and stamped source=SEAT, so a seat could record a
  // refusal that never happened — and the generated help OFFERED the word alongside the four a
  // seat should use, which is what made it likely rather than hypothetical (#782).
  //
  // NOT "who writes it", WHICH IS THE WRONG QUESTION. `defect` is written by seats AND by the
  // tool when it fails internally (its `means` says so), so a writer name would have to pick one
  // and would be wrong about the other. What the surface needs to know is narrower and answerable
  // for every word: may a SEAT file this. `source` still records who actually did.
  optional bool seat_may_file = 50006;

  // mass IS WHAT A GRADE WEIGHS, and it is on the value because the weight is a property of the
  // word rather than of whoever is multiplying it.
  //
  // As a facet the vocabulary table carries it: `enum_grade` holds a NOT NULL `mass` column, a
  // grade added without a weight fails at schema build, and GapMass is a join —
  // MASS[likelihood] * MASS[impact] is two lookups against the same vocabulary every other reader
  // already joins. Go's record.MASS is read off this facet, and nothing else holds a weight.
  //
  // GRADE_REALIZED IS 0 DELIBERATELY, and the enum's own comment says why: mass forecasts what is
  // still to come, and a realized defect is measured by its damage instead. That zero is a real
  // weight, not an absent one, which is exactly why the column is NOT NULL.
  optional double mass = 50005;

  // gap_may_name IS WHETHER A GAP MAY BE ABOUT THIS KIND OF THING, and it is on the value for the
  // reason every facet is: an AboutKind cannot be added without answering it. A finding takes every
  // kind; a gap takes the kinds this admits. `contradiction` is the one it refuses — a
  // contradiction is raised by a finding, and the gap is minted from that finding.
  optional bool gap_may_name = 50010;

  // material_default IS WHERE A GAP OF THIS CLASS STARTS ITS MATERIALITY, and it is a facet for the
  // reason every facet is: a GapClass value cannot be added without answering it. The mint's write
  // stamps it onto `Mint.class_material` (record.stampClassMaterial reads it through
  // recordpb.MaterialDefault), and the vocabulary table carries it as a column referencing
  // `enum_class_material`, so the word is checked twice — by protoc here, by the database there.
  optional ClassMaterial material_default = 50011;

  // neighbor and distinguisher are the value NEAREST to a GapClass value and the question that
  // tells the two apart. They are options, not facets: the catch-all has no neighbour, and nothing
  // in the machinery switches on them. `mint --help` renders them (enumhelp), and
  // recordpb/gapclass_test.go requires both on every value but `unclassified` and requires
  // `neighbor` to be another value's word.
  optional string neighbor = 50012;
  optional string distinguisher = 50013;

  // 50007 held `correct`, a type's same-sitting correction tier. No act is corrected: a wrong one is
  // answered by a new act. The number is not reused.
}

// A CONSTRAINT THAT DEPENDS ON ANOTHER FIELD BELONGS ON THE MESSAGE.
//
// `required` is a property of ONE field and lives on it. "repaired_with_regression requires a
// successor" is not: it is a rule about two fields together, and no annotation on either can say
// it. Those rules were hand-written `if` blocks in validate — the app refusing what the database
// would happily store, which for a record that is EVIDENCE is a real gap: anything writing SQL
// directly could create a state the tool forbids, and the row would look exactly like a legitimate
// one.
//
// This does put SQL in the schema, and that is a genuine cost — a second language in a file that
// otherwise describes shape. It is paid because the alternative is the constraint living in two
// places, or in only the weaker one.
extend google.protobuf.MessageOptions {
  repeated SqlCheck check = 50002;
}

// SqlCheck is one table-level rule and what it protects.
message SqlCheck {
  // expr is the SQL, with column names quoted as the derived DDL quotes them.
  optional string expr = 1;

  // why is what the rule is FOR. A CHECK that fires with only its expression tells a reader what
  // was refused and nothing about which invariant they walked into.
  optional string why = 2;
}

// Sql is what the database must know about a field that the field's type cannot say.
message Sql {
  // required makes the column NOT NULL and is what the write path refuses on. One statement, two
  // enforcers, no way for them to disagree.
  optional bool required = 1;

  // flag is the word a SEAT types, when it deliberately differs from the field name. It is not an
  // alias table: it sits on the field, so there is one place to read and nothing to keep in step.
  //
  // It exists for ONE reason, and the reason is deliberate: the prose field is spelled differently
  // per verb — a close stores `prose`, an opinion `rationale`, a regrade `basis` — while the word a
  // seat types for all of them is `--reason`. Collapsing the schema's names would lose what each
  // prose field IS; collapsing the seat's would make every verb's prose a different word to learn.
  optional string flag = 2;

  // allow_empty says a required STRING field may be present and EMPTY.
  //
  // `required` means the seat SAID something, and for prose that means it said something with
  // content: an acceptance check of "" is a contract that demands nothing, and a log entry of
  // "" is a duty discharged by silence — measured, and it took a seat from two outstanding duties
  // to `complete: true` while the channel reported one entry saying nothing.
  //
  // The exception is real and narrow: a docket ruling's `settled` may be empty, because a ruling
  // can bar no proposition — a remand sends the gap back to the debate undecided. Presence-only
  // requiredness is the exception and says so at the field, rather than being the silent default it
  // briefly became when the Go table's two flavours collapsed into one annotation.
  optional bool allow_empty = 7;

  // subset names a VALUE FACET this column's values must carry — `subset: "closes"` admits only
  // the values annotated `(closes) = true`. The generator expands it into a CHECK over the real
  // words from the descriptor, so the subset is DERIVED and there is no second list to keep.
  //
  // Without it the alternative was `CHECK ("closure_class" <> 'carried')` hand-typed into the
  // schema: a word composed into an expression and recovered by nothing, which is the shape this
  // whole annotation layer exists to remove.
  optional string subset = 6;

  // why is what omitting it costs, in the words the refusal shows the seat. A required field whose
  // refusal says only "required" teaches nothing about the state it was protecting.
  optional string why = 3;

  // references names the row this value must already point at, as "table.column". This is the
  // constraint the sharded log could not have: filing and ruling lived in different files and
  // replay merged them by timestamp, so a ruling could replay before its filing — recorded in
  // capitals at record/motion.go and papered over by a second pass. A foreign key makes the state
  // unwritable rather than recoverable.
  optional string references = 4;

  // unique is a per-run uniqueness the type cannot state — a gap id minted twice is two gaps
  // wearing one name, and every join afterwards is ambiguous.
  optional bool unique = 5;
}

// EventType names the verb that wrote the event. It is redundant with the `body` oneof case and
// checked against it at the single write path — two carriers of one fact with a gate between
// them, which is legal precisely because the gate exists. It stays because it is in every
// golden and every `switch e.Type`, and dropping it would rewrite ~29 switches into type
// assertions for no gain.

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_REGISTER = 1 [(means) = "a seat took its seat — the first act of any seat, stamping the tool version it ran under"];
  EVENT_TYPE_ANCHOR = 2 [(means) = "a marker placed in the report"];
  EVENT_TYPE_INQUIRY = 3 [(means) = "an inquiry: its question, its hypothesis and each fate recorded on it"];
  EVENT_TYPE_BLUE_EDIT = 4 [(means) = "a change to the report, recorded as old and new so the edit itself is auditable"];
  EVENT_TYPE_CERTIFY = 5 [(means) = "a seat's signed statement about its own work — what it asserts on the record"];
  EVENT_TYPE_CITE = 6 [(means) = "a source brought into the debate, with the hash and access date that make it re-checkable"];
  EVENT_TYPE_CLOSE = 8 [(means) = "red closing a gap on a verified repair — red's half of the closing vocabulary"];
  EVENT_TYPE_CLOSING = 9 [(means) = "a party's argument to the bench on one docketed gap — its minting lens's or blue-respond's"];
  EVENT_TYPE_DECLARE = 10 [(means) = "the bench stating a holding that later sittings are expected to apply"];
  EVENT_TYPE_FINDING = 11 [(means) = "something red found, graded but not yet minted as a gap"];
  EVENT_TYPE_LOG = 12 [(means) = "an entry addressed to the operator who can retool the seat — a defect, a request or friction — never a clean sitting, which is derived from having sat and filed no log entry"];
  EVENT_TYPE_HALT = 14 [(means) = "the bench ending the run on a safety, ethics, consent or integrity boundary"];
  EVENT_TYPE_MANIFEST_ROW = 15 [(means) = "one row of the run's manifest, tying a gap to what shipped for it"];
  EVENT_TYPE_MINT = 16 [(means) = "a gap put on the board — the act that creates the entity every other act refers to"];
  EVENT_TYPE_MOTION = 17 [(means) = "a motion filed: a grade contested, a petition to the bench, or an inquiry proposed"];
  // 7 was EVENT_TYPE_CLASS_NEW, 18 EVENT_TYPE_MOTION_APPEAL, 28 EVENT_TYPE_REVISION and 39
  // EVENT_TYPE_CORRECTION: a gap's class is a value of the closed GapClass set, a ruling stands as
  // made, a report's change is its edits, and a wrong act is answered by a new act.
  // Reserved: a stored event carries its type's number.
  reserved 7, 18, 28, 39, 42;
  reserved "EVENT_TYPE_CLASS_NEW", "EVENT_TYPE_MOTION_APPEAL", "EVENT_TYPE_REVISION", "EVENT_TYPE_CORRECTION";
  EVENT_TYPE_MOTION_RULE = 19 [(means) = "the bench's ruling on a filed motion, and whom it binds"];
  // 20 was EVENT_TYPE_OBSERVE, a type no verb wrote. Reserved for the reason 21 is.
  reserved 20;
  reserved "EVENT_TYPE_OBSERVE";
  // 21 was EVENT_TYPE_OPINION. Reserved rather than left free: a stored event carries its type
  // as an integer, so a new type given 21 would silently inherit every pre-#681 bench ruling —
  // and `Body` dispatches on this enum, so those events would be handed to the wrong arm.
  reserved 21;
  reserved "EVENT_TYPE_OPINION";
  EVENT_TYPE_OUTCOME = 22 [(means) = "the run's terminal act: how it ended and whether the question was answered"];
  EVENT_TYPE_POSITION = 23 [(means) = "the chair's argument to the bench on what is about no one gap"];
  EVENT_TYPE_PROOF = 24 [(means) = "a script that was RUN, with its hash and exit status — the answer a computation check demands"];
  EVENT_TYPE_REGRADE = 25 [(means) = "a gap's grade changed, with the basis for the change"];
  EVENT_TYPE_REPRODUCE = 26 [(means) = "an attempt to re-run a recorded proof, and whether what it computes is sound"];
  EVENT_TYPE_RETIRE = 27 [(means) = "a claim retired from the report, with the reason and what supersedes it"];
  EVENT_TYPE_SPOT_CHECK = 29 [(means) = "red re-checking a sample of prior work, or stating that it checked none and why"];
  EVENT_TYPE_VERDICT = 30 [(means) = "the chair's verdict for its epoch: PASS or FAIL against the open board"];
  EVENT_TYPE_VERIFY = 31 [(means) = "a citation checked at the leaf: what the source did for the claim, and how sure the reader is"];
  EVENT_TYPE_INQUIRY_REVIEW = 32 [(means) = "a review of the inquiries themselves, rather than of a finding"];
  EVENT_TYPE_BASE_INGEST = 33 [(means) = "the report as blue ingested it, stored verbatim as the origin every recorded edit replays over"];
  EVENT_TYPE_SITTING_OPEN = 34 [(means) = "the harness dispatching an agent — one end of a sitting's span, observed by a hook rather than claimed by a seat"];
  EVENT_TYPE_SITTING_CLOSE = 35 [(means) = "the harness's agent returning — the other end of that span"];
  EVENT_TYPE_CAST = 36 [(means) = "the run's admissible seats, written once by setup before any seat registers — what register and the dispatch verb check a seat id against"];
  EVENT_TYPE_DISPATCH = 37 [(means) = "the chair engaging one party — a seat and the gaps it is engaged on — pinned to the report head it audits; the parties of one chair sitting are one dispatch"];
  EVENT_TYPE_SITTING_LIMIT = 38 [(means) = "a seat's sitting stopped at the run's per-sitting tool-call limit — the hook refuses every further call in it, and this records which seat, which sitting and the limit"];
  EVENT_TYPE_PLAN = 40 [(means) = "the plan the chair's dispatch printed, whole — what the chair relays and the workflow dispatches; one per decision, with parties or none"];
  EVENT_TYPE_STALE = 41 [(means) = "the tool refusing a seat's act on a gap that changed since the seat's sitting opened, having shown the seat what changed — the seat's next act on that gap in this sitting reads from here"];
  EVENT_TYPE_REPORT_READ = 43 [(means) = "the tool serving a lens the whole report at a head — evidence the text was served to it, not that it was read; the latest in a sitting the lens sat through is its pin"];
  EVENT_TYPE_ENVELOPE_ADMITTED = 44 [(means) = "the envelope gate admitting the envelope an agent returned: the record refused nothing on the seat's work list, so the call ending its sitting went through — a closed sitting of a seat whose work arrives as items, with none of these, failed"];
}

// Grade is the canonical grade set. `realized` contributes zero mass by design — it is a grade,
// not a missing entry, and record.MASS is held to this set by a test.
enum Grade {
  // UNSPECIFIED IS THE `undefined` SENTINEL, and it is load-bearing rather than a filler zero.
  // view.go renders an ungraded value as the literal nine-character word `undefined` — never
  // empty — because the projections group by it and a bare blank would silently merge with a
  // real grade. by_severity names an ungraded mint's tally by exactly that word. Modelling it as the
  // enum's zero keeps "not graded" a value the schema can carry rather than an absence a reader
  // has to infer.
  GRADE_UNSPECIFIED = 0 [(mass) = 0];
  GRADE_TRIVIAL = 1 [(means) = "cosmetic; nothing downstream changes if it is wrong", (mass) = 0.5];
  GRADE_LOW = 2 [(means) = "minor", (mass) = 1];
  GRADE_LOW_MEDIUM = 3 [(means) = "below the by-grade material floor", (mass) = 1.5];
  GRADE_MEDIUM = 4 [(means) = "the by-grade material floor", (mass) = 2];
  GRADE_MEDIUM_HIGH = 5 [(means) = "above the by-grade material floor, below serious", (mass) = 2.5];
  GRADE_HIGH = 6 [(means) = "serious", (mass) = 3];
  GRADE_CERTAIN = 7 [(means) = "the top of the scale — for LIKELIHOOD, reserve it for a consequence that is itself certain, never for a defect you merely verified exists", (mass) = 3.5];
  GRADE_REALIZED = 8 [(means) = "it has already happened. Contributes ZERO mass by design: mass forecasts what is still to come, and a realized defect is measured by its damage instead", (mass) = 0];
}

// Verdict is red's binary gate. PASS is CHECKED against the open board, not taken on the seat's
// word — which is why the set is closed: `--as pass` once recorded a PASS that skipped the check
// entirely, and `--as banana` recorded a banana.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_PASS = 1 [(means) = "nothing on the board holds the gate — `show work` marks what does, and a refused PASS names every one — and this is CHECKED against the board, not taken on your word"];
  VERDICT_FAIL = 2 [(means) = "the board, as it stands, still stops you — refused over a converged board"];
}

// RunOutcome is how the SITTING ended. The report's verdict stamp switches on it, so an
// unrecognized value used to fall through to a bare stamp — losing, for CEILING, the "this is
// NOT a judged failure to verify" caveat the stamp exists to carry.
enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  RUN_OUTCOME_VERIFIED = 1 [(means) = "red passed the board and the bench agrees the question was answered"];
  RUN_OUTCOME_CEILING = 2 [(means) = "the run stopped at a limit of its terms, with nobody it could still dispatch and PASS not permitted: its epoch limit, as the derivation's reason states; NOT a judged failure to verify: what stays open on the board, and its re-audit, travels OUT of the run"];
  RUN_OUTCOME_HALTED = 3 [(means) = "the bench ended the run on a safety, ethics, consent or integrity boundary"];
  RUN_OUTCOME_UNVERIFIED = 4 [(means) = "the run ended without the question being answered, and no ceiling or halt explains it"];
}

// CheckKind is WHAT WOULD SETTLE an acceptance check. COMPUTATION is the one with teeth: a gap
// minted that way cannot be closed on prose. Across six recorded runs no seat ever wrote a
// program, and the cause was that all ten of red's checks were document probes — red could only
// ever ask whether the report SAYS something.
enum CheckKind {
  CHECK_KIND_UNSPECIFIED = 0;
  CHECK_KIND_DOCUMENT = 1 [(means) = "reading a shipped artifact settles it — the check is answered by prose that quotes what is there"];
  CHECK_KIND_COMPUTATION = 2 [(means) = "RUNNING something settles it. This check CANNOT be closed by prose: it closes only when a proof answers the gap. Reach for it wherever the answer would be PRODUCED rather than asserted — arithmetic, a simulation, a forecast, a parse, a count, a re-derivation, among others: if a script could end the argument, this is the kind"];
  CHECK_KIND_SOURCE = 3 [(means) = "verifying an external source settles it — the claim stands or falls on what the cited material actually says"];
}

// ClassMaterial is where a gap's materiality starts: from its class. A claim, figure or citation
// defect changes what a reader concludes whatever it is graded, so its class is `always`; a
// template-shape defect changes no conclusion, so its class is `never`; every other class goes
// by the gap's current severity, medium and above. The class's `material_default` carries it, and
// the write path stamps it onto every Mint, so every reader of "is this gap material" reads the
// same field.
enum ClassMaterial {
  CLASS_MATERIAL_UNSPECIFIED = 0;
  CLASS_MATERIAL_ALWAYS = 1 [(means) = "every gap of this class is material, whatever its grade — it changes a conclusion or a figure a reader relies on"];
  CLASS_MATERIAL_NEVER = 2 [(means) = "no gap of this class is material, whatever its grade — it stays on the board and never holds the gate"];
  CLASS_MATERIAL_BY_GRADE = 3 [(means) = "a gap of this class is material when its current severity is medium or above"];
}

// GapClass is THE KIND OF DEFECT A GAP IS, from a closed set the binary owns. Each value carries
// its definition, its materiality (`material_default`, which the write stamps onto the mint as
// `class_material`), the value nearest to it and the question that tells the two apart; `mint
// --help` prints all four. MEMBERSHIP RULE: a value stays only if a definition and a distinguisher
// from its nearest neighbour can be written, and synonyms merge. Adding a value is a release and an
// epoch bump, and nothing in migrate, because no archive holds the new word. `unclassified` takes a
// gap no value fits, and the mint's reason says why; the rate of those is how a release learns
// which value is missing.
enum GapClass {
  GAP_CLASS_UNSPECIFIED = 0;
  GAP_CLASS_CROSS_SECTION_CONTRADICTION = 1 [(means) = "two passages of the report state things that cannot both be true — figures, verdicts, grades, or the reasons given for them",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "claim_contradicts_own_record",
    (distinguisher) = "are both statements in the report's text, or is one of them the run's record — an inquiry's fate, an edit, a proof's output?"];
  GAP_CLASS_CLAIM_CONTRADICTS_OWN_RECORD = 2 [(means) = "the report and the run's own record disagree: the report states what the record contradicts — an inquiry's fate, method or reason, an edit, a proof's result — or a record entry contradicts what the report shows was done",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "cross_section_contradiction",
    (distinguisher) = "are both statements in the report's text, or is one of them the run's record — an inquiry's fate, an edit, a proof's output?"];
  GAP_CLASS_READER_CHANNEL_MISMATCH = 3 [(means) = "a fact the reader needs is held — in the record or elsewhere in the report — but not where the reader who needs it reads, so a reader acting on that section acts without it",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "claim_contradicts_own_record",
    (distinguisher) = "do the two places disagree, or does one simply lack what the other holds?"];
  GAP_CLASS_INCOMPLETE_REPAIR_PROPAGATION = 4 [(means) = "a repair fixed a defect at some of its sites and left it standing at others — a sibling sentence, row or section still carries what the repair removed",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "cross_section_contradiction",
    (distinguisher) = "does the disagreement exist because a repair reached only part of one defect's sites, or do two passages disagree with no repair behind them?"];
  GAP_CLASS_MISSING_ROOT_INVARIANT = 5 [(means) = "one fact is restated in several places with nothing tying the copies to a single source, so they have drifted or can drift unnoticed",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "incomplete_repair_propagation",
    (distinguisher) = "is the defect that no single source governs the copies, or that one repair missed some of them?"];
  GAP_CLASS_REPORT_VOICE = 6 [(means) = "report prose speaks about the run that made it rather than the subject — process voice, a claim wearing the seat that produced it, the report's own draft history, or the machinery that checked it",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "claim_contradicts_own_record",
    (distinguisher) = "does the fix correct a FACT the report gets wrong, or the AUDIENCE the sentence is written for, whether or not the fact is true?"];
  GAP_CLASS_STRUCTURE_NONCOMPLIANCE = 7 [(means) = "the report's structure does not carry its argument: material a reader has to take in order is present only as unordered prose, or a part of the answer has no place in it. The report's sections are its author's to name and order, and a heading the report does not have is not this",
    (material_default) = CLASS_MATERIAL_NEVER, (neighbor) = "risk_coverage_omission",
    (distinguisher) = "is it a risk the report does not grade, or material the report holds with no order a reader can follow it by, whatever its subject?"];
  GAP_CLASS_FALSE_UNIVERSAL = 8 [(means) = "a claim stated universally — every, none, always, the only — that a case the evidence reaches, or one it never tested, contradicts",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "exhaustive_sweep_omits_case",
    (distinguisher) = "is it a rule about the subject stated too broadly, or a list or search presented as complete that leaves a member out?"];
  GAP_CLASS_EXHAUSTIVE_SWEEP_OMITS_CASE = 9 [(means) = "a list, survey, search or sweep the report presents as complete omits a member it should hold",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "false_universal",
    (distinguisher) = "is it a rule about the subject stated too broadly, or a list or search presented as complete that leaves a member out?"];
  GAP_CLASS_RISK_COVERAGE_OMISSION = 10 [(means) = "the report's account of risk leaves out a risk, or a combination of risks, that its own analysis or its subject makes live",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "exhaustive_sweep_omits_case",
    (distinguisher) = "is the missing member a risk the case against owes a grade, or any other member of a list presented as complete?"];
  GAP_CLASS_DERIVATION_STATUS_OVERCLAIM = 11 [(means) = "a claim carries more certainty or status than how it was established supports — inferred stated as verified, hedged in one place and flat in another, assumed stated as shown",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "verification_scope_blindspot",
    (distinguisher) = "is the claim's STATUS overstated, or is real evidence spent on a claim broader than what it covers?"];
  GAP_CLASS_VERIFICATION_SCOPE_BLINDSPOT = 12 [(means) = "a check, experiment or proof covers less than the claim it is credited with — a read test cited for a write path, one artifact's check credited to its siblings, a proof that establishes half its sentence",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "derivation_status_overclaim",
    (distinguisher) = "is the claim's STATUS overstated, or is real evidence spent on a claim broader than what it covers?"];
  GAP_CLASS_SELF_ATTESTATION = 13 [(means) = "the report asserts its own checking — that it verified, re-ran, searched or matched something — and the record does not bear the assertion out",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "derivation_status_overclaim",
    (distinguisher) = "is the overstated claim about the report's own verification or research, or about the subject?"];
  GAP_CLASS_UNVERIFIED_COMPOSITION = 14 [(means) = "a property of a whole is claimed because its parts were each checked, and the combination itself was never checked",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "derivation_status_overclaim",
    (distinguisher) = "does the claim rest on combining separately checked parts whose combination nobody examined, or overstate how one claim was established?"];
  GAP_CLASS_INVALID_INFERENCE = 15 [(means) = "a reason the report offers for a conclusion does not entail it — the step fails even where every stated fact is true, including a check that gives the same result on the case the conclusion must exclude",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "derivation_status_overclaim",
    (distinguisher) = "is the reason irrelevant to the conclusion, or relevant and stated with more certainty than it earns?"];
  GAP_CLASS_VOTE_LAUNDERING = 16 [(means) = "agreement among sources, programs or reviewers is counted as independent corroboration when they share an origin, so the count overstates the evidence",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "derivation_status_overclaim",
    (distinguisher) = "is the overstatement in how many independent supports exist, or in how one claim was established?"];
  GAP_CLASS_DOCTRINE_VS_IMPLEMENTATION = 17 [(means) = "what a system, method or report says it does differs from what its implementation does — a stated rule its code, script or procedure does not follow",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "claim_contradicts_own_record",
    (distinguisher) = "is the disagreement between a stated rule and the mechanism meant to carry it out, or between a report statement and the run's record of what happened?"];
  GAP_CLASS_POLICY_WITHOUT_MECHANISM = 18 [(means) = "a rule, safeguard or guarantee is asserted with nothing that enforces it",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "partial_control_coverage",
    (distinguisher) = "is there no enforcing mechanism at all, or one that covers only part of the surface?"];
  GAP_CLASS_PARTIAL_CONTROL_COVERAGE = 19 [(means) = "a control credited with covering a surface works on part of it and leaves the rest — an axis, channel, verb or case — uncovered",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "self_defeating_mitigation",
    (distinguisher) = "does the control work on part of the surface and miss the rest (coverage), or fail on its own terms even where it does apply?"];
  GAP_CLASS_SELF_DEFEATING_MITIGATION = 20 [(means) = "a control credited with closing a gap cannot deliver that closure by its own operation — it fires after the decision it gates, acts on a variable that does not trigger the harm, erases the signal it was meant to distinguish, rests on an assumption the same document discredits, or is starved of its trigger by another control's short-circuit",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "policy_without_mechanism",
    (distinguisher) = "policy_without_mechanism is a policy asserted with NO enforcing artifact; self_defeating_mitigation is an enforcer that exists and runs and still cannot produce the credited closure. Against partial_control_coverage: that control works on part of the surface and misses the rest (coverage); this one fails on its own terms even where it does apply"];
  GAP_CLASS_UNHANDLED_DEGENERATE_CASE = 21 [(means) = "a procedure or design the report describes breaks or is undefined at an edge input — empty, zero, one, a boundary, a duplicate — that the report does not address",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "false_universal",
    (distinguisher) = "is a mechanism failing at an edge input, or a claim stated too broadly?"];
  GAP_CLASS_SPEC_UNDERSPECIFICATION = 22 [(means) = "a term, rule, procedure or recommendation the report relies on is not specified enough for a reader to apply or check it — undefined, defined only by what it is not, or left as an undecided either/or",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "unhandled_degenerate_case",
    (distinguisher) = "is the specification missing or left open, or present and failing at an edge?"];
  GAP_CLASS_FIGURE_RECOUNT_FAILS = 23 [(means) = "a figure, count or computed result the report states differs from what an independent recount, recomputation or re-run produces",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "metric_conflation",
    (distinguisher) = "is the number wrong on its own definition, or right on it and compared or identified with a figure measured differently?"];
  GAP_CLASS_METRIC_CONFLATION = 24 [(means) = "two quantities or categories that measure or mean different things are treated as one — compared, added or given one label — across different bases, methods or definitions",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "figure_recount_fails",
    (distinguisher) = "is the number wrong on its own definition, or right on it and compared or identified with a figure measured differently?"];
  GAP_CLASS_CITATION_FIGURE_MISATTRIBUTION = 25 [(means) = "a cited source does not say what the report attributes to it — the figure, statement or support is absent from or contradicted by its text, the cached text is a different document from the one named, or the anchor backs a sentence its source is not about",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "unsourced_claim",
    (distinguisher) = "is a source recorded against the claim that says something else, or is there no source behind the claim at all?"];
  GAP_CLASS_WITHIN_SOURCE_CONDITION_MISATTRIBUTION = 26 [(means) = "the report carries a source's or model's result outside the conditions under which the source establishes it — a condition, bound, regime or date the source states is dropped",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "citation_figure_misattribution",
    (distinguisher) = "does the source state the result, under a condition the report drops, or not state it at all?"];
  GAP_CLASS_LIVE_SOURCE_DRIFT = 27 [(means) = "a claim or proof rests on a source's or tree's current state rather than the state the report cites or pins, so it reads differently now from when it was written",
    (material_default) = CLASS_MATERIAL_ALWAYS, (neighbor) = "artifact_preservation",
    (distinguisher) = "is the artifact present and changed or read live, or missing or broken where the report says it is kept?"];
  GAP_CLASS_ARTIFACT_PRESERVATION = 28 [(means) = "an artifact a reader needs to check the report — a proof, program, cached source or data file — is not kept, or does not run, where the report says it is",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "live_source_drift",
    (distinguisher) = "is the artifact present and changed or read live, or missing or broken where the report says it is kept?"];
  GAP_CLASS_UNSOURCED_CLAIM = 29 [(means) = "a claim of fact or a quotation the report states with no source or proof behind it on the record — no anchor, an anchor that resolves to nothing in the evidence, or an appeal to a result it never names",
    (material_default) = CLASS_MATERIAL_BY_GRADE, (neighbor) = "citation_figure_misattribution",
    (distinguisher) = "is a source recorded against the claim that says something else, or is there no source behind the claim at all?"];
  GAP_CLASS_UNCLASSIFIED = 30 [(means) = "no other value fits this gap. The mint's reason names the nearest value and what it does not cover",
    (material_default) = CLASS_MATERIAL_BY_GRADE];
}

// ClosureClass is HOW A GAP ENDED — one vocabulary for both closing verbs. Before it was
// unified, four surfaces spelled the same three outcomes six ways and no mechanism could see
// them disagree, because every set was open.
enum Disposition {
  DISPOSITION_UNSPECIFIED = 0;
  DISPOSITION_REPAIRED = 1 [(means) = "the repair was verified at the leaf and nothing regressed", (closes) = true];
  DISPOSITION_REPAIRED_WITH_REGRESSION = 2 [(means) = "repaired, but something else broke — REQUIRES a successor naming the gap that carries the regression forward", (closes) = true];
  DISPOSITION_AMENDS_PRIOR = 3 [(means) = "a defect found BETWEEN two repairs that each closed clean earlier — its lineage is the supersedes the gap was minted with; the close itself carries none and nothing checks it", (closes) = true];
  DISPOSITION_NOT_A_DEFECT = 4 [(means) = "blue argued the finding was wrong and the argument held; nothing was repaired because nothing needed to be", (closes) = true];
  DISPOSITION_DEFECT_ACCEPTED = 5 [(means) = "the fix costs more than the defect (complexity above likelihood x impact) and the risk is taken KNOWINGLY, with the argument on the record", (closes) = true];
  DISPOSITION_DEFECT_OWED_ELSEWHERE = 6 [(means) = "a real defect whose fix is owned outside this debate; it leaves here and is not silently dropped", (closes) = true];

  // THE ONE WORD THAT DOES NOT CLOSE, and the reason this enum carries `closes` at all.
  //
  // `remanded` is reachable by the BENCH only: red closing a gap is asserting a repair, and
  // "I repaired it by carrying it" is not a sentence. The subset is enforced, not documented —
  // see Close.closure_class, whose `subset: "closes"` generates the CHECK from this annotation.
  DISPOSITION_REMANDED = 7 [(means) = "NOT a closure: the gap goes back to the debate for ONE more exchange — the dispatch readies its minting lens and blue on it, owing the research direction the ruling states — a remand closes nothing, so it states a direction and never --final. The exchange begins only when blue records an act on the gap; its minting lens's act alone begins nothing. If it leaves the gap at impasse it is docketed again, to be closed — a second remand at impasse is refused — and if it moves the gap the gap's limits count afresh from it", (closes) = false];
  // MOOT IS NOT not_a_defect, AND THAT DISTINCTION IS WHY IT EXISTS (#847).
  //
  // `not_a_defect` asserts that blue argued the finding was wrong and the argument HELD — a
  // claim about an exchange that happened. `repaired` asserts a repair verified at the leaf.
  // Moot asserts neither: nobody won an argument and nobody verified a fix, the text the finding
  // attached to simply is not in the report any more.
  //
  // It was an ENGINE word with no record word. The debate script offered the bench `moot` in its
  // envelope and the record refused it, so a bench reaching for it had to substitute a closing
  // disposition that asserts something that did not occur. Measured on 2026-08-23: a bench filed
  // friction saying it "had to substitute defect_owed_elsewhere for what the constitution calls
  // grade_adjusted, since no closer enum value exists" — the same forced-substitution shape, one
  // word over.
  DISPOSITION_MOOT = 8 [(means) = "the gap's predicate expired: the claim or artifact it attached to is no longer in the report, so there is nothing left to repair or to argue about — neither not_a_defect nor repaired", (closes) = true];
}

// SourceOutcome is WHAT THE SOURCE DID for a claim — a different question from how sure the
// auditor is of that determination (Confidence).
//
// THE NEGATIVE HALF DID NOT EXIST until 0.60.0. Red could say how a citation held and had no
// way to record that it did NOT, so the strongest adversarial finding on this axis had to leave
// as prose — and the audit built to catch a report shipping a refuted citation went looking for
// a verdict no field could carry, reporting PASS over an empty file on every run.
enum SourceOutcome {
  SOURCE_OUTCOME_UNSPECIFIED = 0;
  SOURCE_OUTCOME_SUPPORTS = 1 [(means) = "you read the source and it says what the claim says. Where the run's copy of it is only the work's abstract, the record stamps that beside your verdict: it confirms what the abstract says, not what the study shows"];
  SOURCE_OUTCOME_SUPPORTS_WITH_BRIDGE = 2 [(means) = "it supports the claim but you had to bridge something — a summary, a secondary citation, a near-restatement"];
  SOURCE_OUTCOME_WEAK = 3 [(means) = "it gestures at the claim, or is itself uncorroborated: thin support, not none"];
  SOURCE_OUTCOME_REFUTES = 4 [(means) = "you read the source and it CONTRADICTS the claim — the strongest finding this verb can carry"];
  SOURCE_OUTCOME_ABSENT = 5 [(means) = "you read the source and the claim is simply not in it. Distinct from `refutes`: the source says nothing about the claim, where a refuting source says otherwise"];      // says nothing, as against says otherwise: a reader deciding what to do about it needs to know which it was
  SOURCE_OUTCOME_UNREACHABLE = 6 [(means) = "you could not read it — paywall, dead link, a format you could not extract. Say what you tried in --reason; an untried \"unable to corroborate\" is an incomplete audit"];
}

// BridgeKind is WHAT a `supports_with_bridge` reading bridged — the three things that outcome's own
// meaning names. It is required with that outcome and refused with every other (validate), so a
// reading whose defect is none of the three — a term put on the wrong object, a condition dropped —
// has no home there and lands on `refutes` or `weak`, where the gate sees it. m30's evidence lens
// recorded supports_with_bridge over a definition the source inverts, and said so only in prose.
enum BridgeKind {
  BRIDGE_KIND_UNSPECIFIED = 0;
  BRIDGE_KIND_SUMMARY = 1 [(means) = "the source summarises what the claim states in detail, or the claim summarises the source: the same assertion, at a different length"];
  BRIDGE_KIND_SECONDARY_CITATION = 2 [(means) = "the source reports the claim on another work's authority — it cites the work that makes it — so the support is second-hand"];
  BRIDGE_KIND_NEAR_RESTATEMENT = 3 [(means) = "the source says the same thing in other words: every term names the same object it names in the claim, and nothing the claim asserts is added, dropped or reversed"];
}

// Confidence is how sure the auditor is OF THE DETERMINATION, whatever the determination was.
// `refutes` at low confidence and `refutes` at high confidence are different facts, and a
// reader who cannot tell them apart cannot act on either. Low is a call for more evidence, not
// an automatic fail.
enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_HIGH = 1 [(means) = "you read the source at the leaf and would defend this determination as it stands"];
  CONFIDENCE_MEDIUM = 2 [(means) = "you are reasonably sure, but the reading bridges something — a summary, a secondary source, a near-restatement rather than the exact statement"];
  CONFIDENCE_LOW = 3 [(means) = "your reading may be wrong: an ambiguous passage, thin evidence, or a source you could only partly read. This is a call for more evidence, NOT an automatic fail — blue digs further"];
}

// Soundness: REPRODUCING IS NOT PROVING. Re-running a script and getting the same bytes measures
// determinism; `print("7 is prime")` reproduces perfectly forever. UNSOUND is the dangerous
// cell, because a proof that re-runs clean and establishes nothing looks maximally credible.
enum Soundness {
  SOUNDNESS_UNSPECIFIED = 0;
  SOUNDNESS_SOUND = 1 [(means) = "you READ the script and it computes what it claims to compute"];
  SOUNDNESS_UNSOUND = 2 [(means) = "it re-runs cleanly and establishes nothing, or something other than the claim it is anchored to"]; // the dangerous cell, because it looks maximally credible
}

// Rerun is what one `reproduce` did with the proof's SCRIPT, which every proof anchor on that
// script shares. The tool writes it; a seat never states it. Soundness is the other half, judged
// per anchor, because one script can back several sentences and only one of them may be what it
// computes.
//
// NOT_RUN IS A VALUE AND NOT AN ABSENCE. A bool `reproduced` read false both where the script
// printed something else and where nothing re-ran it, and a reader of the record could not tell a
// failed check from a judgement made on an earlier re-run.
enum Rerun {
  RERUN_UNSPECIFIED = 0;
  RERUN_REPRODUCED = 1 [(means) = "this act re-ran the stored script and it printed the recorded output byte for byte"];
  RERUN_DIFFERS = 2 [(means) = "this act re-ran the stored script and it printed something other than the recorded output"];
  RERUN_CALLS_THE_TOOL = 3 [(means) = "this act re-ran the stored script and the script called feov-record, which refuses every call made inside a re-run: the check cannot run in a checker's hands, so nothing is reproduced"];
  RERUN_NOT_RUN = 4 [(means) = "this act did not run the script: an earlier re-run of the same script stands for every proof on it, and this act judged its own anchor's sentence against that re-run"];
}

// InquiryStatus is an inquiry's fate. The inquiries projection groups BY status, so a value outside
// the set would not fail — it would silently vanish from the section that exists to show the roads
// not taken.
enum InquiryStatus {
  INQUIRY_STATUS_UNSPECIFIED = 0;
  INQUIRY_STATUS_PROPOSED = 1 [(means) = "put forward and undecided — the state `inquiry propose` gives an inquiry; red may rule on it, and it owes a fate"];
  INQUIRY_STATUS_UNDERWAY = 2 [(means) = "you are working the question and it is still open — say what you learned in --reason. Each sitting re-records it with what changed, or records the fate it reached"];
  // CONFIRMED IS THE END OF AN INQUIRY THAT WORKED: an approach that ran and answered yes ships as
  // an answer, not as a dead end.
  INQUIRY_STATUS_CONFIRMED = 6 [(means) = "you RAN the approach and the hypothesis HELD — REQUIRES a reason saying what it found, which is in the report; it owes no further fate. An approach that ran and refuted its hypothesis is `refuted`, and one that gave no answer is `abandoned`"];
  // REFUTED IS AN APPROACH THAT RAN AND ANSWERED NO. It is an answer, so it ships beside the
  // confirmed inquiries; `abandoned` is left for the inquiry that produced none.
  INQUIRY_STATUS_REFUTED = 7 [(means) = "you RAN the approach and what it found CONTRADICTED the hypothesis — REQUIRES a reason saying what it found, which is in the report; it owes no further fate. A refutation is an answer, and the row prints beside the confirmed ones. An approach that gave no answer is `abandoned`, not this"];
  INQUIRY_STATUS_DEFERRED = 3 [(means) = "left for a later research run, not this one — kept, not set aside. REQUIRES a reason saying what a later run should pick it up FOR"]; // a deferral with no stated reason is indistinguishable from forgetting, and this status exists to be read by a run that has not happened yet
  // DECLINED IS AN APPROACH NOBODY RAN, and the meaning says so because the word alone does not. The
  // record holds no link from a proof or a section to an inquiry, so no write can tell a declined
  // inquiry that was run from one that was not; the fate's own meaning is where the seat is told.
  INQUIRY_STATUS_DECLINED = 4 [(means) = "you considered it and did NOT run it, and set it aside: one worth a later run is `deferred`. REQUIRES a reason. An approach you ran is not this, whatever it found: `confirmed` if the hypothesis held, `refuted` if what it found contradicted it, `abandoned` if it was started and no answer came"];
  INQUIRY_STATUS_ABANDONED = 5 [(means) = "you STARTED it and NO ANSWER CAME — the method broke, the data was unavailable, or the question was given up. REQUIRES a reason saying what stopped it. An approach that ran and refuted its hypothesis is `refuted`, not this"]; // what stopped it is the part a future run needs: it stops a later run re-walking it
}

// MotionSubject is what a motion is ABOUT. The ruling vocabulary is keyed on it, which is why
// the rulings are separate enums below rather than one flat set.
enum MotionSubject {
  MOTION_SUBJECT_UNSPECIFIED = 0;
  MOTION_SUBJECT_GRADE = 1 [(means) = "you contest a gap's grade on one dimension", (ruled_by) = "chair"];
  MOTION_SUBJECT_PETITION = 2 [(means) = "you ask the bench to intervene — the constitutional short-circuit available to any party seat", (ruled_by) = "bench"];
  MOTION_SUBJECT_INQUIRY = 3 [(means) = "a ruling on an inquiry blue proposed; the id is the INQUIRY's own, because the proposal IS the filing", (ruled_by) = "chair"];
  MOTION_SUBJECT_DOCKET = 4 [(means) = "a gap put before the BENCH for disposition: the filer states the case, the bench rules and its word decides the gap's fate", (ruled_by) = "bench"];
}

// The ruling sets, one per subject. A single flat set cannot express this: one motion-rule
// event carries granted|denied for a petition and accepted|rejected for a grade, and a ruling
// nothing recognizes reads as no ruling at all — so a refusal silently becomes permission.
//
// Each `(means)` is the sentence the ruler reads in `motion <subject> rule --as`: MotionVerdicts
// in record/motion.go is built from these values (evsOf), so an edit here is the edit the chair
// and the bench see.
enum GradeRuling {
  GRADE_RULING_UNSPECIFIED = 0;
  // ACCEPTING MOVES NOTHING. This value read "the proposed grade stands" while no code applied a
  // proposed grade: the originating lens moves it with `regrade`, MotionVerdicts tells the chair
  // so, and the lens's own work list carries the owed regrade until it is filed. On the b9 run the
  // chair ruled M1 accepted and wrote that the minting lens owns applying it; the record holds no
  // regrade after the ruling, which is the duty the old sentence would have called satisfied.
  GRADE_RULING_ACCEPTED = 1 [(means) = "the filer is right and the grade should move. The ruling moves nothing itself: the gap's originating lens moves it with `regrade`, so say in --reason which grade and to what"];
  GRADE_RULING_REJECTED = 2 [(means) = "the grade stands. Your --reason is what a seat that disagrees argues against before the bench, so it carries the argument, not the conclusion"];
}

enum PetitionRuling {
  PETITION_RULING_UNSPECIFIED = 0;
  PETITION_RULING_GRANTED = 1 [(means) = "the objection holds. The relief BINDS the seats that come after, so state it as an instruction they can follow"];
  PETITION_RULING_DENIED = 2 [(means) = "the objection does not hold, and your reason must say why at the leaf — a refusal without one is a decoration the petitioner cannot contest"];
}

enum InquiryRuling {
  INQUIRY_RULING_UNSPECIFIED = 0;
  INQUIRY_RULING_ENDORSED = 1 [(means) = "worth this run's time — blue should take it up"];
  INQUIRY_RULING_OUT_OF_SCOPE = 2 [(means) = "a real question, but not THIS question"];
  INQUIRY_RULING_TOO_THIN = 3 [(means) = "in scope, but the hypothesis as stated does not justify what testing it would cost this run"];
}

// Event is the log line.
//
// EVERY FIELD IS `optional`, WITHOUT EXCEPTION, and that is not stylistic. Absence is meaningful
// throughout this record: a flag the seat never passed must not appear in the event at all, and
// presence is read at 34 call sites. proto3 without `optional` has implicit presence, so an
// unset field and a zero-valued one marshal to the same bytes under EmitUnpopulated=false —
// `seq = 0` (the register event's real sequence number) would vanish from the line, and a grade of
// zero could not be told from an ungraded axis, which is the distinction half these readers rest
// on. Requiredness is a validate-time duty declared separately, never inferred from optionality.
message Event {
  // `seq` WAS FIELD 1 AND IS GONE. It was the seat's position within its own shard file, and its
  // last reader was replay's (TS, SeatID, Seq) tiebreak — a sort that existed because merging
  // per-file had lost the real order. `ORDER BY id` is that order, so the tiebreak went, and with
  // it the only thing that ever read this.
  //
  // Removing it removed a READ-BEFORE-WRITE from the write path: numbering an event meant counting
  // the seat's existing rows first, which is the deferred-transaction upgrade SQLite refuses to
  // apply busy_timeout to. A field nothing reads is not free; this one cost every write a query
  // and an upgrade hazard.
  //
  // The number is still askable, and it is a `row_number() OVER (PARTITION BY seat_id, nonce)`
  // away — computed when someone wants it rather than stamped on every row forever.

  // ts is when the event happened, and it is what replay ORDERS BY.
  //
  // Without it, events merged by shard FILENAME, so every cross-seat reference was ordered by
  // how seat names happen to sort: the bench closing a gap red minted was dropped silently
  // because the gap did not exist yet at replay time. Nanosecond precision, fixed width, so
  // lexicographic order is time order — and monotonicity is guaranteed in code rather than
  // hoped for from the hardware, because a wall clock can step backwards under NTP.
  optional string ts = 2;

  optional string seat_id = 3;
  // `nonce` IS GONE, AND KILLING IT FIXED A BUG RATHER THAN TIDYING ONE.
  //
  // It named a SITTING — one dispatch of a seat — and it existed because the shard file was
  // `events-<seat>-<nonce>.jsonl`. A re-dispatch rotated it, so a crash retry wrote into a fresh
  // file and replay picked a winner between them.
  //
  // With one table there is no second file and no winner selection, and the nonce became actively
  // harmful: the idempotency ordinal was counted PER SITTING while `events.key` carries a GLOBAL
  // unique index, so a re-dispatched seat restarted at `#1` and collided with its own earlier
  // acts. Measured through the binary — register, record, re-register, record: `UNIQUE constraint
  // failed: events.key`. A re-dispatched seat could not record at all.
  //
  // The ordinal is scoped to the seat now, so its keys are monotonic across dispatches and the
  // collision is unrepresentable. "Which dispatch was this" is still answerable — it is the rank of
  // the row's stored sitting among that seat's stored sittings, which is what events_w."sitting"
  // is.
  //
  // `round` WAS FIELD 5 AND IS GONE (plans/roundless.md §III.A.2). It was the third stamped
  // derivation on this envelope, and the last: first recovered from the seat id by regex, then
  // counted from chair registers in the write's own transaction. Both were a READ-BEFORE-WRITE
  // to store a number the record could already answer, and the answer is a window function over
  // this table — events_w."epoch" for the chair-sitting count, events_w."sitting" for the seat's
  // own — computed when a reader wants it, exactly as seq's removal argued above. The debate no
  // longer has rounds; the record has a sequence ("id") and two clocks derived from it.
  reserved 5;
  reserved "round";

  // THE EVENT CARRIES NO ROLE. The party that wrote it is the role of its seat_id, read from the
  // roster at every read (record.PartyOf), and the store keeps (seat_id, ts, type, key) and no
  // role column. That is why a role can change spelling without a migration.
  reserved 6;
  reserved "role";

  optional EventType type = 7;
  optional string key = 8;
  // 9 WAS `schema_version`, REMOVED 2026-09-06. It was a format discriminator for a reader that
  // no longer exists: the line reader it gated went with the shard lines, and afterwards the field
  // was stamped on every event and read by NOTHING. The compatibility question it claimed to
  // answer is answered by the event-schema epoch, which is a fact about the BINARY compared at
  // setup, not a column on every row. Kept reserved so the number cannot come back meaning
  // something else.
  reserved 9;
  reserved "schema_version";

  oneof body {
    Register register = 20;
    Gate verdict = 21;
    Outcome outcome = 22;
    Position position = 23;
    Halt halt = 24;
    Certify certify = 25;
    Declare declare = 26;
    Motion motion = 27;
    MotionRule motion_rule = 28;
    Mint mint = 30;
    Close close = 32;
    Closing closing = 33;
    Regrade regrade = 34;
    SpotCheck spot_check = 35;
    Finding finding = 37;
    Anchor anchor = 39;
    Cite cite = 40;
    Verify verify = 41;
    Proof proof = 42;
    Reproduce reproduce = 43;
    Inquiry inquiry = 44;
    BlueEdit blue_edit = 45;
    Retire retire = 47;
    ManifestRow manifest_row = 48;
    Log log = 49;
    InquiryReview inquiry_review = 51;
    BaseIngest base_ingest = 52;
    SittingOpen sitting_open = 53;
    SittingClose sitting_close = 54;
    Cast cast = 55;
    Dispatch dispatch = 56;
    SittingLimit sitting_limit = 57;
    Plan plan = 59;
    Stale stale = 60;
    ReportRead report_read = 62;
    EnvelopeAdmitted envelope_admitted = 63;
  }

  // 60-80 are reserved for bodies not yet needed. Numbers are permanent, so the block is
  // claimed now rather than negotiated later. 51 was drawn from it for `inquiry_review`, 52 for
  // `base_ingest`, 53-54 for the sitting span, 55-56 for the cast and the dispatch
  // (plans/roundless.md §III.B.1), 57 for the sitting limit, 58 for the correction and 59 for the
  // plan, 60 for the stale refusal, 62 for the report read, 63 for the envelope admission, which is
  // what the reserve is for — the block shrinks and nothing is renumbered.
  reserved 64 to 80;

  // These held the bodies whose types are reserved above, and are reserved for the same reason:
  // a stored event carries the bytes.
  reserved 29, 31, 38, 46, 58, 61;
  reserved "motion_appeal", "class_new", "observe", "revision", "correction";

  // 36 HELD `Opinion`, and it is reserved for the reason the block above is: the number is
  // permanent even though the message is gone. The bench's disposition is a docket motion's
  // ruling now (`MotionRule.ruling.docket`, #681 Scope 2), so nothing writes 36 any more — but
  // events written BEFORE that change still carry those bytes, and a later body handed 36 would
  // decode them as itself. Protobuf does not refuse a shape mismatch on a compatible wire type;
  // it would return a message populated from another message's fields, with no error anywhere.
  // 36 is the only free number below 55, so it is also the one a careless next edit would take.
  reserved 36;
  reserved "opinion";
}

// TelemetryLine is the per-epoch projection, NOT a shard event.
//
// It is written by view.Telemetry and re-decoded by the dashboard, cost and scorecard as raw
// JSON keys. It gets a message for the same reason events do: it was a nested *Payload of
// *Payloads, and its consumers bind its keys as strings.
message TelemetryLine {
  optional int32 epoch = 1;
  optional string mapping_version = 2;
  optional int32 open_count = 3;

  // max_severity is a Grade, but it is rendered `undefined` — the nine-character word, not
  // empty — when nothing is graded, because the projections must not print a bare blank. That
  // sentinel is why it is an enum with an explicit UNDEFINED value rather than a string.
  optional Grade max_severity = 4;

  optional NewMint new_mint = 5;
  optional double mass = 6;
  optional int32 realized_open = 7;
  optional RepairRegression repair_regression = 8;
  optional EdgeDeltas edge_deltas = 9;

  // 10 IS DELIBERATELY UNUSED. `accepted_deltas` was a telemetry key no writer produced, read as
  // []any by the cost and dashboard surfaces, which rendered "no accepted deltas" where the truth
  // was "never measured"; those readers are gone. The concept it named — grade changes reviewed in
  // total — is the record's grade movement (record/grademovement.go): computed from the regrades
  // and the docket rulings, never stored, and past its threshold a blocker the bench clears. A
  // scorecard field would be a second, stored copy of a fact the record derives.
  reserved 10;
  reserved "accepted_deltas";
}

message NewMint {
  optional int32 count = 1;

  // by_severity is REPEATED, not a map: the key space is the closed Grade set plus the
  // `undefined` sentinel, so a repeated field sorted by an order this code owns is deterministic
  // BY CONSTRUCTION and needs no faith in protojson/prototext map ordering.
  repeated SeverityTally by_severity = 2;

  // by_class is REPEATED for the same reason: GapClass is a closed set, and the tally runs in its
  // schema order, one entry per class minted this epoch.
  repeated ClassTally by_class = 5;
  reserved 3;

  // class_repeat_rate is absent when no gaps were minted this round — distinct from 0.0, which
  // means minted-and-none-repeated. An `unclassified` mint is in its denominator and never a
  // repeat: "no class fits" recurring is not one kind of defect recurring.
  optional double class_repeat_rate = 4;

  // unclassified_rate is this epoch's `unclassified` mints over its mints; absent when nothing
  // was minted, as class_repeat_rate is.
  optional double unclassified_rate = 6;
}

message ClassTally {
  optional GapClass class = 1;
  optional int32 count = 2;
}

message SeverityTally {
  optional Grade grade = 1;
  optional int32 count = 2;
}

message RepairRegression {
  optional int32 closures = 1;
  optional int32 lineage_mints = 2;
  // ratio is absent when there were no closures to divide by — not 0.0, which would read as
  // "closures happened and none had lineage".
  optional double ratio = 3;
}

message EdgeDeltas {
  optional double down_mass = 1;
  optional double up_mass = 2;
}

// Mint records a gap. `gap_id` is ASSIGNED by the tool, never chosen by the seat.
message Mint {
  // A GAP NO CLASS FITS SAYS WHY. `unclassified` is the catch-all, and its reason is the only
  // place the nearest value and what it does not cover are written; the rate of these is how a
  // release learns which value is missing. The database refuses the empty reason, so no write path
  // goes around it. That the reason names the nearest value is prose nothing can refuse.
  option (check) = {
    expr: "\"class\" <> 'unclassified' OR coalesce(trim(\"mint_reason\", ' ' || char(9, 10, 13)), '') <> ''"
    why: "a gap no class fits says why in --reason: the nearest class and what it does not cover — the rate of these is how a release learns which class is missing"
  };

  // THE RECORD'S PRIMARY ENTITY, and until this annotation nothing enforced that it existed.
  //
  // Every other gap_id in the schema now references this column, which is only possible because it
  // is unique and present. Before, a close, an opinion, a regrade or a grade motion could name a
  // gap that had never been minted, and the file-backed record met that case with an
  // ANOMALY — a defect discovered on read, per reader, after the fact. As a foreign key it is not
  // discoverable at all: the row cannot be written.
  optional string gap_id = 1 [(sql) = {
    required: true
    unique: true
    why: "the gap id is what every later act refers to; a mint without one is a finding nothing can cite, close or rule on"
  }];
  optional string mint_key = 2;

  // class names the defect's kind, from the closed GapClass set. Its value's material_default is
  // stamped onto class_material at the write.
  optional GapClass class = 3 [(sql) = {
    required: true
    why: "the KIND of defect, from the closed set `mint --help` lists; `unclassified` when none fits, with --reason saying why. A gap with no class cannot be counted with its kind, and the class report is how a run learns it keeps making the same mistake"
  }];
  reserved 4, 5, 6, 7;
  reserved "class_new", "definition", "neighbor", "distinguisher";

  // location is the defect's span, quoted verbatim from the report and matched against it.
  optional string location = 8;

  // WHAT THIS GAP IS ABOUT, when it is not about a sentence — the same pair a lens finding carries,
  // resolved by the same code and spelled with the same two flags.
  //
  // It exists because the alternative was written down in mint's own help: "for a gap about
  // something MISSING, quote the sentence where it SHOULD be". That instruction asks a seat to
  // point at prose it is not objecting to, and the anchor it produces is a handle rather than a
  // subject — the defect Finding.about_kind was added to remove. A gap minted FROM such a finding
  // inherited it, so removing it on one verb and not the other left the concept half-landed.
  //
  // A gap has ONE subject, as a finding does: a non-blank `location` or this pair, never both and
  // never neither — the write refuses a gap with no subject (requireMintSubject).
  //
  // A gap takes every kind but `contradiction`: a contradiction is raised by a finding, and the
  // gap is minted from that finding (the write refuses it here).
  optional AboutKind about_kind = 23;
  optional string about_ref = 24;
  optional string problem = 9 [(sql) = {
    required: true
    why: "what is wrong — a gap with no stated problem cannot be repaired or re-audited, and --reason is your argument, never the problem"
  }];
  optional string required_fix = 10;

  // fix_new is the text that span should become — validated against the LIVE report, so a seat
  // cannot prescribe text without having read what it prescribes against.
  //
  // `fix_old` HELD THE SAME SPAN AS `location`, checked by a second matcher. A gap's location and
  // the span its proposal replaces were never two facts.
  optional string fix_new = 12;
  optional string fix_basis = 13;

  reserved 11;
  reserved "fix_old";

  optional string acceptance_check = 14 [(sql) = {
    required: true
    flag: "check"
    why: "the acceptance check red will run at re-audit — the pre-agreed contract"
  }];
  optional CheckKind check_kind = 15 [(sql) = {
    required: true
    flag: "check-kind"
    why: "document | computation | source — what would SETTLE your acceptance check. A run where every check is a document probe can never ask for a computation, and measured across six runs no seat ever wrote one"
  }];

  // LIKELIHOOD, IMPACT AND SEVERITY ARE REQUIRED; complexity_cost is not. The rule is not
  // "grade everything" — it is that a field whose ABSENCE IS INDISTINGUISHABLE FROM A LEGITIMATE
  // VALUE cannot be optional. GapMass multiplies likelihood by impact and an absent grade
  // contributes ZERO, so an ungraded gap reads exactly like a harmless one and sinks to the
  // bottom of every ranking. Severity joined them with the roundless record (plans/roundless.md
  // §III.B.2): wherever the class goes by grade, materiality reads MASS[current severity], so an
  // absent severity reads as mass zero — not material, readying nobody and never holding the
  // gate — which is exactly "trivial". The release sweep found it: gaps minted without one ended
  // runs VERIFIED over open work. Cost is still reported, not read.
  optional Grade severity = 16 [(sql) = {
    required: true
    why: "materiality reads it wherever the class goes by grade (medium and above holds the gate), so an absent grade would score as TRIVIAL and the gap would read as harmless rather than ungraded"
  }];
  optional Grade likelihood = 17 [(sql) = {
    required: true
    why: "it multiplies into the gap's mass, so an absent grade is scored as ZERO and the gap reads as harmless rather than ungraded"
  }];
  optional Grade impact = 18 [(sql) = {
    required: true
    why: "it multiplies into the gap's mass, so an absent grade is scored as ZERO and the gap reads as harmless rather than ungraded"
  }];
  optional Grade complexity_cost = 19;

  // ALWAYS PRESENT, even empty: a gap with no ancestors records an empty list, because an absent
  // key would read as "lineage unknown" where the truth is "lineage none".
  repeated string supersedes = 20;
  repeated string found_by = 21;
  // 26 is reserved: a stored mint may carry its bytes.
  reserved 26;

  // mint_reason is RED'S ARGUMENT FOR THE GAP, which is not the same fact as `problem`.
  //
  // `problem` is what is wrong with the report; this is why it is worth a gap — the case blue
  // answers and a bench weighs. `lens mint` stores --reason here and nowhere else: --problem is
  // the only flag that states the problem.
  //
  // IT WAS MISSING FROM THIS SCHEMA AND FROM THE FROZEN KEY CENSUS, so both mechanisms that exist
  // to catch a dropped key missed it, and internal/record/viewjson.go reported the hole in place
  // rather than deleting the line — which would have rendered red's argument as absent on every
  // gap while every test stayed green. Added here rather than excused: a test
  // (TestAGapCarriesRedsArgumentAndNotOnlyItsProblem) asserts it reaches the projection.
  optional string mint_reason = 22;

  // WHERE THIS GAP'S MATERIALITY STARTS, stamped by the write path from the class's
  // `material_default` and never by a seat: a lens that could set it could make any gap it minted
  // immaterial. Required, because an absent value would leave every reader of "is this gap
  // material" to guess, and the guess would be the grade alone. It is stored rather than joined
  // from the class because it is the gate's materiality AT THE ACT: a migrated gap whose archived
  // class moved to a value with another default keeps the stamp it was minted with.
  optional ClassMaterial class_material = 25 [(sql) = {
    required: true
    why: "every reader of materiality — the dispatch, the PASS gate, the chair's work list — reads it; the tool stamps it from the class's material default at the write"
  }];
}

// Close ends a gap on verified repair.
message Close {
  // LINEAGE NEVER DROPS. A regression closure that names no successor loses the thread from the
  // defect to the gap now carrying it, and the repair_regression denominator counts a closure that
  // resolved nothing. It was an `if` in validate, which left the DATABASE willing to store the very
  // state the tool refused.
  option (check) = {
    expr: "\"closure_class\" <> 'repaired_with_regression' OR \"successor\" IS NOT NULL"
    why: "a closure that reports a regression must name the gap carrying it forward — lineage never drops"
  };

  // THE CLOSURE ARGUMENT, KEPT AS A WALL WHILE IT STOPPED BEING A FIELD RULE.
  //
  // `prose` was `required: true`, which is unconditional and therefore refused a CARRY before
  // validate's exemption for one could run. Dropping the marking fixed the carry and made the
  // column nullable — and that would have handed the database the state the tool refuses, which
  // is exactly the hole the regression check above exists to close. Stated here instead, where a
  // rule about two fields together belongs: everything that is not a carry owes an argument.
  option (check) = {
    expr: "\"carried_from\" IS NOT NULL OR \"prose\" IS NOT NULL"
    why: "a closure states what was verified and why it holds; only a carry is exempt, because the epoch it restates already argued it"
  };

  optional string gap_id = 1 [(sql) = {
    required: true
    flag: "id"
    references: "mint.gap_id"
    why: "which gap this closes"
  }];
  // A CLOSE TAKES A WORD THAT CLOSES. `subset` generates the CHECK from the vocabulary's own
  // `closes` annotation, so the admitted words are never typed here.
  optional Disposition closure_class = 2 [(sql) = {
    subset: "closes"
    why: "a red close asserts a repair; `remanded` sends the gap back to the debate instead of closing it and is the bench's word alone"
  }];

  // The attestation anchor: WHO checked, with WHAT tool, against WHAT target. An unanchored
  // closure is unauditable — or the closure is a carry, restating an earlier one.
  optional string anchor_seat = 3;
  // (feov.record.v1.prose) is spelled out in this message and in Outcome because each has a FIELD
  // named `prose`, which the bare option name would resolve to.
  optional string anchor_tool = 4 [(sql) = { flag: "verified-with" }, (feov.record.v1.prose) = false];
  optional string anchor_target = 5;
  optional string carried_from = 6;

  // successor carries the unresolved remainder forward. Required by CLOSED_WITH_REGRESSION,
  // because lineage never drops — and now it must name a gap that EXISTS. "Lineage never drops"
  // was enforced as "the field is not empty", which a typo satisfies: the closure recorded a
  // successor, the successor pointed at nothing, and the remainder was carried forward to a gap
  // id no board has ever had.
  optional string successor = 7 [(sql) = { references: "mint.gap_id" }];

  // prose is the closure's ARGUMENT: what was verified and why it holds. The report renders it
  // and the re-audit reads it.
  //
  // NOT `required` — CONDITIONALLY required, like Inquiry.question, and for the same kind of reason.
  // `chair carry` restates a closure an earlier round already argued, so demanding a fresh
  // argument asks the same thing twice; validate exempts a carry and requires it everywhere else.
  // Marked unconditional here, the annotation refused a carry BEFORE that exemption could run,
  // and `chair carry --id R2-3 --carried-from 2` — the invocation the verb's own help documents,
  // with --reason listed nowhere in it — was refused outright. The exemption still read as live:
  // the code was there, commented, and could not execute.
  //
  // An annotation cannot say "unless this other field is set", which is the split validate's
  // header states: unconditional requirements on the field, everything conditional below.
  optional string prose = 8 [(sql) = {
    flag: "reason"
    why: "the closure's argument — what was verified and why it holds; the report renders it and the re-audit reads it"
  }, (feov.record.v1.prose) = true];

  // anchors are the ids the closure was verified with — each a report anchor or an inquiry the
  // record holds, and never the gap being closed, refused at the write otherwise. Capture's
  // attestation audit joins each to the other tool calls of the closer's sitting: a closure naming an
  // anchor it never read is the dishonesty that audit exists to find. Empty is "verified with no
  // anchor", and the audit then reads anchor_target's prose.
  repeated string anchors = 9;
}

// Closing is the closing argument on a docket-bound gap, read by the bench.
message Closing {
  optional string gap_id = 1 [(sql) = { references: "mint.gap_id" }];
  optional string text = 2 [(sql) = {
    required: true
    flag: "reason"
    why: "the closing argument for this gap — the report renders it under the gap's docket"
  }, (prose) = true];
}

// Regrade moves a grade, with its reason. A grade decides what happens NEXT to a gap, so moving
// one on a finished gap changes a number nobody reads.
message Regrade {
  optional string gap_id = 1 [(sql) = { references: "mint.gap_id" }];
  optional Grade severity = 2;
  optional Grade likelihood = 3;
  optional Grade impact = 4;
  optional Grade complexity_cost = 5;
  optional string basis = 6 [(sql) = {
    required: true
    flag: "reason"
    why: "grade movement is recorded with its reason"
  }, (prose) = true];
}

// SpotCheck re-reads archived closures and names the stale areas read before a PASS. THE ARCHIVE'S
// SIZE IS COMPUTED FROM THE BOARD, NOT TAKEN FROM THE SEAT: a spot-check names what it re-read, and
// the board says how much there was to read.
message SpotCheck {
  repeated string ids = 1;
  // 3 held `none`, a seat's claim that the archive was empty. The board answers that, and nothing
  // asked the seat to say it. Reserved: a stored spot-check carries the bytes.
  reserved 3;
  reserved "none";

  // ONE PROSE CHANNEL: what the spot-check found, or why it named nothing.
  optional string reason = 4 [(prose) = true];

  // The lens seats whose area the chair read the changes against this sitting — the plan's
  // stale_areas, each a retired lens whose pin the report head has moved past. A PASS is
  // refused until a spot-check in the chair's sitting names every stale area. Validated against the
  // cast at the write.
  repeated string areas = 5;

  reserved 2;
  reserved "notes";
}

// Finding is a lens observation. The label is TOOL-assigned (L{lens}-F{n}); an unlabelled
// finding can never be named in a gap's found_by and its work is lost.
// FindingAbout is WHAT A FINDING IS ANCHORED TO when the thing it names is not on the page.
//
// A defect about an ABSENCE has no sentence to quote, and a quote borrowed as a handle points a
// reader of the gap list at prose the finding itself calls fine.
//
// IT MATTERS TO THE STEELMAN DUTY IN PARTICULAR. Red's duty is to audit the REASONS declined and
// abandoned inquiries were set aside, and the strongest such findings are arguments against a
// reason — which is not report prose at all.
//
// The targets below are REFERENCES THE RECORD CAN CHECK, which a borrowed quote is not: an
// inquiry id either names an inquiry this run proposed or it does not.
//
// IT IS `AboutKind` AND NOT `FindingAbout` BECAUSE A GAP ANCHORS THE SAME WAY. `lens mint` took
// `--quote` and told the seat, in its own help, to "quote the sentence where it SHOULD be — that
// is how a lens finding anchors an omission". Naming this after the finding would leave the seat
// spelling one act two ways across two verbs, which is a worse failure for the reader of the help
// than a slightly longer enum name is for anyone.
enum AboutKind {
  ABOUT_KIND_UNSPECIFIED = 0;
  ABOUT_KIND_SECTION = 1 [(means) = "a named report section, for something MISSING from it — the anchor a quote cannot provide, because the text you are objecting to is not there", (gap_may_name) = true];
  ABOUT_KIND_INQUIRY = 2 [(means) = "an inquiry, by its id: an objection to the inquiry as the record holds it and the report prints it — the REASON it was declined, deferred or abandoned, the METHOD its fate states, or a fate the report's own text or a proof contradicts. The steelman duty's own anchor", (gap_may_name) = true];
  ABOUT_KIND_GAP = 3 [(means) = "a gap already on the board, by its id: a dispute with its grade, its fix, or whether it stands", (gap_may_name) = true];
  ABOUT_KIND_CONTRADICTION = 4 [(means) = "a contradiction red recorded, by its id from `show evidence` (a source red read refutes or is silent on a sentence of the report): the finding raises it even when the sentence has since been edited away, and the gap minted from that finding answers it. A finding only — a gap is minted from that finding. Not the report contradicting itself: quote that", (gap_may_name) = false];
  ABOUT_KIND_PROOF = 5 [(means) = "a proof, by its anchor, whose sentence was judged unsound", (gap_may_name) = true];
}

message Finding {
  // id is the finding's one name: the tool mints it, a gap's found_by names it by it, and the
  // finding's anchor carries it. The lens that filed it is the event's seat, never part of the id.
  //
  // A finding with no id CANNOT BE ADDRESSED, and every one must get a fate. Measured on the
  // 2026-07-18 run: 8 finding/observe events carried no name at all, so the chair could not name
  // them even to decline them — they sat in the undisposed set forever.
  optional string id = 11 [(sql) = {
    required: true
    unique: true
    why: "the tool mints it; a finding with none can never be credited in a gap's found_by and its work is lost"
  }];
  optional string finding_key = 2;
  reserved 1, 3;
  reserved "finding_id", "label";
  optional string location = 4;
  optional string text = 5;
  optional Grade severity = 6;
  optional Grade likelihood = 7;
  optional Grade impact = 8;

  // WHAT THIS FINDING IS ABOUT, when it is not about a sentence. Exactly one of `location` (a live
  // report quote, which places a marker) or this pair is set — a finding anchored to nothing is
  // the state the verb refuses, and one anchored to BOTH is claiming two subjects.
  //
  // About a `contradiction`, about_ref is the contradiction's id — the events.id of the reading
  // that opened it, in decimal — and the write refuses one that names no open contradiction.
  // `migrate` translates it, because events.id renumbers on replay.
  optional AboutKind about_kind = 9;
  optional string about_ref = 10;
}

// Anchor is a marker placed in the report: the marker of the act `id` names, at the end of its
// quote `location`. It is the one event that places a marker, of any kind, so an id is placed once
// on a run: a second Anchor for it would be a second marker for one act.
message Anchor {
  optional string id = 1 [(sql) = {unique: true}];
  optional string location = 2;
  reserved 3 to 6;
  reserved "finding_id", "finding_key", "label", "text";
}

// SourceTextOrigin is WHERE THE CITED TEXT CAME FROM, and the tool stamps it; a seat never types
// it: whether the text is the author's or the local engine's reading of page images. A bool
// `ocr_derived` would fold a scan nobody read and an author's own text into one `false`, and
// "false" on an unread scan claims the text is trustworthy.
enum SourceTextOrigin {
  SOURCE_TEXT_ORIGIN_UNSPECIFIED = 0;
  SOURCE_TEXT_ORIGIN_EMBEDDED = 1 [(means) = "the retrieved bytes carry the text: markup, plain text, or a PDF's own text layer"];
  SOURCE_TEXT_ORIGIN_OCR = 2 [(means) = "machine-read off page images by the local engine — deterministic, and it can misread, so a quote from it is checked against the page's pixels"];
  SOURCE_TEXT_ORIGIN_NONE = 3 [(means) = "the tool holds no text for the source: an image, or a scan nobody has read"];
  SOURCE_TEXT_ORIGIN_NOT_RECORDED = 4 [(means) = "this citation predates the field; written only by migrate"];
}

// WorkStatus is WHAT THE LITERATURE NOW SAYS ABOUT THE CITED WORK, stamped by the tool; a seat
// never types it. It is a second axis, distinct from the one beside it: SourceTextOrigin says whose
// reading the text is, and describes THIS RETRIEVAL. A retraction survives a flawless one. The pdf of a withdrawn paper is byte-identical
// to what it was before the notice, the notice is a separate document nobody fetched, and so no
// amount of fetch quality discovers it — only a maintained index does.
//
// IT IS AN ENUM AND NOT A BOOL, for the reason the fields around it give: `false` would fold "an
// index was asked and reports the work standing" together with "nobody asked". A citation may
// rest on the first and never on the second, and until this field existed the whole axis lived
// as a sentence in `fetch`'s output asking the seat to remember — a fact nothing could refuse,
// whose miss read exactly like a sound paper.
enum WorkStatus {
  WORK_STATUS_UNSPECIFIED = 0;
  WORK_STATUS_NOT_CHECKED = 1 [(means) = "no index was consulted about this work — it carries no doi, or the index did not answer. It says NOTHING about whether the work stands, and must not be read as reassurance"];
  WORK_STATUS_STANDING = 2 [(means) = "an index was asked and reports no retraction: the work stands in the literature as published"];
  WORK_STATUS_RETRACTED = 3 [(means) = "an index reports the work RETRACTED. It may still be cited — as retracted, which the footnote and the Bibliography say for you — and its findings support no claim: a quotation from it is evidence of what the withdrawn paper said, and nothing more"];
  WORK_STATUS_NOT_RECORDED = 4 [(means) = "this citation predates the field; written only by migrate"];
}

// SourceCompleteness is WHICH PART OF THE WORK THE RUN'S COPY IS, stamped by the tool from what the
// fetch recorded; a seat never types it. A third axis beside the two above: SourceTextOrigin is
// whose reading its text is, WorkStatus what the literature says of the work — and neither says whether the copy is the paper or only its
// abstract, which is the difference between confirming a study and confirming its summary.
//
// AN ENUM AND NOT A BOOL, for WorkStatus's reason: NOT_ASKED folds nothing into FULL. Only FULL
// rests on positive evidence; UNVERIFIED says nobody could tell.
enum SourceCompleteness {
  SOURCE_COMPLETENESS_UNSPECIFIED = 0;
  SOURCE_COMPLETENESS_FULL = 1 [(means) = "the copy carries the work's body: its platform marks the body sections, or it is a pdf covering the page span the work declares"];
  SOURCE_COMPLETENESS_ABSTRACT = 2 [(means) = "the copy is the work's ABSTRACT page: its platform printed a paywall or page images in place of the body. What it confirms is what the abstract says, not what the study shows, and the footnote and the Bibliography mark it ABSTRACT ONLY for the reader"];
  SOURCE_COMPLETENESS_UNVERIFIED = 3 [(means) = "nothing the tool knows could tell whether the copy carries the body — a platform with no known marker, a pdf much shorter than the work, a book's pdf"];
  SOURCE_COMPLETENESS_NOT_THE_WORK = 4 [(means) = "the copy is not the work at all: a sign-in page, a book's sales page"];
  SOURCE_COMPLETENESS_NOT_ASKED = 5 [(means) = "the question did not apply or could not be put: a page that is not about a scholarly work, a pdf with no declared span, or a source outside the run's cache. It says NOTHING about whether the copy is complete"];
  SOURCE_COMPLETENESS_NOT_RECORDED = 6 [(means) = "this citation predates the field; written only by migrate"];
}

// CopySubstitution is WHOSE BYTES A CITATION READ, stamped by the tool from what the fetch recorded;
// a seat never types it. The seat types a url, and the cache can answer it with bytes from
// somewhere else: the full text the url's page pointed to, a copy the recovery chain took when the
// url refused, a fuller copy taken because the url's page was not the work's body, or a backend a
// fetch named. Each is a legitimate answer and none is the url's own, and a citation that recorded
// only the typed url claimed to have read it. copy_url beside it names where the bytes came from;
// sha256 is already those bytes' hash.
//
// AN ENUM AND NOT AN EMPTY copy_url, for WorkStatus's reason: an empty field folds "the url's own
// bytes" together with "nobody recorded whose", and only NONE rests on the fetch having said so.
enum CopySubstitution {
  COPY_SUBSTITUTION_UNSPECIFIED = 0;
  COPY_SUBSTITUTION_NONE = 1 [(means) = "the cited bytes are the typed url's own: the url answered, and its answer is what was read"];
  COPY_SUBSTITUTION_FOLLOWED_LINK = 2 [(means) = "the typed url's page named its own full text, and the tool followed that pointer: the cited bytes are the page at copy_url, the same work at the place its publisher named"];
  COPY_SUBSTITUTION_RECOVERED = 3 [(means) = "the typed url refused this container, and the tool's recovery took the bytes from another source — an archive snapshot, an open-access copy, arXiv, or a bibliographic record — at copy_url. With no copy_url the bytes are the tool's own statement of what the recovery found, not a document"];
  COPY_SUBSTITUTION_FULLER_COPY = 4 [(means) = "the typed url's page was not known to carry the work's body, and the tool took a copy carrying more of it from another source, at copy_url — another copy of the work, possibly another version"];
  COPY_SUBSTITUTION_NAMED_BACKEND = 5 [(means) = "a fetch that named a backend cached its answer under the typed url: the cited bytes came from that backend, at copy_url. With no copy_url the bytes are the tool's own statement of what the backend found, not a document"];
  COPY_SUBSTITUTION_NOT_RECORDED = 6 [(means) = "this citation or reading predates the field; written only by migrate"];
  COPY_SUBSTITUTION_NOT_CACHED = 7 [(means) = "a reading only: this run's fetch cache held no copy of the url when red recorded it — red read the source outside the tool, or the cache that held it is gone — so the tool cannot say whose bytes were read. It says NOTHING about the copy, and a citation never carries it: cite fetches what it records"];
}

// Cite records a source. access_date is ENGINE-SUPPLIED from the record clock, not typed by the
// seat — it drives the staleness re-fetch trigger, so a value nothing can parse would silently
// disable that check for the row.
message Cite {
  optional string label = 1;
  optional string url = 2;
  optional string sha256 = 3;
  // title is the Bibliography entry and text the argument for the source — the seat's own wording.
  // The label, url, hash, location and access date identify the source and place its marker.
  optional string title = 4 [(prose) = true];
  optional string location = 5 [(prose) = false, (sql) = { flag: "quote" }];
  optional string access_date = 6;
  // cite_key is typed --key: the flag word is declared so a refusal names what a seat can type.
  optional string cite_key = 7 [(sql) = { flag: "key" }];
  optional string text = 9 [(prose) = true, (sql) = { flag: "reason" }];

  // WHERE THE QUOTE SITS, stamped by the tool. Not `(sql).required`: that annotation teaches a flag, and no seat types these —
  // validate refuses an unstamped origin instead.
  //
  // source_span is the seat's span, verbatim as typed — the source's words, which the tool found
  // once in the cached text before it wrote. pages are the PDF page indexes of an OCR reading
  // the span sits on; ocr_engine and ocr_text_sha name WHICH reading located them, because
  // run-archive keeps no cache and the event is the only thing that outlives it. A page is bound
  // to that page's pixels, not to the engine: a later engine can stop finding the span, never
  // move it.
  optional SourceTextOrigin source_text_origin = 11 [(prose) = false];
  optional string source_span = 12 [(prose) = false];
  repeated int32 pages = 13 [(prose) = false];
  optional string ocr_engine = 14 [(prose) = false];
  optional string ocr_text_sha = 15 [(prose) = false];

  // WHERE THE SPAN WAS FOUND, AND WHAT THE SOURCE SAYS AROUND IT, stamped by the tool. span_start
  // and span_end are byte offsets of the span in the text it was found in — the source's text for
  // embedded text, the page's reading for OCR text — and span_text_sha is that text's sha256, so
  // the offsets name bytes a re-check can open. source_before, source_matched and source_after are
  // those bytes: up to a bounded window either side, and the span exactly as the source holds it.
  // They are what a lens reads the cited sentence against, kept on the event because run-archive
  // keeps no cache. Blue's own wording about the source is `text`, and no reader shows the two
  // under one name.
  optional int32 span_start = 18 [(prose) = false];
  optional int32 span_end = 19 [(prose) = false];
  optional string span_text_sha = 20 [(prose) = false];
  optional string source_before = 21 [(prose) = false];
  optional string source_matched = 22 [(prose) = false];
  optional string source_after = 23 [(prose) = false];

  // WHAT THE LITERATURE SAYS ABOUT THE WORK, stamped from the fetch index the same way the origin
  // above is. Not `(sql).required`: no seat types it, so `validate` refuses an unstamped value
  // rather than a flag teaching one.
  optional WorkStatus work_status = 16 [(prose) = false];

  // WHICH PART OF THE WORK THE CITED COPY IS, stamped from the fetch index like the two above.
  optional SourceCompleteness source_completeness = 17 [(prose) = false];

  // WHOSE BYTES THE CITATION READ, stamped from the fetch index like the three above, and where
  // they came from when they are not the typed url's own. copy_url is set exactly when the
  // substitution is not NONE and the bytes were fetched from somewhere.
  optional CopySubstitution copy_substitution = 24 [(prose) = false];
  optional string copy_url = 25 [(prose) = false];

  // `claim` held the cited sentence a SECOND time, beside `location` which held it to place the
  // anchor. One span, one field. `source_text_read` was the seat's assertion of how much of the
  // source it read, which nothing read back.
  reserved 8, 10;
  reserved "claim", "source_text_read";
}

// Verify is red reading a source at the leaf.
message Verify {
  optional string claim = 1 [(sql) = {
    flag: "quote"
    required: true
    why: "the claim you checked, quoted from the report — a verification that does not name what it verified cannot be re-checked, contested, or counted"
  }];

  // A SOURCE IS NAMED BY url + title, here as in Cite. `reference` was a free-text third
  // spelling on the one verb that reads a source red found itself, so the corroboration a run
  // rests on was identified less precisely than the citations it audits.
  optional string url = 9;
  optional string title = 10;

  // anchor names the citation checked, and `verify` requires it. A corroboration — a source red
  // found itself — names none: the empty anchor IS the corroboration, and every reader splits on it.
  optional string anchor = 3;

  optional string access_date = 5;
  optional SourceOutcome outcome = 6 [(sql) = {
    required: true
    flag: "as"
    why: "what the source ACTUALLY DID for the claim — the negative half is the point, and until 0.60.0 there was no field for it"
  }];
  optional Confidence confidence = 7 [(sql) = {
    required: true
    why: "how sure you are of that determination, which is a DIFFERENT question from what the determination was. `refutes` you would defend and `refutes` you are unsure of are different facts"
  }];
  optional string text = 8 [(sql) = {
    required: true
    flag: "reason"
    why: "what the source says, in your words — a verdict with no reading behind it is the assertion this verb exists to replace"
  }];

  // label IS THE FOOTNOTE, and it is what moves this event's key off the source.
  //
  // Set ONLY by `corroborate`, and only when the outcome supports: a source red found itself,
  // for a claim blue made, becomes an ordinary footnote in the assembled bibliography. A human
  // reader cares that the text has appropriate references, not which team inserted them —
  // `citationid.go` used to say the opposite in as many words ("Red's `lens cite` carries no
  // label and is EXCLUDED"), and the consequence was that red's independent corroboration
  // reached no reader of the document at all.
  //
  // IT ALSO FIXES THE KEY, WITHOUT TOUCHING keyFields. That list is walked first-match, and
  // `label` sits before `url` — so a corroboration with a label keys on the minted id and one
  // source may corroborate many claims, exactly as `blue cite` may cite one url many times.
  // Keyed on `url`, only the FIRST claim recorded and the rest were refused. Crash-retry
  // idempotency stays where blue's is: on `--key`.
  //
  // `verify` never sets it — that verb keys on `anchor`, which already sits at one sentence.
  optional string label = 11;

  // THE PAGE IMAGE RED CHECKED, for a citation whose OCR span carries pages. page is the one red
  // names; page_render_sha is the sha256 of the image on disk when the verification was written,
  // and reading_render_sha the render the reading was made from. A mismatch between the two is
  // recorded, not refused: the image still shows the page, and two fields let any reader compare
  // them. All three are set together or not at all.
  optional int32 page = 12;
  optional string page_render_sha = 13;
  optional string reading_render_sha = 14;

  // A LABELLED CORROBORATION IS A FOOTNOTE, so it carries the same stamp a cite does. Red finding
  // a supporting source for blue's claim and that source being retracted is the worst case this
  // field exists for: the strongest thing an adversarial process produces, resting on withdrawn
  // work, with nothing in the document saying so.
  optional WorkStatus work_status = 15 [(prose) = false];

  // WHICH PART OF THE WORK RED'S COPY IS. A verdict read off an abstract confirms what the abstract
  // says; this is what lets a reader of the record tell that from a verdict on the study.
  optional SourceCompleteness source_completeness = 16 [(prose) = false];

  // WHAT A supports_with_bridge READING BRIDGED, typed --bridge. Set with that outcome and only with
  // it; a live write of that outcome without it is refused (validate). Its readers: `show evidence`'s
  // verification rows, which blue reads to find where its evidence is thinnest and every lens reads
  // before adjudicating the same citation, and the verb's own output.
  optional BridgeKind bridge = 17 [(sql) = { flag: "bridge" }];

  // WHOSE BYTES RED'S READING WAS MADE AGAINST, stamped by the tool from the run's fetch cache as
  // Cite's pair is: the entry the source's url resolves to when the reading is written — the
  // citation's url for `verify`, the typed url for `corroborate`. A cache with no copy of it is
  // not_cached. Their readers: `show evidence`'s verification rows and a labelled corroboration's
  // source row, and a labelled corroboration's note and Bibliography line in the report.
  optional CopySubstitution copy_substitution = 18 [(prose) = false];
  optional string copy_url = 19 [(prose) = false];

  // `independent` restated the empty anchor as a bool.
  reserved 2, 4;
  reserved "reference", "independent";
}

// Proof is a computation blue ran to settle a claim. The tool executes it twice and caches;
// `drift` records that the two runs disagreed, which makes it a measurement of a moving system
// rather than a proof.
message Proof {
  optional string proof_id = 1;
  // proof_key is typed --key: the flag word is declared so a refusal names what a seat can type.
  optional string proof_key = 2 [(sql) = { flag: "key" }];
  optional string proof_sha = 3;
  // proof_basis is written by blue/prove.go and read at eight sites; found by the frozen key
  // census for the same reason as Outcome's three.
  optional string proof_basis = 8;
  optional string answers = 4;
  optional string cites = 5;

  // drift is WHAT MOVED between the two runs, not merely that something did.
  //
  // It was a bool, and the sentence describing the divergence lived in the proof cache's
  // meta.json instead. That split put a fact about the debate in a JSON file beside the record
  // that exists to hold it — and the report renders the sentence, so the record was the one
  // party to the exchange that could not say what happened. Absent means the two runs agreed.
  optional string drift = 6;

  // text is the proof's note, printed as its footnote — the seat's own wording. What ran, its hash,
  // exit and anchoring site are the execution's facts.
  optional string text = 7 [(prose) = true, (sql) = { flag: "reason" }];

  // script and exit are the execution's own facts, and they belong here for the same reason:
  // `report/proofs.go` renders both, and a reader of the record should not have to open a
  // second store to learn how a proof ran. The script BODY and its output stay in the cache as
  // CONTENT, addressed by proof_sha — content is not a fact about the debate.
  optional string script = 9;
  optional int32 exit = 10;

  // location is the anchoring quote this proof backs — the same `--quote` cite and finding record.
  // The Anchor appended after the proof carries it and places the marker; held here as well, it is
  // the proof's own statement of its site, which a retry places an owed Anchor at and every reader
  // of the proof reads without a join.
  optional string location = 11 [(prose) = false, (sql) = { flag: "quote" }];
}

// Reproduce is red checking ONE PROOF ANCHOR. REPRODUCING IS NOT PROVING: `rerun` is COMPUTED by
// the tool and is never claimed by the seat, while `soundness` is red's JUDGEMENT of whether the
// script establishes THIS anchor's sentence.
//
// THE ANCHOR IS ABOUT THE QUOTE, THE PROOF IS ABOUT THE PROOF ITSELF (gblock, 2026-10-12). One
// script can back several sentences — `prove` of a script already proved records a new anchor over
// the same sha — so a re-run belongs to the script and answers for every anchor on it, while a
// soundness verdict belongs to the one sentence it was judged against. Keyed by sha alone, a lens's
// `unsound` on one sentence was overwritten by another lens's `sound` on another in 11 of 15
// archived runs with proofs.
//
// The seat names the proof by its anchor; the tool derives `proof_sha` from it, and the write
// refuses a sha that is not that proof's. The two joins are spelled as Proof spells them —
// `proof_id` for the anchor, `proof_sha` for the script.
//
// NOT KEYED. A seat may judge one anchor more than once in a sitting, and its latest judgement is
// its verdict: a check is read by the anchor's ledger (anchorchecks.go), which takes each seat's
// latest, so a retried write repeats a verdict and changes nothing.
message Reproduce {
  optional string proof_sha = 1;
  optional Soundness soundness = 3;
  optional string recorded_output = 4;
  optional string observed_output = 5;
  optional string note = 6 [(sql) = { flag: "reason" }, (prose) = true];
  optional string proof_id = 7 [(sql) = {
    flag: "anchor"
    required: true
    why: "the proof whose sentence you judged, by its anchor — a soundness verdict is about one sentence, and a script can back several"
  }];
  optional Rerun rerun = 8;

  reserved 2;
  reserved "reproduced";
}

// InquiryReview is the chair's statement, ONCE PER EPOCH, that it read the current report against
// the record's inquiries.
//
// The report's account of its own research — "we pursued X", "we deferred Y" — reaches the page as
// a row `assemble` GENERATES from the record. It carries no citation anchor, so `lens verify`
// cannot reach it: without this event nothing on the record says those claims were ever read, and
// an unread section and a sound one are the same bytes.
//
// ONE EVENT PER EPOCH, NOT ONE PER INQUIRY. Presence is not a question: inquiries reach the report
// generated from the record, so blue cannot cut them. An inquiry is on the page because the record
// says it is, and a per-inquiry `cut`/`absent` state would name something no writer could produce.
//
// WHAT IS LEFT IS AN ORDINARY GAP. The live question is whether blue's BODY delivered the research
// an inquiry claims — thin treatment, an unanswered hypothesis, a method never run. That is a defect
// in the report, so it is minted as a gap and gets the lifecycle, the blue duty, the grade and the
// PASS gate every other gap already has. A second vocabulary for the same fact is exactly the
// aliasing this schema exists to remove.
//
// WHY SILENCE CANNOT DISCHARGE IT, when the log's clean case is derived from silence: the log is
// for exceptions, and a sitting that recorded acts and filed nothing there is the clean reading.
// This is a READ, and an absent read is indistinguishable from a read that found the section sound
// — so the read is the act, stated once per epoch with what it found. `reason` is required at the
// write path because an explicit negative is only worth more than silence when it says what was
// looked at.
message InquiryReview {
  optional string reason = 1 [(prose) = true];
}

// Inquiry is an inquiry with a lifecycle. A PROPOSAL assigns the id and carries the substance;
// a RECORD of a fate names the inquiry and carries only the new status and its reason, which is
// why `question` cannot be required unconditionally.
message Inquiry {
  optional string inquiry_id = 1;
  // NOT `required`: only UNCONDITIONAL requirements belong on a field. `question` is required on a
  // PROPOSAL and must not be on a record of a fate, and record.go's Inquiry arm spells that out.
  // Marked unconditional, CheckRequired would refuse every record of a fate before the
  // conditional check could run, and the derived DDL would put NOT NULL on the column so the row
  // could not be stored either.
  optional string question = 2 [(sql) = {
    flag: "question"
    why: "the question this inquiry asks — an unnamed inquiry teaches a future run nothing"
  }, (prose) = true];
  optional string hypothesis = 3 [(prose) = true];
  // method is a FATE's account, as reason is: what an approach that ran actually did, what a
  // deferred or declined one leaves a later run to do, what an abandoned one tried. A proposal holds
  // none (record.go's Inquiry arm refuses one), and the latest fate's method is the one printed.
  optional string method = 4 [(prose) = true];
  optional InquiryStatus status = 5 [(sql) = {
    required: true
    flag: "as"
    why: "the inquiry's fate; the inquiries projection groups by it"
  }];

  // supersedes_status marks this event as a record of a fate rather than a proposal.
  optional string supersedes_status = 6;

  // A declined, deferred or abandoned inquiry requires a reason: the road not taken is worthless
  // without why, and a deferral with none is indistinguishable from forgetting.
  optional string reason = 7 [(prose) = true];
}

// BlueEdit is a change to the report. `answers` names the gap the edit responds to, and it is a
// KEY rather than a convention — the prose habit it replaced linked only 73% of the time, which
// is reliable enough to look like a key and not reliable enough to be one.
// BaseIngest is the frozen round-0 report, stored VERBATIM at ingest (issue #709) — the origin the
// diff-stack replays over. `blue edit` records each change as a BlueEdit; the current report is
// this text with those edits folded back on. Written ONCE and never rewritten (a second ingest is
// refused and redirected to `blue edit`), so the report has no writable file — only this base event
// and its edits. `text` is the whole report, undecomposed: every reader operates on the rendered
// text, not a document model, so there is nothing to parse and nothing to lose.
message BaseIngest {
  optional string text = 1;
}

message BlueEdit {
  optional string edit_key = 1;
  optional string answers = 2;
  optional string old = 3;
  optional string new = 4;
  optional string text = 5;

  // applied_verbatim marks text taken unchanged from red's own --fix-new. Estoppel is enforced
  // on it: red may not open a clean slate against its own words.
  optional bool applied_verbatim = 6;

  // reopened are the anchors whose SENTENCE this edit changed — the citations, findings and
  // proofs whose referent moved under them.
  //
  // THE ANCHOR AND ITS REFERENT ARE TWO CONCERNS AND ONLY ONE WAS ENFORCED. An anchor is never
  // lost: `droppedMarker` refuses any edit that would drop one, and that promise holds — measured.
  // But an anchor that SURVIVES onto rewritten text is a citation backing a sentence nobody read,
  // and nothing said so. Measured: blue cited "The sky is blue and the grass is green", rewrote it
  // to "The sky is green and the grass is on fire", and the citation followed the inversion.
  //
  // Text moves through exactly ONE path — `blue edit` — so the no-loss proof and the
  // requires-review mark belong on that one channel rather than being inferred later by a reader
  // comparing documents it no longer has.
  //
  // It is a REOPENING, not an invalidation: the reference stands, and what changed is that its
  // referent needs looking at again. A verification of a reopened anchor is stale rather than
  // wrong, which is a different fact and gets a different word.
  repeated string reopened = 7;

  // ACCEPTED — blue took red's prescription through `blue edit --accept` rather than typing it.
  //
  // WHY IT IS A SEPARATE FACT FROM applied_verbatim. Both are true on an acceptance, and only
  // applied_verbatim is true when blue transcribed red's text by hand and the bytes happened to
  // match. Collapsing them would make the two indistinguishable on the record — and the one
  // measurement that matters here is whether blue is ACCEPTING more and arguing less, which a
  // count that also includes perfect transcription cannot answer.
  //
  // The distinction is also a difference in kind, not degree: on the accept path the tool
  // supplied the bytes, so verbatim-ness is structural. On the ordinary path it is the outcome
  // of a comparison that a stray space would have failed.
  optional bool accepted = 8;

  // exact_span — this edit replaced `old` AS WRITTEN, trailing punctuation included, rather than
  // the span the ordinary locate finds.
  //
  // The ordinary locate trims a quote's trailing punctuation, so a repair confined to that
  // punctuation (`on their own.).` → `on their own.)`) replaces a span with itself, and one that
  // changes a terminator leaves the old one standing beside the new. When that happens and the
  // quote occurs byte-for-byte exactly once, the edit takes the literal span instead — and the
  // choice is RECORDED, because replay cannot re-derive it: an event written before this field
  // existed, whose trimmed span was a no-op, must still replay as one.
  optional bool exact_span = 9;
}

// Retire removes substance from the report. Substance leaves ONLY with its reason recorded.
message Retire {
  optional string claim = 1 [(sql) = {
    flag: "quote"
    required: true
    why: "quote the claim as it stood — a removal nobody can identify is not on the record"
  }];
  optional string reason = 2 [(sql) = {
    required: true
    why: "refuted, superseded, merged, out of scope — substance leaves the report ONLY with its reason recorded"
  }];
  optional string superseded_by = 3;
  optional string removal_basis = 4;

  // anchors are the anchor ids that EXIT THE REPORT WITH THIS CLAIM — computed by the verb, never
  // typed by a seat.
  //
  // An edit may carry an anchor but never drop one, so a claim whose sentence is edited away
  // leaves its anchor BARE: the anchor alone in its segment, backing no prose. Before this field
  // nothing could take that anchor out, so it stood forever — a `[^N]` orphan with a live
  // bibliography entry in the assembled report, an empty `- ?` bullet, and a segment the claim
  // counter still counted, which let a retire count a claim that had never left the count.
  //
  // Filled with the anchors that stood on the retired claim in the edit that took it out — the
  // claim being the whole of that edit's old span or a run of its whole sentences, across the anchor
  // layer, modulo surrounding whitespace, emphasis and trailing punctuation (a fragment names
  // nothing): each that is present AND bare in the report at the write, and each the seat names
  // that the edit carried onto surviving prose and no later edit put back into prose. An anchor of
  // every kind leaves alike. Each named c- anchor is one counted claim
  // leaving the report. Replay removes each named anchor at
  // this event's position (the report_op view's `remove` rows). A record written before this field
  // carries none, and replays exactly as it did.
  repeated string anchors = 5;
}

message ManifestRow {
  optional string gap_id = 1 [(sql) = { references: "mint.gap_id" }];
  optional string row = 2 [(sql) = { flag: "reason" }, (prose) = true];
}

// LogSource is WHO recorded the entry, and LogType is WHAT IT ASSERTS. They are two axes and were
// one enum: the old `FrictionKind` mixed a tool-emitted refusal in with a seat's own report, so a
// "seat reports only" filter had to know which VALUES were tool values. Splitting them means a new
// tool-emitted type never breaks that filter.
//
// The zero of each is declared because proto3 requires one, and is UNWRITABLE: schema.go skips the
// UNSPECIFIED zero when building the enum vocabulary table ("absence is NULL here"), so the table
// holds only real values and the column's FOREIGN KEY into it refuses an explicit zero. With
// `required: true` the column is NOT NULL as well: NULL refused by the requirement, the zero by
// the key.
enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_SEAT = 1 [(means) = "a seat filed this about its own sitting"];
  LOG_SOURCE_TOOL = 2 [(means) = "the tool emitted this itself, rather than a seat filing it"];
}

// LogType is WHAT THE ENTRY ASSERTS, and it is a FIELD rather than something a reader infers from
// the wording. estoppel.go:142-154 carries the history: the prose is aimed at a seat and must stay
// editable, so the count an operator reads must not move when it is edited (#283). A `{text}`-only
// message would have reverted that fix silently.
enum LogType {
  LOG_TYPE_UNSPECIFIED = 0;
  // 1 WAS NOMINAL, AND IT IS RETIRED. It asserted "the sitting is clean" so that an attested-clean
  // sitting stayed distinguishable from a channel nobody used. The harness brackets every dispatch
  // at both ends, so the record already holds that a seat sat, and clean is now DERIVED from
  // "sat and filed nothing" rather than asserted. Measured before retirement: 40 of 40 entries in
  // one run and 42 of 42 in another were nominal, and not one carried anything to act on — the
  // channel cost a call per sitting and returned nothing an operator could triage.
  reserved 1;
  reserved "LOG_TYPE_NOMINAL";
  LOG_TYPE_DEFECT = 2 [(seat_may_file) = true, (means) = "something is broken: it did the wrong thing, or failed where it should have worked. A tool that fails INTERNALLY records this too, as (TOOL, DEFECT)"]; // an error nobody learns about is one nothing improves on
  LOG_TYPE_REQUEST = 3 [(seat_may_file) = true, (means) = "a capability that does not exist — the act you wanted was on no surface, so there was nothing to get wrong. Distinct from a defect because the fix is to build, not to repair"];
  LOG_TYPE_FRICTION = 4 [(seat_may_file) = true, (defined_term) = "friction"];
  // REFUSAL IS EVERY OTHER NO THE TOOL GIVES A SEAT, written by the tool at the moment it refuses.
  // On universe-m13 seats met a dozen refusals — a flag guessed from another verb, a field name
  // typed as a flag, a mint refused at its budget — and filed none: each was classed as the seat's
  // own mistake. The guess is the operator's signal, whoever made it, so the tool keeps it.
  LOG_TYPE_REFUSAL = 6 [(seat_may_file) = false, (means) = "the TOOL refused a seat's call, and recorded it as it refused: the command, the flags given (never their values) and the refusal's first line. Recorded by the tool, not filed by the seat; the seat's own entry says what it expected and where the expectation came from"];
  // FAILURE IS WHAT A REFUSAL CANNOT SEE: a seat's tool call that failed outside the record tool — a
  // jq that misread a shape, a Read of a path that is not there, a script that exited non-zero. On
  // universe-m13 and m14 every one of these went unlogged by the seats that hit them.
  // THE ENGINE'S OWN STOP IS ONE TOO, under the harness seat: the engine threw, and the lead wrote
  // the error with the operator's `engine-stopped`. No outcome goes with it, so the run stays open.
  LOG_TYPE_FAILURE = 7 [(seat_may_file) = false, (means) = "a call FAILED where no verb could see it. A seat's tool call, recorded under that seat as the harness saw it: the tool, what it was aimed at, and the error's first line. Or the ENGINE's own stop, recorded under `harness` with the error it threw: a run the engine stopped, as against one that was cut off. Recorded by the tool, not filed by a seat; a refusal the record tool gave is `refusal`, not this"];
  LOG_TYPE_ESTOPPEL = 5 [(seat_may_file) = false, (means) = "the TOOL refused a mint because the defect lives in text blue applied verbatim from red's own --fix-new. Recorded by the tool, not filed by the seat: argue it on the original gap, or mint with --supersedes so the lineage is explicit"];
}

// Log is the channel addressed to the OPERATOR WHO CAN RETOOL THE SEAT — not to the debate. It
// keeps a missing tool from becoming a silent workaround, and records the tool's own refusals.
//
// THERE IS NO EMPTY FORM. A clean sitting files nothing here: the harness brackets every dispatch
// with sitting_open and sitting_close, so "sat and filed nothing" is on the record without a seat
// asserting it, and an attested-clean sitting stays distinguishable from a channel nobody used.
// Every entry on this channel carries something to act on.
message Log {
  optional string text = 1 [(sql) = { flag: "reason" }, (prose) = true];
  optional LogType type = 2 [(sql) = {
    required: true
    why: "the operator triages this channel by FILTERING on the type; an untyped entry hands the reader back the reading this field exists to replace — measured at 142,891 characters on one run"
  }];
  // SOURCE IS SET BY THE WRITE PATH, NOT ASKED. It is deliberately NOT `required`: that
  // annotation means "a flag the seat supplies", and vocabulary_test enforces exactly that
  // mapping. A seat cannot honestly claim to be the tool, so the seat verb sets SEAT and the
  // tool's own writes set TOOL, at every call site.
  optional LogSource source = 4;
  // `estopped_by` named the prescribing gap beside a count that reads only the type; the text says
  // which gap.
  reserved 3;
  reserved "estopped_by";
}

// Motion, and the SECOND oneof is the whole point.
//
// The old validate keyed on (subject, key): MotionFields[subject] said which enumerated fields a
// motion of that subject carries, and MotionVerdicts[subject] which rulings are legal on it —
// with a comment calling that "the one place the (subject, key) keying can live", because the
// flat EnumFields table could not express it.
//
// A single flat Motion message reproduces exactly that defect in a new syntax: `dimension`
// belongs to a grade motion and `class` to a petition, and a flat message would accept either on
// either, leaving the pairing to a runtime check nothing generates. So the subject IS a oneof,
// and the fields that belong to a subject live inside its own message. A grade motion carrying
// a petition's `class` is then not a validation failure — it is unrepresentable.
//
// THE ARM IS THE SUBJECT, AND NOTHING ELSE CARRIES IT. A grade motion is one whose filing is a
// GradeMotion; Motion.Subject (recordpb/motionsubject.go) reads the arm, and every reader asks it.
// A second field holding the same word could only agree with the arm or contradict it.
message Motion {
  optional string motion_id = 1 [(sql) = {
    required: true
    unique: true
    why: "the id everything else joins on — the tool assigns it, and a motion without one cannot be ruled or rendered"
  }];
  // 2 held the subject, which the filing's arm states. Reserved: a stored motion carries the bytes.
  reserved 2;
  reserved "subject";

  // basis is the ASK in the filer's words. A motion with no argument is a demand, and the ruler
  // has nothing to rule on.
  optional string basis = 3;
  optional string relief = 4;

  oneof filing {
    GradeMotion grade = 10;
    PetitionMotion petition = 11;
    InquiryMotion inquiry = 12;
    DocketMotion docket = 13;
  }
}

// GradeMotion contests a gap's grade on one dimension. Both of its checks belonged to the
// retired `blue dispute` verb and did not come across with it: a motion against a gap that does
// not exist is dropped at replay, and one against a gap already disposed of asks for a
// disposition that has already been made.
message GradeMotion {
  // A grade motion contests a REAL gap's grade. This is the arm whose foreign keys the generator
  // dropped entirely until the golden was read; the referent is now enforced with the vocabulary.
  optional string gap_id = 1 [(sql) = { references: "mint.gap_id" }];
  optional GradeDimension dimension = 2;
  optional Grade proposed = 3;
}

// GradeDimension is the axes a gap is graded on, and the one home of what each axis means: the
// flag that sets an axis (`mint`, `regrade`, `finding`) and the menu of the axis a grade motion
// contests both print the `(means)` here.
//
// Each axis is spelled as the flag that sets it, so a seat learns the pattern from any one of them.
//
// LIKELIHOOD's "never how likely the defect is to BE there" is the clause the likelihood/impact
// split makes necessary: with one grade standing for both, the natural reading is the likelihood
// of the defect being present, and a seat grading on that reading answers the wrong question.
enum GradeDimension {
  GRADE_DIMENSION_UNSPECIFIED = 0;
  GRADE_DIMENSION_SEVERITY = 1 [(means) = "how bad the defect is in itself"];
  GRADE_DIMENSION_LIKELIHOOD = 2 [(means) = "how likely the CONSEQUENCE is — never how likely the defect is to BE there"];
  GRADE_DIMENSION_IMPACT = 3 [(means) = "how bad the consequence is if it lands"];
  GRADE_DIMENSION_COMPLEXITY = 4 [(means) = "what fixing it costs"];
}

// PetitionMotion is the constitutional short-circuit: any party seat may petition the bench.
message PetitionMotion {
  optional PetitionClass class = 1;
}

// THE PETITION CLASSES, AND THIS ENUM WAS NEVER MIGRATED TO THEM.
//
// It carried `integrity | safety | process | scope` while the help, debate.js's PETITIONS schema,
// the report and internal/cli/motion's own Short line all said `ethical | safety | integrity |
// constitutional`. Two of four overlapped, so half the filings worked and half were refused with
// "X is not a petition class" — for a value the seat had just read in `--help`. Measured in the
// fuzz: 22 of 40 `motion petition file` invocations refused.
//
// `process` and `scope` are RESERVED rather than renumbered. No Go code ever referenced them and
// no surface could produce them, so nothing has written a 3 or a 4 — but a number back in service
// silently reinterprets any record that did, and that rule does not bend for values one is
// confident are unused. 1 and 2 keep their numbers because they are the two that worked.
enum PetitionClass {
  reserved 3, 4;
  reserved "PETITION_CLASS_PROCESS", "PETITION_CLASS_SCOPE";

  PETITION_CLASS_UNSPECIFIED = 0;
  PETITION_CLASS_INTEGRITY = 1 [(means) = "proceeding would require asserting what you believe false, or burying a real finding"];
  PETITION_CLASS_SAFETY = 2 [(means) = "proceeding would create or conceal a hazard"];
  PETITION_CLASS_ETHICAL = 5 [(means) = "proceeding would require acting against the interests of someone the run affects"];
  PETITION_CLASS_CONSTITUTIONAL = 6 [(means) = "the instruction itself conflicts with the rules the run is bound by"];
}

// DocketMotion puts a GAP before the bench. The filing is the DOCKETING — a seat escalating a gap
// it cannot settle — and the ruling is the bench's disposition of it.
//
// THE GAP RIDES THE FILING AND NOT THE RULING, which is the whole join. `bench opinion` carried a
// gap_id on the DISPOSITION and no motion id, so a bench ruling joined to nothing and nothing could
// ask whether a gap that reached the bench was ever answered. Here the ask names the gap once, the
// answer names the ask, and the pair is recoverable from either end.
message DocketMotion {
  optional string gap_id = 1 [(sql) = {
    required: true
    flag: "id"
    references: "mint.gap_id"
    why: "which gap is being put before the bench — a docket motion that names no gap is an escalation of nothing"
  }];
}

// DocketRuling is the bench's disposition of a docketed gap: the word that decides its fate, and
// the reasoning that has to travel with it.
//
// IT IS A MESSAGE ARM WHERE ITS THREE SIBLINGS ARE ENUMS, and the reason is these six fields. The
// enum arms say what was decided; only the bench also records WHY, what it weighed, and what would
// reopen it. `record.proto`'s own note above MotionSubject argues the rulings are separate enums
// because the vocabulary is subject-keyed — which docket satisfies, since its vocabulary IS the
// shared Disposition enum. The departure is forced by the reasoning fields, not by the words.
message DocketRuling {
  // ONE QUESTION, TWO ASSERTABLE ANSWERS — a negative that must be stated rather than left empty.
  //
  // "What would reopen this?" has a real answer of "nothing", and that answer must be POSITIVE.
  // Left as an empty `reopens_on` it is indistinguishable from a bench that skipped the field,
  // which is the defect the friction channel carried for eighteen consecutive sittings until
  // `--none` made the empty case sayable. The question is a closing ruling's: a remand closes
  // nothing, so it owes a direction instead (below).
  option (check) = {
    expr: "\"disposition\" = 'remanded' OR \"reopens_on\" IS NOT NULL OR \"final\" IS NOT NULL"
    why: "a ruling that closes the gap owes what would change its outcome: --reopens-on names it, or --final says nothing would. Saying neither leaves the losing party unable to tell a settled question from an unanswered one, which is the difference between a new motion on new grounds and a wasted sitting"
  };

  // REFUSED TOGETHER rather than silently preferring one: a ruling that says both "this is final"
  // and "here is what would undo it" has not decided, and picking for it would record a decision
  // nobody made.
  option (check) = {
    expr: "\"reopens_on\" IS NULL OR \"final\" IS NULL"
    why: "--final says nothing would reopen this and --reopens-on names what would; they are opposite answers to one question, so pass exactly one"
  };

  // A REMAND STATES ITS DIRECTION AND NOTHING THAT REOPENS. A remand sends the gap back to the
  // debate for one more exchange, and the dispatch hands that exchange's two seats — blue and the
  // minting lens — the ruling's `direction` as the research they owe. A remand closes nothing, so
  // neither `reopens_on` nor `final` answers anything on it. A blank is no direction: the check
  // trims what the write path's strings.TrimSpace trims in ASCII (space, tab, newline, carriage
  // return), and a NULL direction fails it, where a bare `trim(NULL) <> ''` would be NULL and pass.
  option (check) = {
    expr: "\"disposition\" <> 'remanded' OR (coalesce(trim(\"direction\", ' ' || char(9, 10, 13)), '') <> '' AND \"reopens_on\" IS NULL AND \"final\" IS NULL)"
    why: "a remand sends the gap back for one more exchange, and --direction is the research that exchange owes blue and the minting lens; a blank one is no direction, and --reopens-on and --final answer what would reopen a closed gap — a remand closes nothing"
  };

  // A DIRECTION IS A REMAND'S. A ruling that closes the gap sends no exchange anywhere, so a
  // direction on it would be research nobody is dispatched to do.
  option (check) = {
    expr: "\"disposition\" = 'remanded' OR \"direction\" IS NULL"
    why: "--direction is the research a remand's one more exchange owes; a ruling that closes the gap sends no exchange, and what would reopen it is --reopens-on"
  };

  // NO `subset` HERE, AND THAT IS THE POINT OF THE FIELD.
  //
  // `subset: "closes"` would admit only the values annotated `(closes) = true` — which is every
  // disposition EXCEPT `remanded`, the one the bench uses 76 times in 77. A ruling that cannot send
  // a gap back to the debate is not the bench's vocabulary; it is red's. The whole set is legal here, and `closes` is read
  // by the gap view to decide the FATE rather than by the column to decide legality.
  optional Disposition disposition = 1 [(sql) = {
    required: true
    flag: "as"
    why: "the bench's word, which decides the gap's fate — `remanded` sends it back to the debate for one more exchange between its minting lens and blue, everything else ends it"
  }];

  optional string principle = 2 [(sql) = {
    required: true
    why: "the rule the bench applied, stated so a later sitting can apply the same one"
  }, (prose) = true];

  // STATED, NEVER BLANK. An empty tension or review flag cannot be told from a bench that skipped
  // the question, so each `why` names what is true to write when the bench has no conflict, or
  // nothing for a human, to report.
  optional string tension = 3 [(sql) = {
    required: true
    why: "the values that pulled against each other — or, where none did, the ruling's weakest point: what a party would argue against the rule you applied"
  }, (prose) = true];

  optional string review_flag = 4 [(sql) = {
    required: true
    flag: "review-flag"
    why: "what a human should look at again — or, where nothing needs a human, what on the record already settles it"
  }, (prose) = true];

  optional string settled = 5 [(sql) = {
    required: true
    allow_empty: true
    why: "what the losing party may no longer assert, as one sentence — not the gap id, and not the disposition"
  }, (prose) = true];

  // What would reopen the gap a ruling closes. A remand states none (the checks above).
  optional string reopens_on = 6 [(sql) = {
    flag: "reopens-on"
    why: "on a ruling that closes the gap: the evidence or condition that would make it worth raising again"
  }, (prose) = true];

  // Recorded only when TRUE. Absent means the ruling answered with `reopens_on` instead; the
  // checks above are what make "neither" and "both" unrepresentable.
  optional bool final = 7;

  // THE RESEARCH A REMAND'S ONE MORE EXCHANGE OWES blue and the minting lens. Every reader of a
  // remand reads this (the "remand" view, the dispatch plan's remand_owed, the work lists).
  optional string direction = 8 [(sql) = {
    flag: "direction"
    why: "on a remand: the research direction its one more exchange owes blue and the minting lens"
  }, (prose) = true];
}

// InquiryMotion rules on an inquiry blue proposed. The id is the INQUIRY's own — an inquiry has
// no separate filing, because blue's proposal IS the filing.
message InquiryMotion {
  optional string inquiry_id = 1;
}

// MotionRule is the ruling, and its verdict set is keyed on the subject in the same way — one
// motion-rule event carries granted|denied for a petition and accepted|rejected for a grade.
// An unrecognized ruling reads as no ruling at all, so a refusal silently becomes permission.
message MotionRule {
  // THE CONSTRAINT THE SHARDED LOG COULD NOT HAVE. Filing and ruling are written by different seats
  // into different files, and replay merged them by timestamp — so a ruling could replay BEFORE its
  // filing, which record/motion.go records in capitals and works around with a second pass. Here it
  // is simply unwritable.
  optional string motion_id = 1 [(sql) = {
    required: true
    // `--id`, the word every verb uses for the thing it is acting on. Without it the flag was
    // derived as `--motion-id`, which no command registers — so the contract gate read the
    // requirement as invisible, and it was right.
    flag: "id"
    // NO `references`, AND THE REASON IS THE DOMAIN RATHER THAN THE MECHANISM.
    //
    // `references: "motion.motion_id"` would read right and be false for one subject: an INQUIRY
    // ruling has no motion row. "The proposal IS the filing" — `motion inquiry rule` names the
    // inquiry's own id, so the referent is an `inquiry`, not a `motion`, and the foreign key would
    // refuse every inquiry ruling.
    //
    // A conditional foreign key is not expressible (a CHECK cannot hold a subquery), and a trigger
    // could enforce it while saying nothing useful — RAISE takes a static string, so a seat would
    // learn only that something was refused. The rule is SUBJECT-AWARE, so it lives where the
    // subject is known: RequireMotionSubjectRef checks a grade or petition ruling against the
    // motions and an inquiry ruling against the inquiries, and says which it could not find.
    //
    // A constraint that is wrong for a third of the cases is worse than none: it refuses correct
    // work, and it reads as a guarantee.
    why: "the motion this answers — a ruling that names no motion is an answer to nothing, and the join it belongs to is the whole of #312"
  }];
  // 2 held the subject, which the ruling's arm states (MotionRule.Subject). Reserved: a stored
  // ruling carries the bytes.
  reserved 2;
  reserved "subject";
  // THE RULER'S ARGUMENT, AND IT IS REQUIRED — which the schema did not say until the docket
  // subject needed it said.
  //
  // `prose()` has always refused an empty `--reason` for every subject's ruling, so the constraint
  // held in fact while the message carried no annotation at all: `CheckRequired` never saw it and
  // the column was nullable. That was survivable while `Opinion.rationale` carried the bench's
  // prose with its own `required` + NOT NULL. The docket ruling puts the bench's argument HERE
  // instead, so the two carriers move here with it rather than being retired.
  //
  // `flag: "reason"` is not decoration: without it flagFor derives `--opinion` from the field name,
  // and CheckRequired would refuse naming a flag no verb registers.
  optional string opinion = 3 [(sql) = {
    required: true
    flag: "reason"
    why: "the ruling's argument in the ruler's words — a ruling with no reasoning is a verdict the losing party cannot answer"
  }, (prose) = true];

  oneof ruling {
    GradeRuling grade = 10;
    PetitionRuling petition = 11;
    InquiryRuling inquiry = 12;
    DocketRuling docket = 13;
  }

  // binds is what the ruling OBLIGES of the coming seats. Enumerated on the ruling side, which
  // the old table could not police: the filing's copy of the enum loop had always existed and
  // the ruling's did not, so the first enumerated field to appear on a ruling was unenforced.
  optional RulingBinds binds = 4;
}

// WHO GRANTED RELIEF BINDS, AND NOT ONE OF ITS OLD VALUES COULD EVER BE PASSED.
//
// It carried `all | filer | none` — a generic "how binding is this" — while the flag's help, the
// hand-written table it renders from, and debate.js all say `blue | red | both`. ZERO overlap, so
// `--binds` was refused for every value a seat could read, and since `--binds` is set exactly
// when a petition is GRANTED, **no granted petition could be recorded at all**. The safety
// short-circuit's grant path did not work. Measured in the fuzz: 8 of 18 `motion petition rule`
// invocations refused, which is the granted half of a 50/50 coin.
//
// The vocabulary here is an ADDRESSEE, not a strength, and that is the point #360 measured: a
// bench granted relief for the coming round and recorded in its own friction that it had "issued
// a direction to red knowing it has no carrier", because the engine threaded relief into exactly
// one prompt. Routing needs someone to route TO. `all | filer | none` cannot say that.
//
// Reserved rather than renumbered, for the reason PetitionClass states: nothing could write these
// numbers, and a number back in service reinterprets any record that did.
enum RulingBinds {
  reserved 1, 2, 3;
  reserved "RULING_BINDS_ALL", "RULING_BINDS_FILER", "RULING_BINDS_NONE";

  RULING_BINDS_UNSPECIFIED = 0;
  RULING_BINDS_BLUE = 4 [(means) = "the relief binds the response seat — what blue must do, or must not, in its coming sitting"];
  RULING_BINDS_RED = 5 [(means) = "it binds the audit seats: the lenses and the chair"];
  RULING_BINDS_BOTH = 6 [(means) = "it binds the whole exchange, and every dispatched seat carries it"];
}

// Occasion is WHAT A SITTING WAS CONVENED TO DO — the question put to the seat, as against the
// seat's identity, which says who was asked.
//
// The two were one thing until the bench collapsed to a single seat. `judge-terminal`,
// `judge-petition-<petitioner>` and `assemble` were separate ids, so the id answered both
// questions at once — and made a petition's FILER part of who answered it, which is why the
// collapse was right. What the collapse did not do was give the question somewhere else to live,
// so four bench sittings a run archive as `judge`, `judge`, `judge`, `judge`.
//
// It was recoverable only by matching the first words of the seat's PROMPT — a fact composed into
// prose at one end and pulled back out by `strings.Contains` at the other. That read has already
// returned the wrong answer once: the kinds were deleted along with the seat ids, the dashboard's
// `Seat == "assemble"` comparisons became unsatisfiable, and every FINISHED run reported "running"
// forever on the engine's own instrument, while the assembly's spend merged into a docket ruling's
// row.
enum Occasion {
  OCCASION_UNSPECIFIED = 0;
  OCCASION_DOCKET = 1 [(means) = "ruling the docket: the gaps that reached impasse and were docketed for adjudication. The chair dispatches this sitting"];
  OCCASION_PETITION = 2 [(means) = "hearing the petitions filed since the bench last sat to hear one. The chair's plan convenes it at the next chair sitting, before any party of that epoch sits"];
  OCCASION_TERMINAL = 3 [(means) = "the terminal disposition at the exit boundary: what still stands, and every motion left unruled. Nothing can be remanded from here"];
  OCCASION_ASSEMBLE = 4 [(means) = "assembling the final report by union-copy. The last step of the run"];
}

// Register is every seat's FIRST record action, and the only event Append does not write —
// RegisterSeat mints it directly, rotating the nonce so a re-dispatched seat writes its own
// shard and the stale instance's shard stays inert.
message Register {
  // tool_version is stamped on the seat's first act, so a run that somehow mixes binaries says
  // so in its own record instead of producing events whose difference nobody can explain.
  optional string tool_version = 1;

  // hook_version is the build of the HOOK that served this seat, exported by the hook itself
  // when it fires (#751).
  //
  // tool_version says which RECORD BINARY served the run. The two come from different places —
  // setup bakes the record binary from the working tree, hooks arrive through the version-gated
  // install cache — so they can be days apart, and nothing said so. Measured 2026-08-23:
  // tool_version 0.72.0, a version no release carried until three days later, under hooks from a
  // release tagged six days earlier that did not contain feov-pretooluse at all. A run whose
  // hooks were stale was byte-identical on the record to one whose hooks were current, and two
  // issues (#512, #555) read that difference as evidence about the identity design.
  //
  // ENGINE-OBSERVED, never typed by a seat — like run_via and agent_id beside it, and refusing
  // the same thing: a seat cannot honestly report which binary injected its environment.
  //
  // ABSENT MEANS NO HOOK STAMPED IT, and that is a real answer rather than a missing one. The
  // hook exports buildid.Revision(), which is `unknown` outside a git tree rather than "", so a
  // firing hook always carries a value; an absent field means a hook that predates this or no
  // hook at all — and `run_via` already says which of those two it was.
  optional string hook_version = 7;

  // THE BINDING BETWEEN A HARNESS AGENT AND A SEAT, AS THE SEAT STATES IT.
  //
  // register is every seat's stated first action: the hook supplies the agent id — the only
  // payload field that discriminates one seat from another — and the seat supplies which seat it
  // is. Recording their join is what turns self-asserted identity into a fact later calls can be
  // held to. The latest register naming an agent decides its seat; an agent no register names is
  // bound by its latest hook bracket where that bracket names a seat (SittingOpen.seat_id) — the
  // record's agent_binding view states the rule.
  //
  // A FIELD, NOT A SIDE TABLE. The alternative was a JSON map the hook keeps, keyed on a seat id
  // recovered by parsing the seat's own command — a fact read back out of prose, whose miss is
  // indistinguishable from an honest absence.
  //
  // ABSENT IS NOT "". A run whose hook never fired carries no agent_id on any register event, and
  // that stays legible as NOT MEASURED rather than reading as an agent whose handle is empty.
  optional string agent_id = 2;

  // WHICH MODEL ACTUALLY ANSWERED THIS SEAT, measured from the seat's own trajectory at register.
  //
  // run-config records what was REQUESTED. Nothing recorded what was SERVED, and the two came
  // apart for 44 of 63 seats across the 2026-08-23 runs: every bulk seat asked for
  // `claude-fable-5` and was answered by `claude-opus-4-8`, for ~$379, with the configured
  // research tier never running. Seats and the assembler read only the request, so a certified
  // report went out describing a methodology that had not happened.
  //
  // ABSENT IS NOT "the configured one". A seat whose trajectory could not be found or read
  // carries neither field, and that stays legible as NOT MEASURED — the distinction the whole
  // defect turned on.
  // THE TRAJECTORY IS THE STATEMENT OF RECORD, so the serving model is READ from it and not
  // copied here. `register` is the seat's FIRST act, and a fresh trajectory's opening records are
  // all `user` turns — the model appears on the first ASSISTANT turn, which by definition has not
  // happened. Measured over a whole run: 45 registers, 43 carrying an agent id, ZERO carrying a
  // served model. Not bad luck; the moment.
  //
  // What the record keeps is `agent_id`, which names the trajectory. Every reader resolves the
  // model from it when asked, so the answer is taken when it exists rather than stored when it
  // cannot. NOT MEASURED stays a distinct answer from "it matched what was configured" — it is
  // now an absent trajectory rather than an absent field.
  reserved 4, 5;
  reserved "served_model", "requested_model";

  // run_via says which path supplied the run directory. A run whose seats all resolve by
  // INFERENCE is a run the PreToolUse hook is not reaching, and nothing else records that.
  //
  // Absent on an IMPLICIT register, and that absence is the honest answer: that path fires when a
  // seat writes before registering, so nothing observed how the run directory was resolved, and a
  // guess would put a fact on the record nobody measured.
  optional string run_via = 3;

  // THE AGENT CONFIGURATION THE HARNESS SAYS THIS SEAT RAN UNDER — attested, never typed.
  //
  // agent_id says WHICH agent; this says which CONFIGURATION it was dispatched as, and the two
  // refuse different things. It is what lets `register` reject a seat id from the wrong family:
  // the roster says an id is a seat, and this says a lead-judge agent may not register as
  // `red-chair`.
  //
  // IT NAMES A CONFIGURATION AND NOT A SITTING. Every red seat now has its own configuration, so
  // the type says WHICH lens rather than merely that it is one — but a configuration is seated
  // once per round, so it still cannot say which round this was. The record keeps the seat id for
  // that. Measured before the split (#290, 2026-08-23), four types covered thirteen seats and
  // `red-auditor` covered the lenses and the chair together, which it could not tell apart at all.
  //
  // ABSENT IS NOT "": a run whose hook never fired carries no attestation on any register event,
  // and that stays legible as NOT MEASURED rather than as an agent configured as nothing.
  optional string agent_type = 6;

  // 8 held `repairs_sitting`, the key of a sitting a register repaired. A register opens a sitting
  // of its own unless it joins the one its agent's bracket opened. Reserved: a stored register
  // carries the bytes.
  reserved 8;
  reserved "repairs_sitting";

  // WHAT THIS SITTING WAS CONVENED TO DO, where the seat id does not already say.
  //
  // RECORDED WHERE IT IS NOT DERIVABLE, AND NOWHERE ELSE. For every seat but the bench, seat id
  // determines the occasion — a lens sitting audits, a lane researches — so a field there would
  // store a derivation the record already holds, which is its own defect. The bench is the one
  // seat whose id stopped determining its question, so the bench is where the question is
  // recorded. If another seat ever collapses the same way, this field is where its occasion goes.
  //
  // REFUSED IN BOTH DIRECTIONS, which is what makes it a fact rather than a hint: the bench MUST
  // supply one, and any other seat supplying one is refused. Without the second half an occasion
  // could be asserted anywhere and mean nothing.
  //
  // ABSENT ON A BENCH REGISTER IS NOT A DEFAULT. It is a record written before this field existed,
  // and it stays legible as NOT MEASURED — never "probably a docket ruling". That distinction is
  // the whole point: `dispatch-parity` reported the bench's own sitting NOT MEASURED rather than
  // passing it, and a guess here would have turned that honest refusal into a quiet pass.
  optional Occasion occasion = 9;
}

// SittingOpen and SittingClose are the two ends of ONE DISPATCH of one harness agent, each
// written by a hook that observed it rather than by the seat it is about.
//
// WHY THEY EXIST: seat durations read ZERO (#265). StartedMs and EndedMs were taken from
// FILESYSTEM MTIMES, so on the fallback path they were equal for every completed seat and the
// duration branch never fired; on a running seat "elapsed" measured time since the last WRITE. A
// span whose ends are file metadata is not a measurement of a sitting, it is a measurement of a
// file, and the dashboard's timing instruments read authoritative while reading nothing.
//
// TWO MESSAGES AND NOT ONE WITH A PHASE FIELD. The event type is derived from the oneof field
// name (recordpb.SetBody), so two fields sharing one message would resolve to whichever came
// first and one of the two ends could never be stamped. They are also genuinely two acts by two
// different hooks, which is what the vocabulary is for.
//
// NEITHER CARRIES A DURATION, deliberately. A span is the difference between two timestamps the
// envelope already holds, and storing it as well would be a third copy of a fact two events state
// — and the copy that goes stale is the one a reader trusts.
message SittingOpen {
  // agent_id IS THE ONLY THING THIS END CAN NAME. SubagentStart carries the harness handle and
  // the agent configuration and NOTHING workflow-supplied (#290, measured 2026-08-23) — the
  // dispatcher's own seat id does not reach it, and no probe sentinel appears in the payload. So
  // the writer resolves the seat from the configuration where it seats exactly one (seat_id
  // below); where it seats several, the seat is the one the agent's register names — the record's
  // agent_binding view joins this handle to that register.
  //
  // That is why the envelope's seat_id on this event is the hook's own origin and not a seat: an
  // id invented here to look seat-shaped would be a guess written into a permanent record.
  optional string agent_id = 1;

  // agent_type is the configuration, and on THIS event it is also the filter that makes the
  // record honest: SubagentStop fires at the MAIN agent's turn end as well, with a minted id and
  // no type (19 seats against 50 turn ends in one measured session, zero exceptions either way —
  // plans/hook-surface-spike.md §7a). An event with no type is not a sitting and is never written.
  optional string agent_type = 2;

  // seat_id is the seat that CONFIGURATION is dispatched as, resolved by the writer — which links
  // the record and can do the join the hook cannot. Present only where the configuration seats
  // exactly one seat, so it is a declared mapping rather than the guess the comment above refuses:
  // blue-researcher covers three seats and gets no seat_id here.
  //
  // It is on the body and NOT on the envelope, which still carries `harness`. The harness observed
  // the sitting; it did not sit. Recording who sat is a different statement from claiming to be
  // them, and a reader that needs the binding should not have to join through a register the seat
  // may never write.
  optional string seat_id = 3;
}

message SittingClose {
  optional string agent_id = 1;

  // THE SEAT'S OWN TRANSCRIPT, WHICH ONLY THIS END IS TOLD. SubagentStop carries
  // agent_transcript_path — the child conversation, at
  // <projects>/<slug>/<session>/subagents/[workflows/wf_*/]agent-<agent_id>.jsonl — and this
  // process ALREADY RECEIVES it: sittingwrite parses it for the turn ingest and then discards the
  // path. Recording it turns "find this seat's trajectory" from a glob over two possible layouts
  // into a column.
  //
  // IT IS THE EXACT PATH RATHER THAN A DERIVATION. The layout has two shapes — a plain subagent
  // sits under `subagents/`, one dispatched by the Workflow tool under
  // `subagents/workflows/wf_<id>/` — so a reader reconstructing it from session_id and agent_id
  // must guess which, and a guess that misses returns "no trajectory", which reads exactly like a
  // seat that never ran.
  optional string agent_transcript_path = 3;

  // agent_type, session_id and prompt_id were the hook payload copied as it came. The hook filters
  // on the payload's type before it writes; the opening end records the configuration.
  reserved 2, 4, 5;
  reserved "agent_type", "session_id", "prompt_id";
}

// SittingLimit is a seat's sitting stopped at the run's per-sitting tool-call limit (the run term
// maxSittingCalls in inputs/run-config.json). The PreToolUse hook counts each seat's calls from its
// register and refuses every call past the limit; the first refusal hands the sitting to
// feov-sitting-write, which writes this under seat `harness`.
//
// UNLIKE THE SPAN ENDS IT NAMES THE SEAT. A limit is counted from a register, so the agent is
// already bound, and the writer resolves the seat from that binding rather than taking it from
// the hook. The sitting is the seat's own sitting number, as events_w counts it: one per opening
// — a register of its own, or a harness bracket that names it — and a sitting-record repair opens
// none.
message SittingLimit {
  // agent_id and agent_type were the hook payload copied as it came; the agent is the input the
  // writer resolves seat_id from, and is not stored.
  reserved 1, 2;
  reserved "agent_id", "agent_type";
  optional string seat_id = 3;
  optional int32 sitting = 4;
  optional int32 limit = 5;
}

// Cast is the run's admissible seats (plans/roundless.md §III.B.1). setup writes it ONCE, under
// seat `harness`, before any seat registers: the areas selected, red-chair, blue-lane-1..N,
// blue-synthesize, blue-respond, frontier, judge, judge-terminal, assemble, and judge-petition-<s>
// for every cast seat s. `register` refuses a seat outside it and so does `dispatch next`. This
// is the table derived-seat-identity.md §III.3 named and did not specify.
message Cast {
  repeated string seat_ids = 1;
  // WHICH OF THOSE SEATS ARE LANES, AS A FIELD, because it cannot be recovered from the ids.
  //
  // Every other seat the engine dispatches has a fixed id and a row on the static roster
  // (internal/seatclass), which carries its role and its tier. Lanes do not: how many a run seats
  // is a run parameter, so no compiled table can name them. The roster carried a PATTERN for them
  // instead, and the tier join, the register gate and the coverage audit each asked that pattern a
  // question — the audit going as far as reading the lane's index back out of its name.
  //
  // A pattern bounds a shape and answers nothing about membership. This is the membership, written
  // by setup, which knows: a subset of seat_ids, refused at the write if it names a seat the cast
  // does not.
  repeated string lane_seat_ids = 2;
}

// Dispatch is the chair engaging ONE party: the seat, the gaps it is engaged on, and the report
// head it is to audit (plans/roundless.md §III.B.1). The chair's `dispatch next` writes one of
// these per ready party in one sitting, so "dispatch D" — the unit the parity audit and the
// exchange counter reason about — is the set written in one chair sitting, read off events_w.
//
// ONE EVENT PER PARTY rather than one event carrying a list of parties, because a body's lists
// are lists of scalars in this schema (schemagen's list tables) and the per-(seat, gap) row is
// the fact that makes a null turn computable: a blue sitting engaged on {G1, G2, G3} that acts on
// G1 took a null turn on G2 and G3. A lens engaged with NO gaps is rule 1's dispatch — the report
// head moved past its pin — and gap_ids is empty, which is "lineage none", not "unknown".
message Dispatch {
  optional int64 pin = 1 [(sql) = {
    required: true
    why: "the events.id of the report head this party audits — the text it anchors to, reconstructible from the record; a dispatch with no pin is a dispatch against a moving target"
  }];
  optional string seat_id = 2 [(sql) = {
    required: true
    flag: "seat"
    why: "the party engaged; refused unless it is in the cast"
  }];
  repeated string gap_ids = 3;
  // occasions is what the BENCH is convened for: `docket` (its gap_ids) and `petition` (the
  // petitions no petition sitting has heard). The bench's one seat id cannot say which question it
  // is asked, so the row says it, and the bench's sitting for each is the one whose register states
  // the same occasion. Required on a bench row and refused on any other seat's, at the write.
  repeated Occasion occasions = 4;
  // 5 held `remand_owed`, the gaps whose remand exchange the row readied. The plan the row was
  // written from is stored whole (Plan), and its `remand_owed` says the same with the direction.
  reserved 5;
  reserved "remand_owed";
}

// Plan is the plan `dispatch next` printed, WHOLE: the bytes of record.Plan as the verb marshals
// them, which the chair relays and the workflow dispatches. The record writes one per decision —
// after the dispatch rows of a plan with parties, and for a plan with none, which writes no row and
// is the one the workflow reads its exit from — and none when the plan asked for is the one stored
// last with no sitting opened since.
//
// BYTES, NOT A MESSAGE, because record.Plan is the plan's one declaration: the engine's schema of
// the relay is generated from that struct, and a message mirroring it would be a second declaration
// to hold level with the first. The write refuses bytes that are not that struct's own encoding.
// Capture compares each relayed plan with the one stored here; nothing else is compared.
message Plan {
  optional string printed = 1 [(sql) = {
    required: true
    why: "the plan as the verb printed it, the original every relay of it is compared with; a plan event with nothing printed records a decision nobody can read"
  }];
}

// Stale is the tool's refusal of a seat's act on a gap that changed since the seat's sitting opened
// (gblock ruling B, 2026-10-19): the act asserts something about the gap — a finding about it, its
// grade, a motion on it — and the seat's read of the gap is the one its sitting opened with, while
// other seats sit concurrently. The refusal shows the seat each act on the gap since, and this event
// is the record that it did.
//
// IT IS THE SEAT'S READ POINT FOR THE GAP, AND NOTHING ELSE. The seat's next act on the gap in the
// same sitting is checked against what changed after `through`, so re-filing once the seat has read
// what it was shown succeeds and needs no flag. The seat and the sitting are the envelope's.
//
// NOT A LOG ENTRY. The log is the operator's channel; the tool's own refusal entry is written there as
// for every refusal. This is a fact the write path reads, so it is a field a writer can refuse.
message Stale {
  optional string gap_id = 1 [(sql) = { references: "mint.gap_id" }];
  // THROUGH IS THE LAST ACT THE REFUSAL SHOWED, not this event's own id: an act on the gap recorded
  // between the check and this write was never shown, and a read point at this event would pass it.
  optional int64 through = 2 [(sql) = { references: "events.id" }];
}

// ReportRead is the tool serving a lens the whole report: the bare and the --json form of the
// report's read with no selector, at the head it served. The seat and the sitting are the envelope's.
//
// IT IS EVIDENCE THE TEXT WAS SERVED, NOT THAT IT WAS READ. Nothing the tool holds can say a seat
// read what it was given; what it can say is that the whole text at this head reached the seat in
// this sitting, which is what a read at an anchor or a selection cannot say.
//
// IT IS THE LENS'S PIN. A lens has audited the report at the head of its latest read in a sitting it
// sat through (lensStates), so a lens whose sitting opened at a head and that was never served the
// report there is still ready at it — the dispatch's own pin is the head the chair asked it to read,
// and opening a sitting is not reading.
message ReportRead {
  optional int64 head = 1 [(sql) = {
    required: true
    references: "events.id"
    why: "the events.id of the report head the text was served at — the latest blue_edit or base_ingest when the read's transaction ran"
  }];
}

// EnvelopeAdmitted is the envelope gate admitting the envelope an agent returned: the PreToolUse hook
// asked the record whether the seat's work list refuses the call that ends its sitting
// (EnvelopeRefusal), and it refused nothing. Written by feov-sitting-write under `harness`, as the
// span ends are: the harness observed the call; the seat asserted nothing.
//
// IT IS WHAT TELLS A FAILED SITTING FROM A FINISHED ONE. A seat dispatched with an envelope schema
// ends its sitting only through that call, so a sitting of a seat whose work arrives as items
// (WorkArrivesAsItems) that closed with no admission ended some other way: its envelope refused
// until the harness gave up, or its agent died (FailedSittings). Without it, the record held the
// same close for both.
//
// THE AGENT IS THE KEY, as it is on the close. An agent id names one subagent invocation, so the
// admission joins the sitting that agent opened; a nudged seat's admission lands after its first
// close and still joins it. One per agent: the same agent admitted again writes nothing.
//
// IT IS THE GATE'S ADMISSION, NOT THE HARNESS'S ACCEPTANCE. The hook runs before the harness checks
// the envelope against its schema, so an admitted envelope the schema then rejects stays admitted.
message EnvelopeAdmitted {
  optional string agent_id = 1 [(sql) = {
    required: true
    why: "the harness's id for the subagent invocation whose envelope was admitted — the key that joins the admission to the sitting that agent opened and the close it ended with"
  }];
}

// Gate carries red's terminal gate on the open board: PASS or FAIL as of this sitting.
//
// IT WAS `RoundVerdict`. The round left the record (plans/roundless.md §III.A.2) and a name that
// carried it would have been the last live surface saying the debate is paced in rounds; the
// table follows the message, so `round_verdict` is `gate` — named from the message it records.
//
// IT WAS `Verdict_`, with a trailing underscore, because `Verdict` is the enum and protoc-gen-go
// would collide the two Go identifiers. That is a real constraint and it was solved in the wrong
// place: the workaround named the MESSAGE after a property of the code generator, and the name
// then travelled all the way into the record as a table called `verdict_` — a Go artifact sitting
// in the schema a human reads to understand the debate.
//
// `Gate` says what it is. The collision is gone because the name is different, not because it was
// decorated, and the wire is unaffected either way: field numbers carry the format, names do not.
message Gate {
  optional Verdict verdict = 1;

  // The open gaps that were MATERIAL when a migration wrote this PASS (gblock, fork (a),
  // 2026-09-15). Migrate does not re-judge an archived PASS under the class rule it predates, so
  // the PASS gate is exempt under `Migrating`; this field is what that exemption leaves behind, so
  // `verify` can tell a PASS migration admitted from a PASS that violated the gate. Without it the
  // two are the same bytes. The write path stamps it, only under `Migrating` and only on a PASS;
  // a live write carrying it is refused, because a PASS that could claim a migration's admission
  // could stand over any open gap. No flag sets it.
  repeated string migration_admitted_gap_ids = 2;
}

// Outcome is the run's TERMINAL act. The verdict is DERIVED from the record — a halt, a recorded
// PASS, or a board at its ceiling — and the bench's --as is a cross-check the tool refuses when it
// disagrees. The one verdict the record cannot derive is UNVERIFIED: the run ended before the
// record reached a terminal state, which the record cannot know from inside, so that word alone
// may be ASSERTED, and the prose is the bench's account of how the sitting ended.
message Outcome {
  optional RunOutcome verdict = 1 [(sql) = {
    required: true
    flag: "as"
    why: "the run's terminal verdict — an outcome event without one records that the run ENDED and not how, and every reader downstream sees a run that never reached a verdict"
  }];
  optional string prose = 2 [(sql) = {
    required: true
    flag: "reason"
    why: "how this run ended, in your words — the verdict is derived from the record, but your account of the sitting is not, and on an UNVERIFIED run it is the only evidence of why the run stopped will ever have"
  }, (feov.record.v1.prose) = true];
  optional string verdict_why = 3;

  // A HAND CENSUS DOES NOT FIND THESE: a grep requiring `.Set(` on one line cannot see a chained
  // builder, where the dot sits at the end of the PREVIOUS line. They come from the frozen key
  // census (testdata/payload-keys.txt), which is why it exists. verdict_basis is read by
  // report/assemble.go.
  //
  // HOW THE RUN ENDED IS THE VERDICT'S TO SAY. `ended` (7) carried `deadlock | ceiling` beside the
  // verdict; before it, two booleans `deadlocked` and `exhausted` (5, 6) that every reader took
  // apart in a first-match switch. Under the roundless record (plans/roundless.md §III.B) both
  // words are facts the record already holds — CEILING is derived from the board, and deadlock is
  // per GAP (impasse, on the dispatch plan) rather than a run-level judgement — so a field
  // restating them was the two-copies shape. Retired; the report reads the verdict.
  optional string verdict_basis = 4;

  reserved 5, 6, 7;
  reserved "deadlocked", "exhausted", "ended";
}

message Position {
  optional string text = 1 [(sql) = { flag: "reason" }, (prose) = true];
}

// Halt is the safety boundary, and it reaches the human as the words the bench chose, relayed
// verbatim — so a halt with no written opinion cannot do its one job.
message Halt {
  optional string opinion = 1 [(sql) = {
    required: true
    flag: "reason"
    why: "the written opinion capture relays verbatim — a halt nobody can read is a stop with no stated cause"
  }, (prose) = true];
}

// Certify is the bench's continuity: what it would want a human to re-examine. The bench keeps
// no memory between runs, so this statement is the whole of it.
message Certify {
  optional string statement = 1 [(sql) = {
    required: true
    flag: "reason"
    why: "what you would want a human to re-examine — the bench keeps no memory between runs, so this statement is its continuity"
  }, (prose) = true];
}

message Declare {
  optional string holding = 1 [(sql) = { flag: "reason" }, (prose) = true];
  // gap_ids are the gaps the holding is about, each a gap the board holds, refused at the write
  // otherwise. Every seat's work list sets each beside where the board says it stands now, so a
  // status the holding's prose states cannot outlive the gap's move. Empty is "names none".
  repeated string gap_ids = 2;
}


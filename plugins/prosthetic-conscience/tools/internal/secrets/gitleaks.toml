# The secrets gate's gitleaks configuration: gitleaks' own default configuration (its rules,
# entropy thresholds, allowlists and keyword prefilter), extended with the rules below. Each rule
# here refuses a real key format the default misses; secrets.go says which, and patterns_test.go
# draws samples of it that only this rule catches. Every rule here carries the tag
# special-circumstances, which is how the tests enumerate them.

title = "special-circumstances secrets gate"

[extend]
useDefault = true

# Every Anthropic key type (sk-ant-api03-, sk-ant-admin01-, sk-ant-oat01-, …) at any body length
# of 20 or more. The default rules take api03 and admin01 only, at exactly 93 characters + AA.
[[rules]]
id = "anthropic-key-any-type"
description = "Anthropic key of any type, any body length of 20 or more"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{20,})'''
entropy = 3
keywords = ["sk-ant-"]
tags = ["special-circumstances"]

# OpenAI project, service-account and admin keys at any body length of 20 or more. The default
# rule needs the T3BlbkFJ marker at a fixed offset and a word boundary after the key, so it
# misses a base64url key that ends in `-` or `_`.
[[rules]]
id = "openai-key-any-length"
description = "OpenAI project, service-account or admin key, any body length of 20 or more"
regex = '''\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,})'''
entropy = 3
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]
tags = ["special-circumstances"]

# PEM, OpenSSH and PGP armor (five dashes) and SSH2 armor (four dashes and a space), followed by
# 64 or more characters of key, with or without the END line. The default rule needs five dashes
# and the END line, so it misses a truncated key (`head` of a key file) and every SSH2 key.
# Armor header lines (Proc-Type:, Version:, Comment:) may come between. Line breaks are real or
# JSON-escaped, so the raw form of an undecodable payload matches too.
[[rules]]
id = "private-key-armor-body"
description = "Private key armor followed by key material, with or without its END line"
regex = '''(?i)-{4,5} ?BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)? ?-{4,5}(?:\s|\\[rn])*(?:[A-Z-]+:[^\r\n]*?(?:\r?\n|\\r?\\n)(?:\s|\\[rn])*)*([A-Z0-9+/=\r\n\\]{64,})'''
secretGroup = 1
entropy = 3
keywords = ["private key"]
tags = ["special-circumstances"]

# A PuTTY .ppk file's private key: the lines after its Private-Lines: header. The default rules
# have no PuTTY rule.
[[rules]]
id = "putty-private-key"
description = "PuTTY .ppk private key lines"
regex = '''Private-Lines: *\d+(?:\r?\n|\\r?\\n)([A-Za-z0-9+/=\r\n\\]{40,})'''
secretGroup = 1
entropy = 3
keywords = ["private-lines:"]
tags = ["special-circumstances"]
